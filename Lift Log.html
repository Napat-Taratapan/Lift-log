<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f6f3;--card:#fff;--ink:#1c1c1a;--mute:#6f6f69;--line:#e3e3dd;--acc:#d9480f;--accbg:#fff0e8;--ok:#2b8a3e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--ink:#efefea;--mute:#9a9a92;--line:#33332f;--acc:#ff8a4c;--accbg:#2c1e16;--ok:#69db7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--ink:#efefea;--mute:#9a9a92;--line:#33332f;--acc:#ff8a4c;--accbg:#2c1e16;--ok:#69db7c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:720px;margin:0 auto;padding:12px 12px 80px}
h1{font-size:20px;margin:6px 0 10px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.nav{display:flex;gap:6px;margin-bottom:12px}
.nav button,.tabs button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.nav button{flex:1}
.nav button.on,.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tabs button{white-space:nowrap;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0;font-size:16px}
.meta{color:var(--mute);font-size:13px;margin:2px 0 6px}
.last{font-size:13px;color:var(--mute);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:8px}
.up{display:inline-block;margin-top:4px;color:var(--ok);font-weight:600}
.row{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
.row span{color:var(--mute);font-size:13px}
.row input{width:100%;text-align:center}
.note{width:100%;margin-top:4px}
.small{font-size:13px;padding:6px 10px}
.acc{color:var(--acc);border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:12px}
.wrap{overflow-x:auto}
.stats{display:flex;gap:8px;margin:8px 0}
.stat{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--mute)}
.pe{display:grid;grid-template-columns:1fr 54px 76px 34px;gap:6px;margin-bottom:6px}
.warn{background:var(--accbg);color:var(--acc);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:13px}
textarea{width:100%;height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
svg{width:100%;height:auto;display:block}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
</style>
</head>
<body>
<main>
<h1>Lift Log</h1>
<div class="nav" id="nav"></div>
<div id="warn"></div>
<div id="app"></div>
</main>
<script>
const KEY='liftlog_v1';
const DEF=[["Monday - Pull",[["Lat Pulldown Machine",3,"8-12"],["Chest-Supported Row Machine",3,"8-12"],["Seated Cable Row",2,"10-15"],["Machine Pullover",2,"10-15"],["Reverse Pec Deck",3,"12-15"],["Preacher Curl Machine",3,"8-12"],["Cable Hammer Curl",2,"10-15"]]],
["Tuesday - Legs",[["Leg Press",4,"8-12"],["Hack Squat Machine",3,"8-12"],["Seated Leg Curl",3,"8-12"],["Leg Extension",3,"10-15"],["Hip Thrust Machine",3,"8-12"],["Adductor Machine",2,"12-15"]]],
["Wednesday - Push",[["Incline Chest Press Machine",4,"6-10"],["Pec Deck",3,"10-15"],["Low-to-High Cable Fly",2,"10-15"],["Machine Lateral Raise",3,"10-15"],["Cable Triceps Pushdown",3,"8-12"],["Overhead Cable Triceps Extension",2,"10-15"]]],
["Thursday - Pull",[["Neutral-Grip Lat Pulldown",3,"8-12"],["High Row Machine",3,"8-12"],["Seated Cable Row",3,"10-12"],["Machine Pullover",2,"10-15"],["Reverse Pec Deck",3,"12-15"],["Preacher Curl Machine",3,"8-12"],["Bayesian Cable Curl",2,"10-15"]]],
["Saturday - Legs",[["Seated Leg Curl",4,"8-12"],["Leg Press",3,"10-15"],["Hack Squat Machine",3,"8-12"],["Hip Thrust Machine",3,"8-12"],["Leg Extension",2,"12-15"],["Lying Leg Curl",2,"10-15"],["Adductor Machine",2,"12-15"]]],
["Sunday - Push",[["Incline Chest Press Machine",4,"6-10"],["Incline Press Machine",3,"8-12"],["Pec Deck",3,"10-15"],["Low-to-High Cable Fly",2,"10-15"],["Machine Lateral Raise",3,"10-15"],["Cable Triceps Pushdown",3,"8-12"]]]];
let storageOK=true;
function defPlan(){return DEF.map((d,i)=>({name:d[0],ex:d[1].map((e,j)=>({id:'d'+i+'_'+j,name:e[0],sets:e[1],range:e[2]}))}))}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.plan&&o.logs)return o}}catch(e){storageOK=false}return{plan:defPlan(),logs:{}}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}warn()}
function warn(){document.getElementById('warn').innerHTML=storageOK?'':'<div class="warn">This browser is blocking saving (private mode?). Entries will be lost when you close the page.</div>'}
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayFor=d=>[5,0,1,2,3,0,4][new Date(d+'T00:00').getDay()];
const ui={tab:'log',date:iso(new Date()),day:0,extra:{},prog:null,wide:{}};
ui.day=dayFor(ui.date);
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
const filled=r=>r&&r.sets&&r.sets.some(s=>s&&num(s.w)!==null);
function lastBefore(id,date){const ds=Object.keys(S.logs).filter(d=>d<date&&filled(S.logs[d][id])).sort();return ds.length?ds[ds.length-1]:null}
function topW(r){return Math.max(...r.sets.map(s=>num(s.w)).filter(x=>x!==null))}
function setsTxt(r){return r.sets.filter(s=>s&&num(s.w)!==null).map(s=>s.w+'×'+(s.r||'?')).join(', ')}
function nav(){document.getElementById('nav').innerHTML=[['log','Workout'],['prog','Progress'],['plan','Plan']].map(t=>`<button class="${ui.tab===t[0]?'on':''}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}
function render(){nav();warn();const a=document.getElementById('app');a.innerHTML=ui.tab==='log'?vLog():ui.tab==='prog'?vProg():vPlan()}

function vLog(){
  if(ui.day>=S.plan.length)ui.day=0;
  const d=S.plan[ui.day];
  let h=`<div class="top"><button class="btn small" data-act="dt" data-v="-1">‹</button><input type="date" id="date" value="${ui.date}"><button class="btn small" data-act="dt" data-v="1">›</button><button class="btn small" data-act="today">Today</button></div>`;
  h+='<div class="tabs">'+S.plan.map((p,i)=>`<button class="${i===ui.day?'on':''}" data-act="day" data-v="${i}">${esc(p.name)}</button>`).join('')+'</div>';
  if(!d.ex.length)return h+'<div class="empty">No exercises yet. Add some in the Plan tab.</div>';
  d.ex.forEach(e=>{
    const rec=(S.logs[ui.date]||{})[e.id]||{sets:[],note:''};
    const lb=lastBefore(e.id,ui.date),lr=lb?S.logs[lb][e.id]:null;
    const n=Math.max(e.sets,rec.sets.length,ui.extra[e.id]||0);
    const hi=parseInt((e.range.split('-')[1]||e.range),10);
    let up='';
    if(lr){const ss=lr.sets.filter(s=>num(s.w)!==null);if(ss.length>=e.sets&&ss.every(s=>(num(s.r)||0)>=hi))up='<div class="up">↑ Hit the top of the range last time. Try a bit heavier.</div>'}
    h+=`<div class="card"><h3>${esc(e.name)}</h3><div class="meta">${e.sets} sets · ${esc(e.range)} reps</div>`;
    if(lr)h+=`<div class="last">Last (${fmt(lb)}): ${esc(setsTxt(lr))}${up}</div>`;
    for(let i=0;i<n;i++){
      const s=rec.sets[i]||{w:'',r:''},ls=lr&&(lr.sets[i]||lr.sets[lr.sets.length-1]);
      h+=`<div class="row"><span>Set ${i+1}</span><input inputmode="decimal" data-id="${e.id}" data-i="${i}" data-f="w" placeholder="${ls&&ls.w?esc(ls.w):'kg'}" value="${esc(s.w)}"><input inputmode="numeric" data-id="${e.id}" data-i="${i}" data-f="r" placeholder="${ls&&ls.r?esc(ls.r):'reps'}" value="${esc(s.r)}"></div>`;
    }
    h+=`<button class="btn small" data-act="addset" data-id="${e.id}">+ set</button><input class="note" data-id="${e.id}" data-f="note" placeholder="Notes" value="${esc(rec.note)}"></div>`;
  });
  return h;
}

function exList(){const o=[];S.plan.forEach(d=>d.ex.forEach(e=>o.push({...e,day:d.name})));return o}
function vProg(){
  const all=exList();if(!all.length)return'<div class="empty">No exercises yet.</div>';
  if(!ui.prog||!all.find(e=>e.id===ui.prog))ui.prog=all[0].id;
  const e=all.find(x=>x.id===ui.prog);
  let h='<select id="psel" style="width:100%;margin-bottom:10px">'+S.plan.map(d=>`<optgroup label="${esc(d.name)}">`+d.ex.map(x=>`<option value="${x.id}"${x.id===ui.prog?' selected':''}>${esc(x.name)}</option>`).join('')+'</optgroup>').join('')+'</select>';
  const ds=Object.keys(S.logs).filter(d=>filled(S.logs[d][e.id])).sort();
  if(!ds.length)return h+'<div class="empty">No sessions logged for this exercise yet.<br>Log one in the Workout tab and it will show up here.</div>';
  const tops=ds.map(d=>topW(S.logs[d][e.id]));
  const first=tops[0],cur=tops[tops.length-1],pr=Math.max(...tops),diff=cur-first;
  h+=`<div class="card"><h3>${esc(e.name)}</h3><div class="meta">${esc(e.day)} · ${esc(e.range)} reps</div><div class="stats"><div class="stat"><b>${cur} kg</b><span>Latest top</span></div><div class="stat"><b>${pr} kg</b><span>Best</span></div><div class="stat"><b>${diff>0?'+':''}${Math.round(diff*10)/10} kg</b><span>Since first</span></div></div>${chart(ds,tops)}</div>`;
  h+='<div class="card wrap"><table><tr><th>Date</th><th>Sets (kg×reps)</th><th>Top</th></tr>'+ds.slice().reverse().map((d,i)=>{const r=S.logs[d][e.id];return`<tr><td>${fmt(d)}</td><td>${esc(setsTxt(r))}${r.note?'<br><span class="meta">'+esc(r.note)+'</span>':''}</td><td>${topW(r)}</td></tr>`}).join('')+'</table></div>';
  return h;
}
function chart(ds,v){
  const W=600,H=200,p=34;
  if(v.length<2)return'<div class="meta">Log at least two sessions to see the trend line.</div>';
  let mn=Math.min(...v),mx=Math.max(...v);if(mn===mx){mn-=1;mx+=1}
  const X=i=>p+i*(W-p-12)/(v.length-1),Y=x=>H-24-(x-mn)*(H-44)/(mx-mn);
  const pts=v.map((x,i)=>X(i)+','+Y(x)).join(' ');
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Top weight over time"><line x1="${p}" y1="${Y(mn)}" x2="${W-12}" y2="${Y(mn)}" stroke="var(--line)"/><line x1="${p}" y1="${Y(mx)}" x2="${W-12}" y2="${Y(mx)}" stroke="var(--line)"/><text x="4" y="${Y(mx)+4}" font-size="12" fill="var(--mute)">${mx}</text><text x="4" y="${Y(mn)+4}" font-size="12" fill="var(--mute)">${mn}</text><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="4" fill="var(--acc)"/>`).join('')}<text x="${p}" y="${H-6}" font-size="12" fill="var(--mute)">${fmt(ds[0])}</text><text x="${W-12}" y="${H-6}" font-size="12" text-anchor="end" fill="var(--mute)">${fmt(ds[ds.length-1])}</text></svg>`;
}

function vPlan(){
  let h='<div class="meta" style="margin-bottom:8px">Edit exercises, sets and rep ranges. Past logs are kept even if you rename or remove an exercise.</div>';
  S.plan.forEach((d,di)=>{
    h+=`<div class="card"><h3>${esc(d.name)}</h3><div class="meta">Exercise · Sets · Reps</div>`;
    d.ex.forEach((e,ei)=>{h+=`<div class="pe"><input data-p="name" data-d="${di}" data-e="${ei}" value="${esc(e.name)}"><input inputmode="numeric" data-p="sets" data-d="${di}" data-e="${ei}" value="${e.sets}"><input data-p="range" data-d="${di}" data-e="${ei}" value="${esc(e.range)}"><button class="btn small" data-act="del" data-d="${di}" data-e="${ei}" aria-label="Remove">✕</button></div>`});
    h+=`<button class="btn small acc" data-act="add" data-d="${di}">+ Add exercise</button></div>`;
  });
  h+=`<div class="card"><h3>Backup</h3><div class="meta">Data lives in this browser only. Copy the text below somewhere safe (notes app, email) to back it up, or paste a backup here and restore it.</div><textarea id="bk">${esc(JSON.stringify(S))}</textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn small" data-act="copy">Copy</button><button class="btn small acc" data-act="restore">Restore from text</button></div><div id="bkmsg" class="meta"></div></div>`;
  return h;
}

const app=document.getElementById('app');
app.addEventListener('input',e=>{
  const t=e.target,id=t.dataset.id;
  if(id){
    const L=S.logs[ui.date]=S.logs[ui.date]||{};
    const r=L[id]=L[id]||{sets:[],note:''};
    if(t.dataset.f==='note')r.note=t.value;
    else{const i=+t.dataset.i;while(r.sets.length<=i)r.sets.push({w:'',r:''});r.sets[i][t.dataset.f]=t.value}
    if(!r.note&&!r.sets.some(s=>s.w!==''||s.r!==''))delete L[id];
    if(!Object.keys(L).length)delete S.logs[ui.date];
    save();
  }else if(t.dataset.p){
    const ex=S.plan[+t.dataset.d].ex[+t.dataset.e];
    ex[t.dataset.p]=t.dataset.p==='sets'?Math.max(1,parseInt(t.value)||1):t.value;
    save();
  }
});
app.addEventListener('change',e=>{
  if(e.target.id==='date'&&e.target.value){ui.date=e.target.value;ui.day=dayFor(ui.date);ui.extra={};render()}
  if(e.target.id==='psel'){ui.prog=e.target.value;render()}
});
document.body.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='tab'){ui.tab=v;render()}
  else if(a==='day'){ui.day=+v;render()}
  else if(a==='dt'){const d=new Date(ui.date+'T00:00');d.setDate(d.getDate()+ +v);ui.date=iso(d);ui.day=dayFor(ui.date);ui.extra={};render()}
  else if(a==='today'){ui.date=iso(new Date());ui.day=dayFor(ui.date);ui.extra={};render()}
  else if(a==='addset'){const id=b.dataset.id,ex=exList().find(x=>x.id===id),rec=(S.logs[ui.date]||{})[id];ui.extra[id]=Math.max(ex.sets,rec?rec.sets.length:0,ui.extra[id]||0)+1;render()}
  else if(a==='add'){S.plan[+b.dataset.d].ex.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:'New exercise',sets:3,range:'8-12'});save();render()}
  else if(a==='del'){const ex=S.plan[+b.dataset.d].ex;if(confirm('Remove '+ex[+b.dataset.e].name+' from the plan?')){ex.splice(+b.dataset.e,1);save();render()}}
  else if(a==='copy'){const t=document.getElementById('bk');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}document.getElementById('bkmsg').textContent=ok?'Copied.':'Text selected. Press copy on your keyboard.'}
  else if(a==='restore'){
    try{const o=JSON.parse(document.getElementById('bk').value);if(!o.plan||!o.logs)throw 0;if(confirm('Replace everything in this browser with this backup?')){S=o;save();render()}}
    catch(x){document.getElementById('bkmsg').textContent='That text is not a valid backup.'}
  }
});
render();
</script>
</body>
</html>
