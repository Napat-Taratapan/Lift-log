<!--
  LIFT LOG — VERSION CONTROL AND AI MAINTENANCE INSTRUCTIONS
  Current version: 1.3.18

  Instructions for future AI-assisted edits:
  1. Keep this version declaration as the first content in the file.
  2. For every new release, increment the version and update the change log below with a concise, specific list of additions, fixes, and behavior changes.
  3. Preserve existing functionality unless a change is explicitly required, and test relevant behavior before delivering the file.
  4. Keep the version shown in the application interface synchronized with this header.
  5. End the file with an explicit end-of-file comment containing the same version number as this header and the interface.
  6. Never claim a test passed unless it was actually run; clearly disclose any testing limitations.

  Version 1.3.18 change log:
  - Export filenames put date/time first and use a short type suffix (e.g. 2026-10-29_143052_LL-bak.txt) so iOS truncation with "..." does not hide the identifying part of the name.

  Version 1.3.17 change log:
  - Rest timer: edge hide now tracks the finger off the side of the screen (no hard on-screen clamp). Dock position is driven by left/top rather than a post-release transform snap. On release it eases the remaining distance into a left or right peek dock; pull or tap the handle to slide it back.

  Version 1.3.16 change log:
  - Settings: heatmap colours are customisable — pick a base colour for Trained and for Planned rest. Volume intensity levels (lighter → stronger) are derived automatically from the trained base via opacity; no need to pick each step.
  - Calendar planned-rest styling and the Activity legend follow the same theme colours.

  Version 1.3.15 change log:
  - Activity heatmap: planned rest days can show a cool (blue) colour when they sit in training context (same week or ±3 days of a logged workout). Rest never counts toward the workout total.
  - Missed planned training days stay empty on the heatmap (not coloured as rest).
  - Calendar day colours sync with the same rules: accent = trained, cool blue = planned rest with context, default = empty/miss. Legend text updated on both views.

  Version 1.3.14 change log:
  - Fixed: sets logged with 0 kg (bodyweight work) were ignored by history, "Last time", PRs, Progress charts, Top Movers, and archiving. A set now counts when weight ≥ 0 and reps are present.
  - Fixed: streak counted any log object (including empty shells or note-only days). It now uses the same has-exercise-history check as the Home week strip and heatmap.
  - Fixed: Calendar day highlighting used a looser "any log object" rule; it now matches dayHasWork so completed days are consistent across Home and Calendar.
  - Fixed: PR detection when editing a past date compared against later sessions. It now only considers strictly earlier dates.
  - Added: default rest-timer duration (minutes) is configurable in Settings → Timer & Alarm.

  Version 1.3.13 change log:
  - Redesigned the Home page as a dashboard: Today card with set-progress ring and Start/Continue button (rest days show the next workout), Mon-Sun week strip, stat tiles (streak, workouts this week, volume vs last week so far), Recent PRs, a 12-week activity heatmap, and Top Movers (est. 1RM gain over 4 weeks) replacing the averaged weekly chart. The four menu buttons were removed since the bottom nav covers them. The Overall chart remains on the Progress tab.

  Version 1.3.12 change log:
  - Fixed: a weekday missing from a weekday-named routine (e.g. Friday in PPL) no longer borrows another day's workout. It is now an implicit Rest Day, which also stops the streak from breaking on planned rest days.
  - Rest days now handle + Exercise / Remove safely and slide animations use the date direction.
  - Fixed: restoring or importing a malformed backup could permanently break the app. All backups (and stored data) are now validated first, dry-run rendered, and rolled back with a clear error if unusable.
  - Fixed: tapping a routine day tab did nothing. It now jumps to that routine day within the currently viewed week.
  - Fixed: rest-timer / PR alarm could be silent on iPhone (audio was created too late and never unlocked). One shared audio context is now unlocked by your first tap, and a failing custom sound falls back to the beep instead of raising a false crash dialog.
  - Fixed: swipes cancelled by iOS (touchcancel) left the page stuck sideways, and starting a swipe during the settle animation nested tracks. Both are handled.
  - Fixed: the same exercise on different days (e.g. Seated Cable Row on Mon and Thu) had separate histories. "Last time" hints, PR detection and Progress charts now share history across same-named exercises (matched by name, so no data migration). The Progress picker lists each exercise once.
  - Fixed: the PR celebration fired on every keystroke and never when weight was entered after reps. It now checks when you finish editing a set, and shows once per new record.
  - Fixed: the lowest bar in Line/Bar charts had zero height and was invisible; bar charts now pad the lower axis bound.
  - Fixed: Remove on an Off-Plan exercise did nothing; it now removes that exercise's logged sets for the viewed date.
  - Fixed: weekly chart labels were one day early in UTC+ time zones (now uses local dates).
  - Fixed: "Custom sound saved!" appeared even when storage was full. Failed saves are now reported and reverted. The custom sound is no longer embedded in backups (it bloated them); restoring keeps your current sound.
  - Hardened: exercise ids and theme colors from backups are escaped / validated before being placed in the page. Decimal reps in imports are rounded instead of dropped.
  - Fixed: unreadable stored data was silently replaced by defaults and then overwritten. A recovery copy is now kept (downloadable from the warning banner and Settings) and the warning text is accurate.

  Version 1.3.11 change log:
  - Routine day tab bar now keeps its scroll position across re-renders and smoothly glides the active day to the center whenever the day changes (swipe, date arrows, tab tap, Today). During a swipe the glide runs in sync with the page slide.
  - Hid the tab bar scrollbar and added touch momentum scrolling.

  Version 1.3.10 change log:
  - Fixed header distortion during physical swipes by keeping the top controls (date navigation, add exercise button, and routine tab bar) completely fixed in place while only sliding the exercise content cards below.
  - Updated swipe track handling so that routine day tabs and date fields update correctly and smoothly as panes transition.

  Version 1.3.9 change log:
  - Fixed SVG path generation bug that caused the line graph on the Progress tab to render incorrectly.
  - Fixed calendar alignment bug where undefined routine days defaulted to Day 1 instead of showing an implicit Rest Day.
  - Fixed drag-and-drop bug where the presence of Off-Plan exercises prevented official routine reordering from saving.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#141413">
<!-- Custom app icon: place icon.png in the same directory as this HTML file. -->
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<title>Lift Log - Workout & Progress Tracker</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#141413;
  --card:#1e1e1c;
  --ink:#efefea;
  --acc:#ff8a4c;
  --mute:#9a9a92;
  --line:#33332f;
  --accbg:#2c1e16;
  --ok:#69db7c;
  --up:#37b24d;
  --down:#f03e3e;
  --onacc:#111;
  --glass-glow: rgba(255,138,76,0.18);
  --glass-border: rgba(255,255,255,0.08);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*:before,*:after{box-sizing:inherit}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  transition: background-color 0.3s ease, color 0.3s ease;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:720px;margin:0 auto;padding:4px 12px 100px;transition:opacity 0.2s ease, transform 0.2s ease; position:relative}

/* Recoverable error dialog */
#error-box:empty{display:none}
#error-box .error-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:20px}
#error-box .error-card{width:min(100%,420px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 60px #0008}
#error-box .error-card h2{margin:0 0 8px;font-size:20px}
#error-box .error-detail{font-size:12px;opacity:.8;white-space:pre-wrap;overflow-wrap:anywhere;max-height:100px;overflow:auto;margin:10px 0}

/* Smooth, subtle entrance when switching app tabs */
#app.tab-enter{animation:tabEnter 280ms cubic-bezier(.2,.75,.25,1) both;will-change:opacity,transform}
#app.day-enter-older{animation:dayEnterOlder 260ms cubic-bezier(.2,.75,.25,1) both;will-change:opacity,transform}
#app.day-enter-newer{animation:dayEnterNewer 260ms cubic-bezier(.2,.75,.25,1) both;will-change:opacity,transform}
@keyframes dayEnterOlder{from{opacity:.55;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}
@keyframes dayEnterNewer{from{opacity:.55;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}
@keyframes tabEnter{
  from{opacity:0;transform:translateY(10px) scale(.995);filter:blur(2px)}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
@media (prefers-reduced-motion:reduce){
  #app.tab-enter,#app.day-enter-older,#app.day-enter-newer{animation:none;will-change:auto}
  *,*:before,*:after{scroll-behavior:auto!important;transition-duration:0.01ms!important;animation-duration:0.01ms!important;animation-iteration-count:1!important}
}

.bar{display:flex;align-items:center;justify-content:space-between;height:48px}
.ttl{font-weight:700;font-size:17px}
.ib{
  width:40px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;font-size:20px;line-height:1;cursor:pointer;padding:0;
  transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.ib:active{transform:scale(0.92)}
h2.sec{font-size:17px;margin:18px 0 2px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
  padding:8px 12px;font:inherit;cursor:pointer;transition:all 0.15s ease;
}
.tabs button{white-space:nowrap;font-size:13px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
.btn:active{transform:scale(0.96)}

input,select,textarea{
  font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:8px;min-width:0;transition:border-color 0.2s ease, box-shadow 0.2s ease;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--glass-glow)}
input[type=color]{width:56px;height:36px;padding:2px;cursor:pointer}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

/* Base Liquid Glass Theme (Premium Apple Style) */
.glass-mode .card, .glass-mode .mb, .glass-mode .stat, .glass-mode .bottom-nav {
  background: linear-gradient(135deg, rgba(45,45,42,0.45) 0%, rgba(25,25,23,0.55) 100%) !important;
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid var(--glass-border) !important;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.3) !important;
}

/* Floating Draggable Clock (Ultra-Premium Glass) */
.glass-mode .timer-widget {
  background: linear-gradient(135deg, rgba(55,55,52,0.5) 0%, rgba(20,20,18,0.65) 100%) !important;
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid rgba(255,255,255,0.12) !important;
  box-shadow: 
    inset 0 1px 1px rgba(255,255,255,0.18), 
    inset 0 -1px 1px rgba(0,0,0,0.3), 
    0 16px 40px rgba(0,0,0,0.55) !important;
}
.glass-mode .timer-widget::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}
.glass-mode .timer-widget > * { position: relative; z-index: 1; }

.card h3{margin:0;font-size:16px;display:flex;align-items:center;justify-content:space-between}
.drag-handle{border:0;background:transparent;color:var(--mute);font-size:21px;line-height:1;padding:3px 8px 3px 0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.exercise-card.dragging{opacity:.72;transform:scale(.992);border-color:var(--acc);box-shadow:0 10px 28px rgba(0,0,0,.24);position:relative;z-index:2}
.exercise-card.drop-target{border-top:3px solid var(--acc)}
.exercise-card{touch-action:pan-y;transition:opacity .16s ease,transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.drag-handle:active{cursor:grabbing}
body.exercise-reordering{user-select:none;-webkit-user-select:none;cursor:grabbing;overscroll-behavior:contain}
.meta{color:var(--mute);font-size:13px;margin:2px 0 6px}
.last{font-size:13px;color:var(--mute);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:8px}
.up{display:block;margin-top:4px;color:var(--ok);font-weight:600}
.row{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px;transition:opacity 0.2s ease}
.row span{color:var(--mute);font-size:13px;transition:color 0.2s ease}
.row input{width:100%;text-align:center}
/* Set Complete Visual State */
.row.set-done{opacity:0.6}
.row.set-done span{color:var(--ok);font-weight:700}

.note{width:100%;margin-top:4px}
.small{font-size:13px;padding:6px 10px}
.acc{color:var(--acc);border-color:var(--acc)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:12px}
.wrap{overflow-x:auto}
.stats{display:flex;gap:8px;margin:8px 0}
.stat{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--mute)}
.pe{display:grid;grid-template-columns:28px 1fr 54px 76px 38px;gap:6px;margin-bottom:6px;align-items:center}
.pe .dh{cursor:grab;color:var(--mute);text-align:center;font-weight:bold;user-select:none}
.warn{background:var(--accbg);color:var(--acc);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:13px}
textarea{width:100%;height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
svg{width:100%;height:auto;display:block}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.cr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}

.hero{padding:16px 4px 12px}
.logo{font-size:40px;line-height:1;font-weight:900;color:var(--acc);text-shadow:3px 3px 0 var(--line)}
.sub{color:var(--mute);margin-top:6px;font-size:13px}
.mb{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;font:inherit;cursor:pointer;
  box-shadow:0 4px 0 var(--line);transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.mb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mb.sel{border-color:var(--acc);box-shadow:0 4px 0 var(--acc)}
.mb.sel:active{box-shadow:0 1px 0 var(--acc)}
.mb .ic{font-size:24px;width:32px;text-align:center}
.mb b{display:block;font-size:17px}
.mb small{color:var(--mute);font-size:13px}
.mb::after{content:"▸";margin-left:auto;color:var(--acc);font-size:20px}

/* Home dashboard */
.dash>*{animation:dashIn .4s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes dashIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dash>*{animation:none}}
.dash .hero{padding:8px 4px 10px}
.dash .logo{font-size:30px}
.today-card{border-color:var(--acc);box-shadow:0 0 28px var(--glass-glow);padding:16px}
.tc-row{display:flex;align-items:center;gap:14px}
.tc-main{flex:1;min-width:0}
.tc-lab{font-size:11px;letter-spacing:1.5px;color:var(--acc);font-weight:800}
.tc-name{font-size:30px;font-weight:900;line-height:1.1;margin:3px 0 4px;overflow-wrap:anywhere}
.tc-sub{color:var(--mute);font-size:13px}
.ring{position:relative;width:68px;height:68px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--line);stroke-width:7}
.ring .fg{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.cta{display:block;width:100%;margin-top:14px;padding:14px;font:inherit;font-size:16px;font-weight:800;border:none;border-radius:14px;background:var(--acc);color:var(--onacc);cursor:pointer;transition:transform .12s ease}
.cta:active{transform:scale(.97)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 10px}
.wk button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--mute);font:inherit;font-size:11px;padding:0;cursor:pointer}
.wk i{display:flex;align-items:center;justify-content:center;width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);color:var(--ink);font-style:normal;font-size:14px;font-weight:700}
.wk .rest i{opacity:.4}
.wk .miss i{border-color:var(--down);color:var(--down);opacity:.75}
.wk .done i{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.wk .now i{box-shadow:0 0 0 3px var(--accbg);border-color:var(--acc)}
.tiles{display:flex;gap:8px;margin-bottom:10px}
.tiles .stat{padding:12px 6px;border:1px solid var(--line)}
.tiles .stat b{font-size:24px;line-height:1.1}
.tiles .up{color:var(--up)}.tiles .dn{color:var(--down)}
.dash h3 small{color:var(--mute);font-weight:400;font-size:12px}
.pr-row,.mv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pr-row:first-of-type,.mv-row:first-of-type{border-top:none}
.pr-row b,.mv-row b{display:block;font-size:14px}
.pr-row small,.mv-row small{color:var(--mute);font-size:12px}
.pr-row .md{margin-left:auto;text-align:right;white-space:nowrap;font-weight:800;color:var(--acc);font-size:13px}
.mv-row .g{margin-left:auto;font-weight:800;color:var(--up);white-space:nowrap;font-size:13px}
.mv-row svg{width:64px;height:22px;flex:none}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px;margin-top:8px}
.hm{display:block;width:100%;aspect-ratio:1;border:0;padding:0;border-radius:4px;background:var(--line);opacity:.5}
.hm.l1{background:var(--heat-train);opacity:.28}.hm.l2{background:var(--heat-train);opacity:.5}.hm.l3{background:var(--heat-train);opacity:.72}.hm.l4{background:var(--heat-train);opacity:1}
.hm.rest{background:var(--heat-rest);opacity:.7}
.hm.fut{background:none;border:1px dashed var(--line);opacity:.35}
.hm.td{outline:2px solid var(--acc);outline-offset:1px;opacity:1}
.heat-legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px;font-size:11px;color:var(--mute);align-items:center}
.heat-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.heat-legend .lg-train{background:var(--heat-train)}
.heat-legend .lg-rest{background:var(--heat-rest);opacity:.9}
.heat-legend .lg-empty{background:var(--line);opacity:.7}
.heat-preview{display:flex;gap:4px;align-items:center;margin-top:8px}
.heat-preview span{width:22px;height:22px;border-radius:5px;background:var(--heat-train);display:block}
.heat-preview span:nth-child(1){opacity:.28}.heat-preview span:nth-child(2){opacity:.5}.heat-preview span:nth-child(3){opacity:.72}.heat-preview span:nth-child(4){opacity:1}
.heat-preview .hp-rest{background:var(--heat-rest);opacity:.7;margin-left:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:12px;color:var(--mute);text-align:center;padding:4px 0}
.cd{
  aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
  font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;cursor:pointer;
  transition:all 0.15s ease;
}
.cd small{font-size:10px;color:var(--mute);line-height:1}
.cd.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
.cd.on small{color:var(--onacc)}
.cd.rest{background:var(--heat-rest-soft);border-color:var(--heat-rest);color:var(--ink)}
.cd.rest small{color:var(--heat-rest-label)}
.cd.td{outline:2px solid var(--acc);outline-offset:1px}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;z-index:90;padding-bottom:env(safe-area-inset-bottom,0px);
}
.bottom-nav button{
  background:none;border:none;color:var(--mute);font:inherit;font-size:11px;display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;padding:6px;width:20%;transition:color 0.15s ease, transform 0.15s ease;
}
.bottom-nav button.active{color:var(--acc);font-weight:bold}
.bottom-nav button .ic{font-size:20px;line-height:1}
.bottom-nav button:active{transform:scale(0.9)}

/* Floating Draggable & Edge-Docking Timer Widget */
.timer-widget{
  position:fixed;bottom:90px;right:20px;
  background:var(--card);border:2px solid var(--acc);border-radius:24px;
  padding:16px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;
  z-index:95;box-shadow:0 16px 40px rgba(0,0,0,0.65);
  animation: popIn 0.35s cubic-bezier(0.18,0.89,0.32,1.28);
  width: 240px; max-width: 90vw;

<script>
// Mobile Haptic Helper
function haptic(ms=10) { if(navigator.vibrate) navigator.vibrate(ms); }

const KEY='liftlog_v2', TKEY='liftlog_theme_v2';
const DEFT={bg:'#141413',card:'#1e1e1c',acc:'#ff8a4c',ink:'#efefea',up:'#37b24d',down:'#f03e3e',heatTrain:'#ff8a4c',heatRest:'#5c7cfa',glass:false,restTimerMin:3,homeGraphType:'line',progGraphType:'line',alarmType:'beep',customAlarmData:''};

const PPL_ROUTINE=[
  ["Monday - Pull",[["Lat Pulldown Machine",3,"8-12"],["Chest-Supported Row Machine",3,"8-12"],["Seated Cable Row",2,"10-15"],["Machine Pullover",2,"10-15"],["Reverse Pec Deck",3,"12-15"],["Preacher Curl Machine",3,"8-12"],["Cable Hammer Curl",2,"10-15"]]],
  ["Tuesday - Legs",[["Leg Press",4,"8-12"],["Hack Squat Machine",3,"8-12"],["Seated Leg Curl",3,"8-12"],["Leg Extension",3,"10-15"],["Hip Thrust Machine",3,"8-12"],["Adductor Machine",2,"12-15"]]],
  ["Wednesday - Push",[["Incline Chest Press Machine",4,"6-10"],["Pec Deck",3,"10-15"],["Low-to-High Cable Fly",2,"10-15"],["Machine Lateral Raise",3,"10-15"],["Cable Triceps Pushdown",3,"8-12"],["Overhead Cable Triceps Extension",2,"10-15"]]],
  ["Thursday - Pull",[["Neutral-Grip Lat Pulldown",3,"8-12"],["High Row Machine",3,"8-12"],["Seated Cable Row",3,"10-12"],["Machine Pullover",2,"10-15"],["Reverse Pec Deck",3,"12-15"],["Preacher Curl Machine",3,"8-12"],["Bayesian Cable Curl",2,"10-15"]]],
  ["Saturday - Legs",[["Seated Leg Curl",4,"8-12"],["Leg Press",3,"10-15"],["Hack Squat Machine",3,"8-12"],["Hip Thrust Machine",3,"8-12"],["Leg Extension",2,"12-15"],["Lying Leg Curl",2,"10-15"],["Adductor Machine",2,"12-15"]]],
  ["Sunday - Push",[["Incline Chest Press Machine",4,"6-10"],["Incline Press Machine",3,"8-12"],["Pec Deck",3,"10-15"],["Low-to-High Cable Fly",2,"10-15"],["Machine Lateral Raise",3,"10-15"],["Cable Triceps Pushdown",3,"8-12"]]]
];

const CUSTOM_ROUTINE=[
  ["Day 1 - Chest",[["Barbell Bench Press",4,"6-10"],["Incline Dumbbell Press",3,"8-12"],["Cable Flyes",3,"10-15"]]],
  ["Day 2 - Quads & Calves",[["Barbell Back Squat",4,"6-10"],["Leg Press",3,"8-12"],["Standing Calf Raise",4,"12-15"]]],
  ["Day 3 - Back",[["Barbell Deadlift",3,"5"],["Lat Pulldown",4,"8-12"],["Bent-Over Barbell Row",3,"8-12"]]],
  ["Day 4 - Shoulders",[["Overhead Press",4,"6-10"],["Dumbbell Lateral Raise",4,"12-15"],["Face Pulls",3,"12-15"]]],
  ["Day 5 - Hamstrings & Lower Back",[["Romanian Deadlift",4,"8-12"],["Lying Leg Curl",4,"10-12"],["Hyper-Extensions",3,"12-15"]]],
  ["Day 6 - Arms",[["Barbell Curl",4,"8-12"],["Skull Crushers",4,"8-12"],["Hammer Curls",3,"10-12"],["Tricep Rope Pushdowns",3,"10-15"]]],
  ["Day 7 - Rest",[]]
];

function buildPlan(arr){return arr.map((d,i)=>({name:d[0],ex:d[1].map((e,j)=>({id:'d'+i+'_'+j+'_'+Math.random().toString(36).substr(2,4),name:e[0],sets:e[1],range:e[2]}))}))}

let storageOK=true, loadProblem=null;

/* Validates and normalizes a state object (stored data or imported backup).
   Throws an Error with a readable message when the structure is unusable. */
function sanitizeImportedState(o){
  const bad=m=>{throw new Error(m)};
  const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
  if(!isObj(o)) bad('Backup must be a JSON object.');
  if(!isObj(o.routines)) bad('Backup must contain "routines".');
  if(!isObj(o.logs)) bad('Backup must contain "logs".');
  const rKeys=Object.keys(o.routines);
  if(!rKeys.length) bad('Backup contains no routines.');
  rKeys.forEach(k=>{
    const plan=o.routines[k];
    if(!Array.isArray(plan)) bad('Routine "'+k+'" must be a list of workout days.');
    plan.forEach((day,di)=>{
      if(!isObj(day)) bad('Routine "'+k+'", day '+(di+1)+' is invalid.');
      if(typeof day.name!=='string') bad('Routine "'+k+'", day '+(di+1)+' has no name.');
      if(!Array.isArray(day.ex)) bad('Routine "'+k+'", day "'+day.name+'" has no exercise list.');
      day.ex.forEach((e,ei)=>{
        if(!isObj(e)||typeof e.id!=='string'||!e.id||typeof e.name!=='string')
          bad('Routine "'+k+'", day "'+day.name+'", exercise '+(ei+1)+' is missing an id or name.');
        const sets=Math.round(Number(e.sets));
        e.sets=Number.isFinite(sets)&&sets>=1&&sets<=50?sets:3;
        e.range=(e.range===undefined||e.range===null||String(e.range).trim()==='')?'8-12':String(e.range);
      });
    });
  });
  const logs={};
  Object.keys(o.logs).forEach(date=>{
    const day=o.logs[date];
    if(!isObj(day)) return;
    const cleanDay={};
    Object.keys(day).forEach(exId=>{
      const rec=day[exId];
      if(!isObj(rec)) return;
      rec.sets=(Array.isArray(rec.sets)?rec.sets:[]).map(st=>isObj(st)?st:{w:'',r:''});
      if(typeof rec.note!=='string') rec.note=rec.note==null?'':String(rec.note);
      cleanDay[exId]=rec;
    });
    logs[date]=cleanDay;
  });
  let archived={};
  if(isObj(o.archivedExercises)){
    Object.keys(o.archivedExercises).forEach(id=>{
      const a=o.archivedExercises[id];
      if(isObj(a)&&typeof a.name==='string') archived[id]=a;
    });
  }
  let active=o.activeRoutine;
  if(typeof active!=='string'||!o.routines[active]) active=o.routines.ppl?'ppl':rKeys[0];
  return {activeRoutine:active,routines:o.routines,logs,archivedExercises:archived};
}

function loadState(){
  let r=null;
  try{ r=localStorage.getItem(KEY); }catch(e){ storageOK=false; }
  if(r){
    try{
      return sanitizeImportedState(JSON.parse(r));
    }catch(e){
      loadProblem='Your saved workout data could not be read ('+(e.message||'unknown error')+'). A recovery copy was kept and the app started with fresh defaults.';
      try{ if(!localStorage.getItem(KEY+'_corrupt')) localStorage.setItem(KEY+'_corrupt', r); }catch(_){}
    }
  }
  return {
    activeRoutine:'ppl',
    routines:{ppl:buildPlan(PPL_ROUTINE),custom:buildPlan(CUSTOM_ROUTINE)},
    logs:{}
  };
}

/* Safely applies an imported backup: validate, dry-run every view, roll back on failure. */
function applyImportedState(o){
  const next=sanitizeImportedState(o);
  const prevS=S, prevDay=ui.day, prevProg=ui.prog;
  S=next;
  try{
    normalizeLogNumbers(S);
    pruneArchivedExercises();
    vHome(); vLog(); vCal(); vProg(); vSet(); calcStreak();
  }catch(err){
    S=prevS; ui.day=prevDay; ui.prog=prevProg;
    throw new Error('Backup data is not usable ('+(err&&err.message||err)+'). Nothing was changed.');
  }
  if(o.theme&&typeof o.theme==='object'){ T=cleanTheme({customAlarmData:T.customAlarmData,...o.theme}); _customAudioEl=null; saveTheme(); applyTheme(); }
  saveState(0);
}

/* Theme copy for backups: the custom sound is large and device-specific, so it is left out. */
function themeForBackup(){ const {customAlarmData, ...rest} = T; return rest; }

/* Keeps only well-formed theme values (also used for imported backups). */
function cleanTheme(t){
  const out = {...DEFT};
  if(!t || typeof t !== 'object' || Array.isArray(t)) return out;
  const hex = /^#[0-9a-fA-F]{6}$/;
  ['bg','card','acc','ink','up','down','heatTrain','heatRest'].forEach(k=>{ if(typeof t[k]==='string' && hex.test(t[k])) out[k]=t[k]; });
  out.glass = !!t.glass;
  const m = Number(t.restTimerMin);
  if(Number.isFinite(m) && m>0 && m<=60) out.restTimerMin = m;
  if(t.homeGraphType==='line'||t.homeGraphType==='bar') out.homeGraphType = t.homeGraphType;
  if(t.progGraphType==='line'||t.progGraphType==='bar') out.progGraphType = t.progGraphType;
  if(['beep','digital','custom'].includes(t.alarmType)) out.alarmType = t.alarmType;
  if(typeof t.customAlarmData==='string' && t.customAlarmData.startsWith('data:audio/')) out.customAlarmData = t.customAlarmData;
  return out;
}

function loadTheme(){
  try{
    const r=localStorage.getItem(TKEY);
    if(r){
      const o=JSON.parse(r);
      return cleanTheme(o);
    }
  }catch(e){}
  return {...DEFT};
}

let S=loadState(), T=loadTheme();
function normalizeLogNumbers(state){
  Object.values(state.logs||{}).forEach(day=>Object.values(day||{}).forEach(record=>{
    (record&&record.sets||[]).forEach(set=>{
      if(!set) return;
      if(set.w!=='' && set.w!==null && set.w!==undefined){const w=Number(set.w);set.w=Number.isFinite(w)&&w>=0?w:'';}
      if(set.r!=='' && set.r!==null && set.r!==undefined){const r=Number(set.r);set.r=Number.isFinite(r)&&r>=0?Math.round(r):'';}
    });
  }));
}
normalizeLogNumbers(S);

/* Debounced persistence to reduce race conditions on rapid input */
let _saveTimer = null;
function saveStateImmediate(){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    storageOK = true;
  }catch(e){
    storageOK = false;
  }
  warn();
}
function saveState(debounceMs){
  if(debounceMs === 0 || debounceMs === false){
    if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; }
    saveStateImmediate();
    return;
  }
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    _saveTimer = null;
    saveStateImmediate();
  }, typeof debounceMs === 'number' ? debounceMs : 280);
}
function saveTheme(){try{localStorage.setItem(TKEY,JSON.stringify(T));return true}catch(e){return false}}
function warn(){
  const el = document.getElementById('warn');
  if(!el) return;
  let h = '';
  if(loadProblem){
    h += '<div class="warn">'+esc(loadProblem)+' <button class="btn small" data-act="dlrecovery" style="margin-top:6px">Download recovery copy</button></div>';
  }
  if(!storageOK){
    h += '<div class="warn">Private mode or storage quota exceeded: data may not persist when closing the page.</div>';
  }
  el.innerHTML = h;
}

/* Strict ISO date validation (YYYY-MM-DD). Use UTC so local timezone/DST
   offsets cannot reject valid calendar dates such as UK summer dates. */
function isValidISODate(str){
  if(typeof str !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(str)) return false;
  const d = new Date(str + 'T00:00:00Z');
  return !isNaN(d.getTime()) && d.toISOString().slice(0,10) === str;
}
function safeDate(str, fallback){
  return isValidISODate(str) ? str : (fallback || iso(new Date()));
}

const h2r=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const r2h=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=h2r(a),B=h2r(b);return r2h(A.map((v,i)=>v*t+B[i]*(1-t)))};
const lum=h=>{const[r,g,b]=h2r(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};

function applyTheme(){
  const s=document.documentElement.style;
  s.setProperty('--bg',T.bg);s.setProperty('--card',T.card);s.setProperty('--acc',T.acc);s.setProperty('--ink',T.ink);
  s.setProperty('--up',T.up||'#37b24d');s.setProperty('--down',T.down||'#f03e3e');
  s.setProperty('--mute',mix(T.ink,T.bg,.55));s.setProperty('--line',mix(T.ink,T.card,.16));s.setProperty('--accbg',mix(T.acc,T.card,.16));
  s.setProperty('--onacc',lum(T.acc)>.45?'#111111':'#ffffff');s.setProperty('--ok',lum(T.bg)>.5?'#2b8a3e':'#69db7c');
  const heatTrain=T.heatTrain||T.acc||'#ff8a4c';
  const heatRest=T.heatRest||'#5c7cfa';
  s.setProperty('--heat-train',heatTrain);
  s.setProperty('--heat-rest',heatRest);
  const hr=h2r(heatRest);
  s.setProperty('--heat-rest-soft',`rgba(${hr[0]},${hr[1]},${hr[2]},0.22)`);
  s.setProperty('--heat-rest-label',mix(heatRest,T.ink,.4));
  const rgb=h2r(T.acc);
  s.setProperty('--glass-glow',`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.25)`);
  if(T.glass) {
    document.body.classList.add('glass-mode');
    document.querySelector('.timer-widget').style.border = '1px solid rgba(255,255,255,0.12)';
  } else {
    document.body.classList.remove('glass-mode');
    document.querySelector('.timer-widget').style.border = '2px solid var(--acc)';
  }
}

const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=d=>{
  if(!isValidISODate(d)) return String(d||'');
  return new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const getPlan=()=>S.routines[S.activeRoutine]||S.routines.ppl;
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const dayIdx=d=>{
  if(!isValidISODate(d)) return -1;
  const dt = new Date(d+'T00:00');
  const dayName = WD[dt.getDay()].toLowerCase();
  const plan = getPlan();
  let idx = plan.findIndex(p=>p.name.toLowerCase().includes(dayName));
  if (idx !== -1) return idx;
  
  /* Weekday-named routine (e.g. PPL without a Friday): a missing weekday is an implicit Rest Day. */
  const namesWeekdays = plan.some(p => WD.some(n => p.name.toLowerCase().includes(n.toLowerCase())));
  if (namesWeekdays) return -1;
  
  let dow = dt.getDay();
  let fallback = dow === 0 ? 6 : dow - 1;
  return fallback < plan.length ? fallback : -1;
};

const dayFor=d=>dayIdx(d);
const now=new Date();
const ui={tab:'home',date:iso(now),day:0,extra:{},homeMetric:'1rm',homeGraphType:T.homeGraphType||'line',progGraphType:T.progGraphType||'line',cm:{y:now.getFullYear(),m:now.getMonth()}};
let lastRenderedTab=null;
let lastRenderedDate=null;
let lastRenderedDay=null;
ui.day=dayFor(ui.date);
const num=v=>{
  if(v===''||v===null||v===undefined) return null;
  const n=Number(v);
  return Number.isFinite(n) ? n : null;
};
/* A set counts when both weight and reps are present. Weight may be 0 (bodyweight). */
const filled=r=>r&&Array.isArray(r.sets)&&r.sets.some(s=>{
  if(!s) return false;
  const w=num(s.w), rps=num(s.r);
  return w!==null && w>=0 && rps!==null && rps>=0;
});
const normName=n=>String(n??'').trim().toLowerCase();
/* All exercise ids (any routine, plus archived) that share this exercise's name. */
function relatedIds(id){
  const names={}, byName={};
  const add=(i,n)=>{const k=normName(n); if(!k||(i in names)) return; names[i]=k; (byName[k]=byName[k]||[]).push(i);};
  Object.values(S.routines||{}).forEach(plan=>(plan||[]).forEach(d=>(d.ex||[]).forEach(e=>add(e.id,e.name))));
  Object.entries(S.archivedExercises||{}).forEach(([i,e])=>add(i,e&&e.name));
  const k=names[id];
  return k?byName[k]:[id];
}
/* Most recent earlier session of this exercise (or any same-named exercise): {date, rec} */
function lastBeforeRec(id,date){
  if(!isValidISODate(date)) return null;
  const rel=relatedIds(id);
  const ds=Object.keys(S.logs).filter(d=>d<date&&S.logs[d]&&rel.some(r=>S.logs[d][r]&&filled(S.logs[d][r]))).sort();
  if(!ds.length) return null;
  const d=ds[ds.length-1];
  let best=null;
  rel.forEach(r=>{const x=S.logs[d][r]; if(x&&filled(x)&&(!best||topW(x)>topW(best))) best=x;});
  return {date:d,rec:best};
}
function lastBefore(id,date){
  if(!isValidISODate(date)) return null;
  const ds=Object.keys(S.logs).filter(d=>d<date&&S.logs[d]&&S.logs[d][id]&&filled(S.logs[d][id])).sort();
  return ds.length?ds[ds.length-1]:null;
}
function topW(r){
  const vals=(r&&r.sets||[]).map(s=>num(s.w)).filter(x=>x!==null&&x>0);
  return vals.length ? Math.max(...vals) : 0;
}
function est1RM(r){
  const vals=(r&&r.sets||[]).map(s=>{
    const w=num(s.w), reps=num(s.r);
    if(w===null||w<=0||reps===null||reps<0) return 0;
    return w*(1+reps/30);
  }).filter(v=>v>0);
  return vals.length ? Math.max(...vals) : 0;
}
function setsTxt(r){return (r&&r.sets||[]).filter(s=>s&&num(s.w)!==null).map(s=>s.w+'×'+(s.r||'?')).join(', ')}
function exList(){
  const o=[];
  getPlan().forEach(d=>d.ex.forEach(e=>o.push({...e,day:d.name})));
  const activeIds=new Set(o.map(e=>e.id));
  Object.entries(S.archivedExercises||{}).forEach(([id,e])=>{
    if(!activeIds.has(id) && Object.values(S.logs||{}).some(day=>day&&day[id]&&hasExerciseHistory(day[id])))
      o.push({...e,id,day:'Archived exercise'});
  });
  return o;
}

function pruneArchivedExercises(){
  if(!S.archivedExercises) return false;
  let changed = false;
  Object.keys(S.archivedExercises).forEach(id=>{
    const stillHasHistory = Object.values(S.logs||{}).some(day=>day&&day[id]&&hasExerciseHistory(day[id]));
    if(!stillHasHistory){
      delete S.archivedExercises[id];
      changed = true;
    }
  });
  if(changed && Object.keys(S.archivedExercises).length === 0){
    delete S.archivedExercises;
  }
  return changed;
}

function calcStreak(){
  let streak=0, d=new Date();
  for(let i=0;i<60;i++){
    const ds=iso(d);
    if(dayHasWork(ds)){ streak++; }
    else {
      const idx=dayIdx(ds);
      if(idx<0 || getPlan()[idx].ex.length===0){ /* Rest day (planned or implicit) preserves streak */ }
      else if(i>0){ break; }
    }
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function getWeeklyProgressData(metric){
  const dates=Object.keys(S.logs||{}).filter(isValidISODate).sort();
  if(!dates.length) return [];
  
  const weeks={};
  dates.forEach(d=>{
    const dt=new Date(d+'T00:00');
    if(isNaN(dt.getTime())) return;
    const day = dt.getDay(), diff = dt.getDate() - day + (day === 0 ? -6 : 1);
    const mon = iso(new Date(dt.setDate(diff)));
    
    if(!weeks[mon]) weeks[mon]={sum1RM:0, count1RM:0, sumVol:0, sumTopW:0, countTopW:0};
    
    Object.keys(S.logs[d]).forEach(exId=>{
      const r=S.logs[d][exId];
      if(filled(r)){
        const rm=est1RM(r);
        const tw=topW(r);
        const vol=r.sets.reduce((a,s)=>a+((num(s.w)||0)*(num(s.r)||0)),0);
        
        if(rm>0){ weeks[mon].sum1RM+=rm; weeks[mon].count1RM++; }
        if(tw>0){ weeks[mon].sumTopW+=tw; weeks[mon].countTopW++; }
        weeks[mon].sumVol+=vol;
      }
    });
  });

  const wKeys=Object.keys(weeks).sort();
  return wKeys.map(w=>{
    const item=weeks[w];
    let val=0;
    if(metric==='1rm') val = item.count1RM ? Math.round(item.sum1RM / item.count1RM) : 0;
    else if(metric==='vol') val = Math.round(item.sumVol);
    else if(metric==='top') val = item.countTopW ? Math.round(item.sumTopW / item.countTopW) : 0;
    return { week: w, val: val };
  });
}

let _audioCtx=null, _audioPrimed=false, _customAudioEl=null;
function getAudioCtx(){
  try{
    if(!_audioCtx){ const C=window.AudioContext||window.webkitAudioContext; if(C) _audioCtx=new C(); }
    return _audioCtx;
  }catch(e){ return null; }
}
/* iOS only allows audio that was unlocked inside a user gesture, so this runs on every tap. */
function unlockAudio(){
  const ctx=getAudioCtx();
  if(ctx){
    if(ctx.state==='suspended'){ try{ ctx.resume().catch(()=>{}); }catch(e){} }
    if(!_audioPrimed){
      try{
        const src=ctx.createBufferSource();
        src.buffer=ctx.createBuffer(1,1,22050);
        src.connect(ctx.destination);
        src.start(0);
        _audioPrimed=true;
      }catch(e){}
    }
  }
  if(T.alarmType==='custom' && T.customAlarmData && !_customAudioEl){
    try{
      const a=new Audio(T.customAlarmData);
      a.preload='auto'; a.volume=0;
      const pr=a.play();
      if(pr && pr.then) pr.then(()=>{ a.pause(); a.currentTime=0; a.volume=1; _customAudioEl=a; }).catch(()=>{});
    }catch(e){}
  }
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchend', unlockAudio, {passive:true});

function playBeepAlarm(type){
  const ctx=getAudioCtx();
  if(!ctx) return;
  try{
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    const t0=ctx.currentTime;
    if(type==='digital'){
      for(let i=0; i<4; i++){
        const osc=ctx.createOscillator(); const gain=ctx.createGain();
        osc.type='square'; osc.frequency.setValueAtTime(1400, t0 + i*0.15);
        gain.gain.setValueAtTime(0.04, t0 + i*0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + i*0.15 + 0.1);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0 + i*0.15); osc.stop(t0 + i*0.15 + 0.1);
      }
    } else {
      const osc=ctx.createOscillator(); const gain=ctx.createGain();
      osc.type='sine'; osc.frequency.setValueAtTime(880, t0);
      gain.gain.setValueAtTime(0.1, t0);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.4);
    }
  }catch(e){}
}
function playAlarm(){
  const type = T.alarmType || 'beep';
  if(type === 'custom' && T.customAlarmData){
    try{
      const a=_customAudioEl || new Audio(T.customAlarmData);
      a.currentTime=0; a.volume=1;
      const pr=a.play();
      if(pr && pr.catch) pr.catch(()=>playBeepAlarm('beep'));
      return;
    }catch(e){}
  }
  playBeepAlarm(type === 'digital' ? 'digital' : 'beep');
}

let timerInterval=null, timerSecs=0, timerTotalSecs=0, targetEndTime=0;
function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  targetEndTime = 0;
  timerSecs = 0;
  const box = document.getElementById('timer-box');
  if(box) box.style.display = 'none';
}
function startTimer(durationInSeconds){
  stopTimer();
  if(!Number.isFinite(durationInSeconds) || durationInSeconds <= 0) return;
  timerTotalSecs = durationInSeconds;
  targetEndTime = Date.now() + (durationInSeconds * 1000);
  
  const box = document.getElementById('timer-box');
  if(!box) return;
  box.style.display='flex';
  box.classList.remove('docked-left','docked-right');
  
  const ring = document.getElementById('timer-ring');
  if(ring) {
    ring.style.transition = 'none';
    ring.style.strokeDashoffset = 0;
    setTimeout(() => { if(ring) ring.style.transition = 'stroke-dashoffset 1s linear'; }, 50);
  }
  
  updateTimerLogic();
  timerInterval = setInterval(updateTimerLogic, 1000);
}

function updateTimerLogic() {
  if (targetEndTime === 0) return;
  const now = Date.now();
  timerSecs = Math.max(0, Math.round((targetEndTime - now) / 1000));
  
  updateTimerUI();
  
  if (timerSecs <= 0) {
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    targetEndTime = 0;
    playAlarm();
    haptic([200,100,200,100,200]);
  }
}

function updateTimerUI(){
  const m=Math.floor(timerSecs/60), s=timerSecs%60;
  document.getElementById('timer-val').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  const ring = document.getElementById('timer-ring');
  if (ring && timerTotalSecs > 0) {
    const pct = Math.max(0, Math.min(1, timerSecs / timerTotalSecs));
    ring.style.strokeDashoffset = 283 - (283 * pct);
  }
}

function promptCustomTimer(){
  const input = prompt("Enter timer duration in minutes (e.g. 1.5 for 1 min 30 sec):", (T.restTimerMin || 3));
  if(input !== null){
    const minutes = parseFloat(input);
    if(!isNaN(minutes) && minutes > 0) startTimer(minutes * 60);
  }
}

const _prSeen=new Set();
function checkPR(exId, weight, reps){
  const w = num(weight);
  const r = num(reps);
  if(w === null || w <= 0 || r === null || r < 0) return;
  const current1RM = w * (1 + r / 30);
  if(!Number.isFinite(current1RM) || current1RM <= 0) return;
  let bestPrev = 0;
  const rel = relatedIds(exId);
  Object.keys(S.logs || {}).forEach(d=>{
    /* Only earlier sessions count as the baseline (ISO dates sort lexicographically). */
    if(d >= ui.date || !S.logs[d]) return;
    rel.forEach(rid=>{
      if(S.logs[d][rid]){
        const prevRM = est1RM(S.logs[d][rid]);
        if(prevRM > bestPrev) bestPrev = prevRM;
      }
    });
  });
  if(bestPrev > 0 && current1RM > bestPrev * 1.001){
    const key = ui.date+'|'+exId+'|'+Math.round(current1RM*10);
    if(_prSeen.has(key)) return;
    _prSeen.add(key);
    showPRModal(w, r, Math.round(current1RM));
  }
}

function showPRModal(w, r, rm){

  document.getElementById('pr-modal-box').innerHTML = `

        <h2>🎉 NEW PR RECORD!</h2>
        <p><b>${w} kg × ${r} reps</b></p>
        <p>Est. 1RM Strength: <b>${rm} kg</b></p>
        <button class="btn acc" style="margin-top:14px;width:100%" onclick="this.closest('.pr-modal-overlay').remove()">KEEP LIFTING! 🔥</button>
      </div>
    </div>
  `;
}

/* Date of the given routine day within the Mon-Sun week that contains refDate. */
function dateForDayIdx(idx, refDate){
  const d = new Date(safeDate(refDate) + 'T00:00');
  const dow = d.getDay();
  d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
  for(let i=0; i<7; i++){
    const ds = iso(d);
    if(dayIdx(ds) === idx) return ds;
    d.setDate(d.getDate() + 1);
  }
  return null;
}

function tabsTargetLeft(el){
  const btn=el.querySelector('button.on');
  if(!btn) return null;
  const er=el.getBoundingClientRect(), br=btn.getBoundingClientRect();
  const t=el.scrollLeft+(br.left-er.left)-(el.clientWidth-br.width)/2;
  return Math.max(0,Math.min(t,el.scrollWidth-el.clientWidth));
}
function animateTabsScroll(el,to,dur=300){
  if(!el||to===null) return;
  if(el._tabRaf) cancelAnimationFrame(el._tabRaf);
  const from=el.scrollLeft, delta=to-from;
  if(Math.abs(delta)<1){ el.scrollLeft=to; return; }
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){ el.scrollLeft=to; return; }
  const t0=performance.now();
  const ease=x=>1-Math.pow(1-x,4);
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur);
    el.scrollLeft=from+delta*ease(p);
    if(p<1) el._tabRaf=requestAnimationFrame(step); else el._tabRaf=null;
  };
  el._tabRaf=requestAnimationFrame(step);
}

function render(skipAnim = false){

  applyTheme();

  app.innerHTML={home:vHome,today:vLog,log:vLog,cal:vCal,prog:vProg,set:vSet}[t]();
  if(isLogTab){
    const tabsEl=app.querySelector('.tabs');
    if(tabsEl){
      if(oldTabsLeft!==null){
        tabsEl.scrollLeft=oldTabsLeft;
        animateTabsScroll(tabsEl,tabsTargetLeft(tabsEl),300);
      } else {
        const tl=tabsTargetLeft(tabsEl);
        if(tl!==null) tabsEl.scrollLeft=tl;
      }
    }
  }

  app.classList.remove('tab-enter','day-enter-older','day-enter-newer');
  
  if(!skipAnim){
    if(slideDirection){

      app.classList.add(slideDirection==='older'?'day-enter-older':'day-enter-newer');
    } else if(tabChanged){
      void app.offsetWidth;
      app.classList.add('tab-enter');
    }
  }
}

/* ---------- Home dashboard helpers ---------- */
function addDays(ds,n){ const d=new Date(ds+'T00:00'); d.setDate(d.getDate()+n); return iso(d); }
function mondayOf(ds){ const d=new Date(ds+'T00:00'), w=d.getDay(); d.setDate(d.getDate()-(w===0?6:w-1)); return iso(d); }
function dayHasWork(ds){ const L=S.logs[ds]; return !!L && Object.values(L).some(hasExerciseHistory); }
/* Routine says no training this date (explicit Rest day or missing weekday on a weekday-named plan). */
function isRoutineRestDay(ds){
  if(!isValidISODate(ds)) return false;
  const idx=dayIdx(ds);
  if(idx<0) return true;
  const day=getPlan()[idx];
  return !day || !Array.isArray(day.ex) || day.ex.length===0;
}
/* True when a logged workout exists in the same Mon–Sun week or within ±3 calendar days. */
function hasTrainingContext(ds){
  if(!isValidISODate(ds)) return false;
  const mon=mondayOf(ds);
  for(let i=0;i<7;i++){
    const d=addDays(mon,i);
    if(d!==ds && dayHasWork(d)) return true;
  }
  for(let i=1;i<=3;i++){
    if(dayHasWork(addDays(ds,-i)) || dayHasWork(addDays(ds,i))) return true;
  }
  return false;
}
/* Planned rest that may be coloured: not trained, routine rest, and nearby training exists. */
function isPlannedRestShown(ds){
  return !dayHasWork(ds) && isRoutineRestDay(ds) && hasTrainingContext(ds);
}
function dayVolume(ds){
  const L=S.logs[ds]; let v=0;
  if(L) Object.values(L).forEach(r=>(r&&r.sets||[]).forEach(st=>{ v+=(num(st&&st.w)||0)*(num(st&&st.r)||0); }));
  return v;
}
function relDays(ds,today){
  const n=Math.round((new Date(today+'T00:00')-new Date(ds+'T00:00'))/864e5);
  return n<=0?'today':n===1?'yesterday':n+'d ago';
}
const kfmt=v=>v>=1000?(v/1000).toFixed(1).replace(/\.0$/,'')+'k':String(Math.round(v));
function splitDayName(n){ const p=String(n).split(' - '); return p.length>1?{day:p[0],title:p.slice(1).join(' - ')}:{day:'',title:String(n)}; }

/* name -> {name, list:[{date, rm, w, r}]} best est. 1RM per session, oldest first */
function exerciseSessions(){
  const names={};
  Object.values(S.routines||{}).forEach(pl=>(pl||[]).forEach(d=>(d.ex||[]).forEach(e=>{ names[e.id]=e.name; })));
  Object.entries(S.archivedExercises||{}).forEach(([i,e])=>{ if(!(i in names)) names[i]=e&&e.name; });
  const out={};
  Object.keys(S.logs||{}).filter(isValidISODate).sort().forEach(date=>{
    const L=S.logs[date]||{};
    Object.keys(L).forEach(id=>{
      const rec=L[id];
      if(!names[id]||!filled(rec)) return;
      let best=null;
      (rec.sets||[]).forEach(st=>{
        const w=num(st&&st.w), r=num(st&&st.r);
        if(w!==null&&w>=0&&r!==null&&r>=0){ const rm=w*(1+r/30); if(!best||rm>best.rm) best={rm,w,r}; }
      });
      if(!best) return;
      const x=out[normName(names[id])]||(out[normName(names[id])]={name:names[id],list:[]});
      const last=x.list[x.list.length-1];
      if(last&&last.date===date){ if(best.rm>last.rm) x.list[x.list.length-1]={date,...best}; }
      else x.list.push({date,...best});
    });
  });
  return out;
}
function recentPRs(sessions,n){
  const ev=[];
  Object.values(sessions).forEach(x=>{
    let best=0;
    x.list.forEach(st=>{ if(best>0&&st.rm>best*1.001) ev.push({name:x.name,...st}); if(st.rm>best) best=st.rm; });
  });
  return ev.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.rm-a.rm).slice(0,n);
}
function topMovers(sessions,today,n){
  const from=addDays(today,-28), out=[];
  Object.values(sessions).forEach(x=>{
    const l=x.list.filter(st=>st.date>=from&&st.date<=today);
    if(l.length>=2) out.push({name:x.name,gain:l[l.length-1].rm-l[0].rm,pts:l.map(st=>st.rm)});
  });
  return out.filter(m=>m.gain>0.05).sort((a,b)=>b.gain-a.gain).slice(0,n);
}
function sparkSvg(pts){
  const W=64,H=22,mn=Math.min(...pts),mx=Math.max(...pts),sp=(mx-mn)||1;
  const P=pts.map((v,i)=>(2+i*(W-4)/(pts.length-1)).toFixed(1)+','+(H-3-(v-mn)*(H-6)/sp).toFixed(1));
  const e=P[P.length-1].split(',');
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${P.join(' ')}" fill="none" style="stroke:var(--up)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${e[0]}" cy="${e[1]}" r="2.6" style="fill:var(--up)"/></svg>`;
}

function vHome(){
  const today=iso(new Date()), plan=getPlan(), idx=dayIdx(today), d=idx>=0?plan[idx]:null;
  const streak=calcStreak(), mon=mondayOf(today);
  let i=0; const step=()=>` style="--i:${i++}"`;

  if(d&&d.ex.length){

    let done=0;
    d.ex.forEach(e=>{
      const r=L[e.id], n=(r&&r.sets||[]).filter(st=>st&&st.w!==''&&st.w!=null&&st.r!==''&&st.r!=null).length;
      done+=Math.min(n,e.sets);
    });

        <div class="ring"><svg viewBox="0 0 68 68"><circle class="bg" cx="34" cy="34" r="29"/><circle class="fg" cx="34" cy="34" r="29" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}"/></svg><span>${Math.round(pct*100)}%</span></div>
      </div>
      <button class="cta" data-act="starttoday">${label}</button>
    </div>`;
  } else {
    let next=null;
    for(let k=1;k<=7&&!next;k++){ const ds=addDays(today,k), ix=dayIdx(ds); if(ix>=0&&plan[ix].ex.length) next={ds,nm:splitDayName(plan[ix].name)}; }
    card=`<div class="card today-card"${step()}>
      <div class="tc-row"><div class="tc-main"><div class="tc-lab">TODAY</div>
        <div class="tc-name">Rest day</div>
        <div class="tc-sub">${next?'Next: '+esc(fmt(next.ds))+' · '+esc(next.nm.title):'No workouts scheduled'}</div></div>
        <div class="ring" style="font-size:30px;display:flex;align-items:center;justify-content:center">😴</div></div>
      <button class="cta" data-act="starttoday" style="background:var(--accbg);color:var(--acc)">Open today’s log</button>
    </div>`;
  }

  /* Week strip + tiles */
  const LET=['M','T','W','T','F','S','S'];
  let wk='', doneW=0, planW=0, elapsed=0;
  const firstLog=Object.keys(S.logs).filter(dayHasWork).sort()[0];
  for(let k=0;k<7;k++){
    const ds=addDays(mon,k), ix=dayIdx(ds), planned=ix>=0&&plan[ix].ex.length>0, did=dayHasWork(ds);
    if(planned) planW++;
    if(did) doneW++;
    if(ds<=today) elapsed=k+1;
    const cls=did?'done':ds===today?'':(ds<today&&planned&&firstLog&&ds>firstLog?'miss':planned?'':'rest');
    wk+=`<button class="${cls}${ds===today?' now':''}" data-act="cal" data-v="${ds}" aria-label="${esc(fmt(ds))}"><span>${LET[k]}</span><i>${Number(ds.slice(8))}</i></button>`;
  }
  let tv=0, lv=0;
  for(let k=0;k<elapsed;k++){ tv+=dayVolume(addDays(mon,k)); lv+=dayVolume(addDays(mon,k-7)); }
  let vBig, vSub, vCls='';
  if(lv>0){ const pc=Math.round((tv-lv)/lv*100); vBig=(pc>=0?'▲ ':'▼ ')+Math.abs(pc)+'%'; vCls=pc>=0?'up':'dn'; vSub='volume vs last wk'; }
  else { vBig=kfmt(tv); vSub='kg this week'; }
  const tiles=`<div class="tiles"${step()}>
    <div class="stat"><b>🔥 ${streak}</b><span>day streak</span></div>
    <div class="stat"><b>${doneW}/${planW}</b><span>this week</span></div>
    <div class="stat"><b class="${vCls}">${vBig}</b><span>${vSub}</span></div></div>`;

  /* PRs, heatmap, movers */
  const sessions=exerciseSessions();
  const prs=recentPRs(sessions,3);
  const prHtml=prs.length?prs.map(x=>`<div class="pr-row"><span style="font-size:20px">🏆</span><div><b>${esc(x.name)}</b><small>${esc(String(x.w))} kg × ${esc(String(x.r))} · ${relDays(x.date,today)}</small></div><div class="md">~${Math.round(x.rm)} kg</div></div>`).join(''):'<div class="meta" style="padding:6px 0">No PRs yet. Beat an earlier session to set one!</div>';

  const start=addDays(mon,-77); let hm='', maxV=0, cnt=0; const cells=[];
  for(let k=0;k<84;k++){ const ds=addDays(start,k), v=dayVolume(ds), w=dayHasWork(ds); if(w&&ds<=today) cnt++; if(v>maxV) maxV=v; cells.push({ds,v,w}); }
  cells.forEach(c=>{
    if(c.ds>today){ hm+='<span class="hm fut"></span>'; return; }
    const tdCls=c.ds===today?' td':'';
    if(c.w){
      const lvl=c.v>0?Math.max(1,Math.ceil(c.v/maxV*4)):1;
      hm+=`<button class="hm l${lvl}${tdCls}" data-act="cal" data-v="${c.ds}" aria-label="${esc(fmt(c.ds))}, trained"></button>`;
    } else if(isPlannedRestShown(c.ds)){
      hm+=`<button class="hm rest${tdCls}" data-act="cal" data-v="${c.ds}" aria-label="${esc(fmt(c.ds))}, planned rest"></button>`;
    } else {
      hm+=`<button class="hm${tdCls}" data-act="cal" data-v="${c.ds}" aria-label="${esc(fmt(c.ds))}"></button>`;
    }
  });
  const heatLegend=`<div class="heat-legend"><span><i class="lg-train"></i>Trained</span><span><i class="lg-rest"></i>Planned rest</span><span><i class="lg-empty"></i>No activity</span></div>`;

  const mv=topMovers(sessions,today,3);
  const mvHtml=mv.length?mv.map(m=>`<div class="mv-row"><div><b>${esc(m.name)}</b><small>est. 1RM, last 4 weeks</small></div>${sparkSvg(m.pts)}<div class="g">+${m.gain.toFixed(1)} kg</div></div>`).join(''):'<div class="meta" style="padding:6px 0">Log an exercise in 2+ sessions over four weeks to see your top movers.</div>';

  return `<div class="dash">
    <div class="hero"${step()}><div class="logo">Lift Log</div><div class="sub">${esc(fmt(today))} · ${esc(S.activeRoutine.toUpperCase())} routine</div></div>
    ${card}
    <div class="wk"${step()}>${wk}</div>
    ${tiles}
    <div class="card"${step()}><h3><span>Recent PRs</span></h3><div style="margin-top:6px">${prHtml}</div></div>
    <div class="card"${step()}><h3><span>Activity</span><small>${cnt} workouts · 12 weeks</small></h3><div class="heat">${hm}</div>${heatLegend}</div>
    <div class="card"${step()}><h3><span>Top Movers</span></h3><div style="margin-top:6px">${mvHtml}</div></div>
  </div>`;
}

function renderStockChart(data, type){
  if(data.length<2) return '<div class="empty">Log workouts over 2 different weeks to generate your overall progress trend graph!</div>';

  const W=600, H=220, p=36;
  const values=data.map(d=>d.val);
  let mn=Math.min(...values), mx=Math.max(...values);
  if(mn===mx){ mn=Math.max(0, mn-5); mx+=5; }
  if(type==='bar'){ mn=Math.max(0, Math.floor(mn-(mx-mn)*0.4)); }

  const first = values[0], last = values[values.length-1];
  const isUp = last >= first;
  const color = isUp ? 'var(--up)' : 'var(--down)';

  const X=i=>p+i*(W-p-16)/(data.length-1);
  const Y=v=>H-28-(v-mn)*(H-50)/(mx-mn);

  let chartContent='';

  if(type==='bar'){
    const barWidth = Math.max(12, Math.min(36, (W-p)/data.length - 8));
    chartContent = data.map((d,i)=>{
      const x = X(i) - barWidth/2;
      const y = Y(d.val);
      const h = (H-28) - y;
      const prevVal = i>0 ? data[i-1].val : d.val;
      const barColor = d.val >= prevVal ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${barWidth}" height="${h}" rx="4" fill="${barColor}" opacity="0.85"><title>Week ${fmt(d.week)}: ${d.val}</title></rect>`;
    }).join('');
  } else {
    const points = data.map((d,i)=>X(i)+','+Y(d.val)).join(' ');
    const areaPoints = `${X(0)},${H-28} ${points} ${X(data.length-1)},${H-28}`;
    
    chartContent = `
      <defs>
        <linearGradient id="stockGradUp" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--up)" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="var(--up)" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="stockGradDown" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--down)" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="var(--down)" stop-opacity="0.0"/>
        </linearGradient>
      </defs>
      <polygon points="${areaPoints}" fill="url(${isUp ? '#stockGradUp' : '#stockGradDown'})" />
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      ${data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.val)}" r="4.5" fill="${color}"><title>Week ${fmt(d.week)}:${d.val}</title></circle>`).join('')}
    `;
  }

  const diff = last - first;
  const pct = first>0 ? Math.round((diff/first)*100) : 0;

  return `
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;margin-bottom:8px">
      <div>
        <span style="font-size:24px;font-weight:bold;color:${color}">${last}</span>
        <span style="font-size:13px;margin-left:6px;color:${color}">${diff>=0?'+':''}${diff} (${pct>=0?'+':''}${pct}%)</span>
      </div>
      <span style="font-size:12px;color:var(--mute)">vs First Logged Week</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img">
      <line x1="${p}" y1="${Y(mn)}" x2="${W-12}" y2="${Y(mn)}" style="stroke:var(--line)"/>
      <line x1="${p}" y1="${Y(mx)}" x2="${W-12}" y2="${Y(mx)}" style="stroke:var(--line)"/>
      <text x="4" y="${Y(mx)+4}" font-size="11" style="fill:var(--mute)">${mx}</text>
      <text x="4" y="${Y(mn)+4}" font-size="11" style="fill:var(--mute)">${mn}</text>
      ${chartContent}
      <text x="${p}" y="${H-6}" font-size="11" style="fill:var(--mute)">${fmt(data[0].week)}</text>
      <text x="${W-12}" y="${H-6}" font-size="11" text-anchor="end" style="fill:var(--mute)">${fmt(data[data.length-1].week)}</text>
    </svg>
  `;
}

function vCal(){

  let h=`<div class="top" style="justify-content:space-between"><button class="btn small" data-act="cm" data-v="-1">‹</button><b>${name}</b><button class="btn small" data-act="cm" data-v="1">›</button></div><div class="cal">`;
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(w=>h+=`<div class="h">${w}</div>`);
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,k=dayIdx(ds),lab=k>=0?getPlan()[k].name.split(' - ').pop():'Rest';

}

function renderLogExercisesForDate(dStr){
  const plan = getPlan();
  const dIdx = dayFor(dStr);
  let d = plan[dIdx];
  if (!d) d = { name: 'Rest Day', ex: [] };
  
  const loggedToday = S.logs[dStr] || {};
  const scheduledIds = new Set(d.ex.map(e => e.id));
  const extraIds = Object.keys(loggedToday).filter(id => !scheduledIds.has(id) && hasExerciseHistory(loggedToday[id]));
  
  const allEx = exList();
  const extraEx = extraIds.map(id => {
    const found = allEx.find(x => x.id === id);
    return found ? {...found} : { id, name: S.archivedExercises?.[id]?.name || 'Imported Exercise', sets: loggedToday[id].sets?.length || 3, range: '?' };
  });
  
  const exercisesToRender = [...d.ex, ...extraEx];
  
  if(!exercisesToRender.length) return '<div class="empty">Rest day scheduled! Take time to recover. ☕</div>';
  
  let h = '';
  exercisesToRender.forEach((e, idx)=>{
    const isExtra = idx >= d.ex.length;
    const rec=(S.logs[dStr]||{})[e.id]||{sets:[],note:''};
    const lbr=lastBeforeRec(e.id,dStr),lb=lbr?lbr.date:null,lr=lbr?lbr.rec:null;
    const n=Math.max(e.sets,rec.sets.length,ui.extra[e.id]||0);
    const hi=parseInt((String(e.range).split('-')[1]||e.range),10);
    let up='';
    if(lr&&hi){const ss=lr.sets.filter(s=>num(s.w)!==null);if(ss.length>=e.sets&&ss.every(s=>(num(s.r)||0)>=hi))up='<span class="up">↑ Hit upper rep limit last time. Try heavier weight!</span>'}
    
    const extraTag = isExtra ? '<span style="font-size:10px;background:var(--accbg);color:var(--acc);padding:2px 6px;border-radius:4px;margin-left:8px;vertical-align:middle">Off-Plan</span>' : '';
    
    h+=`<div class="card exercise-card" data-ex-card="${esc(e.id)}">
      <h3>
        <span>${esc(e.name)}${extraTag}</span>
        <span style="display:flex;align-items:center;gap:6px"><button type="button" class="btn small" data-act="removeexercise" data-id="${esc(e.id)}" aria-label="Remove ${esc(e.name)}" title="Remove exercise">Remove</button><button type="button" class="drag-handle" data-drag-handle="${esc(e.id)}" aria-label="Drag to reorder exercise" title="Drag to reorder">⠿</button></span>
      </h3>
      <div class="meta">${e.sets} sets × ${esc(e.range)} reps</div>`;
    if(lr)h+=`<div class="last">Last (${fmt(lb)}): ${esc(setsTxt(lr))}${up}</div>`;
    
    for(let i=0;i<n;i++){
      const s=rec.sets[i]||{w:'',r:''},ls=lr&&(lr.sets[i]||lr.sets[lr.sets.length-1]);
      const isDone = (s.w!=='' && s.r!=='') ? ' set-done' : '';
      h+=`<div class="row${isDone}">
        <span>Set ${i+1}</span>
        <input type="number" inputmode="decimal" min="0" step="any" data-id="${esc(e.id)}" data-i="${i}" data-f="w" placeholder="${ls&&ls.w?esc(ls.w):'kg'}" value="${esc(s.w)}">
        <input type="number" inputmode="numeric" min="0" step="1" data-id="${esc(e.id)}" data-i="${i}" data-f="r" placeholder="${ls&&ls.r?esc(ls.r):'reps'}" value="${esc(s.r)}">
      </div>`;
    }
    h+=`<div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn small" data-act="addset" data-id="${esc(e.id)}">+ set</button>
      <button class="btn small acc" data-act="starttimer">⏱️ Rest (${T.restTimerMin||3}m)</button>
    </div>
    <input class="note" data-id="${esc(e.id)}" data-f="note" placeholder="Notes" value="${esc(rec.note)}">
    </div>`;
  });
  return h;
}

  const ds=Object.keys(S.logs).filter(d=>recAt(d)).sort();

  h+='<div class="card wrap"><table><tr><th>Date</th><th>Sets (kg×reps)</th><th>Top</th></tr>'+ds.slice().reverse().map(d=>{const r=recAt(d);return`<tr><td>${fmt(d)}</td><td>${esc(setsTxt(r))}${r.note?'<br><span class="meta">'+esc(r.note)+'</span>':''}</td><td>${topW(r)}</td></tr>`}).join('')+'</table></div>';
  return h;
}

function chart(ds,v,type){
  const W=600,H=200,p=34;
  if(v.length<2)return'<div class="meta">Log at least two sessions to see the trend line.</div>';
  let mn=Math.min(...v),mx=Math.max(...v);if(mn===mx){mn-=1;mx+=1}
  if(type==='bar'){ mn=Math.max(0, Math.floor(mn-(mx-mn)*0.4)); }
  const X=i=>p+i*(W-p-12)/(v.length-1),Y=x=>H-24-(x-mn)*(H-44)/(mx-mn);
  
  let mainContent='';
  if(type==='bar'){
    const bw=Math.max(10, Math.min(32, (W-p)/v.length - 6));
    mainContent=v.map((x,i)=>`<rect x="${X(i)-bw/2}" y="${Y(x)}" width="${bw}" height="${(H-24)-Y(x)}" rx="3" fill="var(--acc)" opacity="0.85"><title>${fmt(ds[i])}: ${x}kg</title></rect>`).join('');
  } else {
    const pts=v.map((x,i)=>X(i)+','+Y(x)).join(' ');
    mainContent=`<polyline points="${pts}" fill="none" style="stroke:var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="4" style="fill:var(--acc)"><title>${fmt(ds[i])}:${x}kg</title></circle>`).join('')}`;
  }

  const L='style="stroke:var(--line)"',M='style="fill:var(--mute)"';
  return`<svg viewBox="0 0 ${W} ${H}" role="img"><line x1="${p}" y1="${Y(mn)}" x2="${W-12}" y2="${Y(mn)}" ${L}/><line x1="${p}" y1="${Y(mx)}" x2="${W-12}" y2="${Y(mx)}" ${L}/><text x="4" y="${Y(mx)+4}" font-size="12" ${M}>${mx}</text><text x="4" y="${Y(mn)+4}" font-size="12" ${M}>${mn}</text>${mainContent}<text x="${p}" y="${H-6}" font-size="12" ${M}>${fmt(ds[0])}</text><text x="${W-12}" y="${H-6}" font-size="12" text-anchor="end" ${M}>${fmt(ds[ds.length-1])}</text></svg>`;
}

// Helpers for parsing imported CSV and TXT files
function hasExerciseHistory(record) {
  if (!record || typeof record !== 'object') return false;
  if (typeof record.note === 'string' && record.note.trim()) return true;
  return Array.isArray(record.sets) && record.sets.some(set => {
    if (!set || typeof set !== 'object') return false;
    const hasW = set.w !== '' && set.w !== null && set.w !== undefined;
    const hasR = set.r !== '' && set.r !== null && set.r !== undefined;
    return hasW || hasR;
  });
}
function findExIdByName(name) {
  const cleanName = String(name ?? '').trim();
  const normalized = cleanName.toLocaleLowerCase();
  if (!cleanName) return 'ex_unknown';
  const allEx = [];
  Object.values(S.routines || {}).forEach(plan => (plan || []).forEach(day => (day.ex || []).forEach(ex => allEx.push(ex))));
  const activeMatch = allEx.find(ex => String(ex.name || '').trim().toLocaleLowerCase() === normalized);
  if (activeMatch) return activeMatch.id;
  const archived = S.archivedExercises || {};
  const archivedMatch = Object.entries(archived).find(([, ex]) => String(ex?.name || '').trim().toLocaleLowerCase() === normalized);
  if (archivedMatch) return archivedMatch[0];

  let base = 'imported_' + (cleanName.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 48) || 'exercise');
  let id = base, suffix = 2;
  while ((allEx.some(ex => ex.id === id) || Object.prototype.hasOwnProperty.call(archived, id)) && String(archived[id]?.name || '').toLocaleLowerCase() !== normalized) id = `${base}_${suffix++}`;
  if (!S.archivedExercises) S.archivedExercises = {};
  if (!S.archivedExercises[id]) S.archivedExercises[id] = {name: cleanName, sets: 3, range: '8-12'};
  return id;
}
function parseCSVRows(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  const input = String(text ?? '').replace(/^\uFEFF/, '');
  for (let i = 0; i < input.length; i++) {
    const ch = input[i];
    if (quoted) {
      if (ch === '"' && input[i + 1] === '"') { field += '"'; i++; }
      else if (ch === '"') quoted = false;
      else field += ch;
    } else if (ch === '"') {
      quoted = true;
    } else if (ch === ',') {
      row.push(field); field = '';
    } else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && input[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if (quoted) throw new Error('CSV contains an unclosed quoted field.');
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function parseCSVLogs(text) {
  const rows = parseCSVRows(text);
  const logs = {};
  if (rows.length < 2) return logs;
  const header = rows[0].map(v => String(v).trim().toLowerCase());
  const col = name => header.indexOf(name);
  const dateCol = col('date'), exCol = col('exercise'), setCol = col('set'), weightCol = col('weight'), repsCol = col('reps'), noteCol = col('note');
  if (dateCol < 0 || exCol < 0) throw new Error('CSV must contain Date and Exercise columns.');
  rows.slice(1).forEach(parts => {
    if (!parts.some(v => String(v).trim() !== '')) return;
    const date = String(parts[dateCol] ?? '').trim();
    const exName = String(parts[exCol] ?? '').trim();
    if (!isValidISODate(date) || !exName) return;
    const rawSet = setCol < 0 ? '1' : String(parts[setCol] ?? '').trim();
    const setNo = rawSet === '' ? 0 : Number(rawSet);
    const rawWeight = weightCol < 0 ? '' : String(parts[weightCol] ?? '').trim();
    const rawReps = repsCol < 0 ? '' : String(parts[repsCol] ?? '').trim();
    const note = noteCol < 0 ? '' : String(parts[noteCol] ?? '');
    const exId = findExIdByName(exName);
    if (!logs[date]) logs[date] = {};
    if (!logs[date][exId]) logs[date][exId] = {sets: [], note: ''};
    if (Number.isInteger(setNo) && setNo > 0 && setNo <= 100) {
      while (logs[date][exId].sets.length < setNo) logs[date][exId].sets.push({w:'', r:''});
      const weight = rawWeight !== '' && Number.isFinite(Number(rawWeight)) && Number(rawWeight) >= 0 ? Number(rawWeight) : '';
      const reps = rawReps !== '' && Number.isFinite(Number(rawReps)) && Number(rawReps) >= 0 ? Math.round(Number(rawReps)) : '';
      logs[date][exId].sets[setNo - 1] = {w: weight, r: reps};
    }
    if (note !== '') logs[date][exId].note = note;
  });
  return logs;
}
function mergeImportedLogs(existing, incoming) {
  const merged = {...(existing || {})};
  Object.entries(incoming || {}).forEach(([date, exercises]) => {
    if (!isValidISODate(date) || !exercises || typeof exercises !== 'object') return;
    merged[date] = {...(merged[date] || {})};
    Object.entries(exercises).forEach(([id, record]) => {
      merged[date][id] = record;
    });
  });
  return merged;
}
function csvEscape(value) {
  const text = value === null || value === undefined ? '' : String(value);
  return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
}
/* Date/time first so iOS filename truncation keeps the useful part visible. */
function exportTimestamp(date=new Date()) {
  const pad=n=>String(n).padStart(2,'0');
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
}
function exportFileName(kind, ext, date=new Date()) {
  /* kind: bak | csv | rec — short suffix after timestamp */
  return `${exportTimestamp(date)}_LL-${kind}.${ext}`;
}
function downloadTextFile(content, filename, mime='text/plain;charset=utf-8') {
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download=filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function createTextBackup() {
  const allEx=exList();
  const lines=[
    'LIFT LOG — FULL TEXT BACKUP',
    `Exported: ${new Date().toLocaleString()}`,
    `Workout dates with records: ${Object.keys(S.logs||{}).filter(date=>S.logs[date]&&Object.values(S.logs[date]).some(hasExerciseHistory)).length}`,
    '',
    'WORKOUT PROGRESS'
  ];
  Object.keys(S.logs||{}).sort().forEach(date=>{
    lines.push('',`DATE: ${date}`);
    Object.keys(S.logs[date]||{}).forEach(exId=>{
      const rec=S.logs[date][exId]||{};
      const ex=allEx.find(item=>item.id===exId);
      lines.push(`Exercise: ${ex?ex.name:exId}`);
      (rec.sets||[]).forEach((set,index)=>{
        if(set && (set.w!=='' || set.r!=='')) lines.push(`Set ${index+1}: ${set.w===''?'—':set.w} kg × ${set.r===''?'—':set.r} reps`);
      });
      if(rec.note) lines.push(`Note: ${rec.note}`);
    });
  });
  lines.push(
    '',
    'FULL RESTORE DATA (keep this section when importing)',
    'The JSON below preserves routines, exercise IDs, all log data, and theme settings.',
    'LIFTLOG_BACKUP_JSON_BEGIN',
    JSON.stringify({routines:S.routines,logs:S.logs,archivedExercises:S.archivedExercises||{},activeRoutine:S.activeRoutine,theme:themeForBackup()},null,2),
    'LIFTLOG_BACKUP_JSON_END'
  );
  return lines.join('\n')+'\n';
