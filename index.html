function parseTXTLogs(text) {
  const logs = {};
  const dateBlocks = text.split(/DATE:\s*/i);
  dateBlocks.forEach(block => {
    const lines = block.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) return;
    const date = lines[0];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;

    let currentExId = null;
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i];
      if (line.toLowerCase().startsWith('exercise:')) {
        const exName = line.replace(/exercise:/i, '').trim();
        currentExId = findExIdByName(exName);
      } else if (currentExId && line.toLowerCase().startsWith('set')) {
        const match = line.match(/Set\s+(\d+):\s*([\d.]+|—)\s*kg\s*×\s*(\d+|—)\s*reps/i);
        if (match) {
          const setIdx = parseInt(match[1], 10) - 1;
          const weight = match[2] === '—' ? '' : Number(match[2]);
          const reps = match[3] === '—' ? '' : Number(match[3]);

          if (!logs[date]) logs[date] = {};
          if (!logs[date][currentExId]) logs[date][currentExId] = { sets: [], note: '' };

          while (logs[date][currentExId].sets.length <= setIdx) {
            logs[date][currentExId].sets.push({ w: '', r: '' });
          }
          logs[date][currentExId].sets[setIdx] = { w: weight, r: reps };
        }
      } else if (currentExId && line.toLowerCase().startsWith('note:')) {
        const note = line.replace(/note:/i, '').trim();
        if (!logs[date]) logs[date] = {};
        if (!logs[date][currentExId]) logs[date][currentExId] = {sets: [], note: ''};
        logs[date][currentExId].note = note;
      }
    }
  });
  return logs;
}

/* Rest timer: finger-tracked edge slide. Dock uses left/top (peek), not a post-release transform snap. */
let timerDrag = null;
let timerInertiaAnim = null;
const timerBox = document.getElementById('timer-box');
const TIMER_DOCK_PEEK = 36;
const TIMER_EASE = 'left 0.32s cubic-bezier(0.22, 1, 0.36, 1), top 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease';

function timerW(){ return timerBox.offsetWidth || 240; }
function timerH(){ return timerBox.offsetHeight || 200; }
function timerDockLeftX(){ return -(timerW() - TIMER_DOCK_PEEK); }
function timerDockRightX(){ return window.innerWidth - TIMER_DOCK_PEEK; }
function timerClampY(y){
  return Math.max(60, Math.min(window.innerHeight - timerH() - 80, y));
}
function timerClampXDrag(x){
  /* Allow sliding fully into the side; keep a peek strip on-screen. */
  return Math.max(timerDockLeftX(), Math.min(timerDockRightX(), x));
}
function timerSetPos(x, y){
  timerBox.style.left = x + 'px';
  timerBox.style.top = y + 'px';
  timerBox.style.right = 'auto';
  timerBox.style.bottom = 'auto';
}
function timerBodyFade(x){
  const body = timerBox.querySelector('.timer-body');
  if(!body) return;
  const w = timerW();
  const offL = Math.max(0, -x);
  const offR = Math.max(0, x + w - window.innerWidth);
  const off = Math.max(offL, offR);
  const span = Math.max(1, w - TIMER_DOCK_PEEK);
  body.style.opacity = String(Math.max(0.12, 1 - (off / span) * 0.9));
}
function timerSyncDockClass(x, settled){
  const w = timerW();
  const onLeft = x <= timerDockLeftX() + 2 || (settled && x < 0 && x + w < window.innerWidth * 0.45);
  const onRight = x >= timerDockRightX() - 2 || (settled && x + w > window.innerWidth && x > window.innerWidth * 0.55);
  /* While dragging, chrome follows how far off-screen we are. */
  const peekingLeft = x < -4;
  const peekingRight = x + w > window.innerWidth + 4;
  timerBox.classList.toggle('docked-left', settled ? (x <= 0 && x <= timerDockLeftX() + 8) : peekingLeft);
  timerBox.classList.toggle('docked-right', settled ? (x + w >= window.innerWidth - 8) : peekingRight);
  const arrow = document.getElementById('timer-dock-arrow');
  if(arrow){
    if(timerBox.classList.contains('docked-left')) arrow.textContent = '›';
    else if(timerBox.classList.contains('docked-right')) arrow.textContent = '‹';
  }
  timerBodyFade(x);
}
function timerUndockTo(x, y){
  timerBox.style.transition = TIMER_EASE;
  timerBox.classList.remove('docked-left','docked-right');
  const body = timerBox.querySelector('.timer-body');
  if(body) body.style.opacity = '1';
  timerSetPos(x, timerClampY(y));
}
function timerSettleDock(side, y){
  timerBox.style.transition = TIMER_EASE;
  const x = side === 'left' ? timerDockLeftX() : timerDockRightX();
  timerSetPos(x, timerClampY(y));
  timerBox.classList.remove('docked-left','docked-right');
  timerBox.classList.add(side === 'left' ? 'docked-left' : 'docked-right');
  const arrow = document.getElementById('timer-dock-arrow');
  if(arrow) arrow.textContent = side === 'left' ? '›' : '‹';
  timerBodyFade(x);
  haptic(10);
}

function initTimerDrag(e) {
  if (e.target.closest('button') && e.target.closest('button').hasAttribute('data-act')) return;
  if(timerInertiaAnim) cancelAnimationFrame(timerInertiaAnim);

  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const rect = timerBox.getBoundingClientRect();

  timerDrag = {
    startX: clientX, startY: clientY,
    initialX: rect.left, initialY: rect.top,
    lastX: clientX, lastY: clientY,
    vx: 0, vy: 0,
    lastTime: Date.now(),
    moved: false,
    wasDocked: timerBox.classList.contains('docked-left') || timerBox.classList.contains('docked-right')
  };
  timerBox.style.transition = 'none';
  /* Lock position to current visual box so undock starts under the finger. */
  timerSetPos(rect.left, rect.top);
  timerBox.classList.remove('docked-left','docked-right');
  const body = timerBox.querySelector('.timer-body');
  if(body) body.style.opacity = '1';
}

function onTimerMove(e) {
  if (!timerDrag) return;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const now = Date.now();
  const dt = now - timerDrag.lastTime;

  if(dt > 0){
    timerDrag.vx = (clientX - timerDrag.lastX) / dt;
    timerDrag.vy = (clientY - timerDrag.lastY) / dt;
  }
  timerDrag.lastX = clientX;
  timerDrag.lastY = clientY;
  timerDrag.lastTime = now;

  const dx = clientX - timerDrag.startX;
  const dy = clientY - timerDrag.startY;

  if(Math.hypot(dx, dy) > 5 && !timerDrag.moved) {
    timerDrag.moved = true;
    timerBox.classList.add('dragging');
  }
  if(!timerDrag.moved) return;

  if(e.cancelable) e.preventDefault();

  let newX = timerClampXDrag(timerDrag.initialX + dx);
  let newY = timerClampY(timerDrag.initialY + dy);

  timerSetPos(newX, newY);
  timerSyncDockClass(newX, false);
}

function endTimerDrag(e) {
  if (!timerDrag) return;
  const moved = timerDrag.moved;
  const vx = timerDrag.vx || 0;
  const startY = timerDrag.initialY;
  const wasDocked = timerDrag.wasDocked;
  timerDrag = null;
  timerBox.classList.remove('dragging');

  const rect = timerBox.getBoundingClientRect();
  const w = rect.width;
  const x = rect.left;
  const y = rect.top;
  const mid = x + w / 2;
  const vw = window.innerWidth;

  if (!moved) {
    /* Tap while docked → slide back on-screen. */
    if(wasDocked){
      const targetX = x < vw / 2 ? 16 : Math.max(16, vw - w - 16);
      timerUndockTo(targetX, y);
    }
    return;
  }

  /* Finger-driven dock: commit if mostly off that edge or flicked that way. */
  const pastLeft = x < -w * 0.28 || mid < vw * 0.22;
  const pastRight = x + w > vw + w * 0.28 || mid > vw * 0.78;
  const flickLeft = vx < -0.45;
  const flickRight = vx > 0.45;

  if (pastLeft || (flickLeft && mid < vw * 0.55)) {
    timerSettleDock('left', y);
  } else if (pastRight || (flickRight && mid > vw * 0.45)) {
    timerSettleDock('right', y);
  } else {
    /* Stay on-screen, ease to a comfortable inset. */
    timerBox.style.transition = TIMER_EASE;
    timerBox.classList.remove('docked-left','docked-right');
    const body = timerBox.querySelector('.timer-body');
    if(body) body.style.opacity = '1';
    let nx = x;
    if(nx < 12) nx = 12;
    if(nx + w > vw - 12) nx = vw - w - 12;
    timerSetPos(nx, timerClampY(y));
  }
}

timerBox.addEventListener('mousedown', initTimerDrag);
document.addEventListener('mousemove', onTimerMove);
document.addEventListener('mouseup', endTimerDrag);

timerBox.addEventListener('touchstart', initTimerDrag, {passive: true});
document.addEventListener('touchmove', onTimerMove, {passive: false});
document.addEventListener('touchend', endTimerDrag);
document.addEventListener('touchcancel', endTimerDrag);

timerBox.addEventListener('click', e => {
  if(timerDrag) return;
  if(timerBox.classList.contains('docked-left') || timerBox.classList.contains('docked-right')){
    const rect = timerBox.getBoundingClientRect();
    const w = timerW();
    const targetX = timerBox.classList.contains('docked-left') ? 16 : Math.max(16, window.innerWidth - w - 16);
    timerUndockTo(targetX, rect.top);
  }
});

// Vertical drag-and-drop with edge auto-scroll and smoother card feedback.
let exerciseDrag = null;
let exerciseAutoScroll = null;
function reorderExerciseAt(y) {
  if (!exerciseDrag) return;
  const cards = [...document.querySelectorAll('#app [data-ex-card]')];
  cards.forEach(c => c.classList.remove('drop-target'));
  const target = cards.find(c => {
    if (c === exerciseDrag.card) return false;
    const r = c.getBoundingClientRect();
    return y >= r.top && y <= r.bottom;
  });
  if (target) {
    target.classList.add('drop-target');
    const r = target.getBoundingClientRect();
    const before = y < r.top + r.height / 2;
    if (before && exerciseDrag.card.nextElementSibling !== target) {
      target.parentNode.insertBefore(exerciseDrag.card, target);
    } else if (!before && target.nextElementSibling !== exerciseDrag.card) {
      target.parentNode.insertBefore(exerciseDrag.card, target.nextSibling);
    }
  }
}
function stopExerciseAutoScroll() {
  if (exerciseAutoScroll !== null) {
    clearInterval(exerciseAutoScroll);
    exerciseAutoScroll = null;
  }
}
document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('[data-drag-handle]');
  if (!handle || ui.tab !== 'today' || e.button > 0) return;
  const card = handle.closest('[data-ex-card]');
  if (!card) return;
  exerciseDrag = {id: card.dataset.exCard, card, startY: e.clientY, lastY: e.clientY, moved: false, pointerId: e.pointerId};
  try { handle.setPointerCapture(e.pointerId); } catch (_) {}
});
document.addEventListener('pointermove', e => {
  if (!exerciseDrag || (exerciseDrag.pointerId !== undefined && e.pointerId !== exerciseDrag.pointerId)) return;
  exerciseDrag.lastY = e.clientY;
  if (Math.abs(e.clientY - exerciseDrag.startY) > 5) {
    exerciseDrag.moved = true;
    document.body.classList.add('exercise-reordering');
    exerciseDrag.card.classList.add('dragging');
  }
  if (!exerciseDrag.moved) return;
  reorderExerciseAt(e.clientY);
  const edge = 88;
  const y = e.clientY;
  let speed = 0;
  if (y < edge) speed = -Math.ceil((edge - y) / 5);
  else if (y > window.innerHeight - edge) speed = Math.ceil((y - (window.innerHeight - edge)) / 5);
  if (speed && exerciseAutoScroll === null) {
    exerciseAutoScroll = setInterval(() => {
      if (!exerciseDrag || !exerciseDrag.moved) return;
      const py = exerciseDrag.lastY;
      let step = 0;
      if (py < edge) step = -Math.max(3, Math.ceil((edge - py) / 4));
      else if (py > window.innerHeight - edge) step = Math.max(3, Math.ceil((py - (window.innerHeight - edge)) / 4));
      if (step) {
        window.scrollBy(0, step);
        reorderExerciseAt(py);
      } else stopExerciseAutoScroll();
    }, 16);
  } else if (!speed) stopExerciseAutoScroll();
  e.preventDefault();
}, {passive:false});

function finishExerciseDrag(e) {
  if (!exerciseDrag) return;
  if (e && exerciseDrag.pointerId !== undefined && e.pointerId !== undefined && e.pointerId !== exerciseDrag.pointerId) return;
  const moved = exerciseDrag.moved;
  const dragSnapshot = exerciseDrag;
  exerciseDrag = null;
  stopExerciseAutoScroll();
  document.body.classList.remove('exercise-reordering');
  document.querySelectorAll('#app [data-ex-card]').forEach(c => c.classList.remove('dragging','drop-target'));
  
  if (moved && dragSnapshot) {
    const ids = [...document.querySelectorAll('#app [data-ex-card]')].map(c => c.dataset.exCard);
    const plan = getPlan();
    const day = plan[ui.day];
    if(!day || !Array.isArray(day.ex)) return;
    
    const byId = new Map(day.ex.map(ex => [ex.id, ex]));
    const planIdsInOrder = ids.filter(id => byId.has(id));
    
    if (planIdsInOrder.length === day.ex.length && new Set(planIdsInOrder).size === planIdsInOrder.length) {
      day.ex = planIdsInOrder.map(id => byId.get(id));
      saveState(0);
      render(true);
    }
  }
}
document.addEventListener('pointerup', finishExerciseDrag);
document.addEventListener('pointercancel', finishExerciseDrag);
window.addEventListener('blur', () => { if (exerciseDrag) finishExerciseDrag(); });


// 3-Pane Seamless Touch Swiper (Instagram Reels Style) with Fixed Header
let swipeStartX = null, swipeStartY = null, swipeDX = 0;
let swipeActive = false, swipeTrack = null, trackWidth = 0, swipeSettling = false;

function shiftDate(dateStr, offset) {
  const base = safeDate(dateStr);
  let d = new Date(base + 'T00:00');
  d.setDate(d.getDate() + offset);
  return iso(d);
}

function initSwipeTrack() {
  if(document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
  
  const contentContainer = document.getElementById('log-content-container');
  if(!contentContainer) return;
  
  trackWidth = contentContainer.offsetWidth;
  const currNodes = Array.from(contentContainer.childNodes);
  
  swipeTrack = document.createElement('div');
  swipeTrack.style.cssText = "display:flex; position:relative; width:100%; transition:none; transform:translateX(0); will-change:transform;";
  
  const paneStyle = "flex:0 0 100%; width:100%; min-width:100%; box-sizing:border-box;";
  
  const prevDate = shiftDate(ui.date, -1);
  const nextDate = shiftDate(ui.date, 1);
  
  const pPrev = document.createElement('div');
  pPrev.style.cssText = paneStyle + "position:absolute; left:-100%; top:0;";
  pPrev.innerHTML = renderLogExercisesForDate(prevDate);
  
  const pCurr = document.createElement('div');
  pCurr.style.cssText = paneStyle + "position:relative;";
  currNodes.forEach(n => pCurr.appendChild(n));
  
  const pNext = document.createElement('div');
  pNext.style.cssText = paneStyle + "position:absolute; left:100%; top:0;";
  pNext.innerHTML = renderLogExercisesForDate(nextDate);
  
  swipeTrack.appendChild(pPrev);
  swipeTrack.appendChild(pCurr);
  swipeTrack.appendChild(pNext);
  
  contentContainer.innerHTML = '';
  contentContainer.appendChild(swipeTrack);
}

document.addEventListener('touchstart', e => {
  if (ui.tab !== 'today' || document.body.classList.contains('exercise-reordering')) return;
  if (swipeSettling) return;
  if (swipeTrack) { /* stuck track from an interrupted gesture: repair before starting a new one */
    swipeTrack = null; swipeActive = false; swipeStartX = null;
    render(true);
  }
  if (e.target.closest('.timer-widget') || e.target.closest('[data-drag-handle]') || e.target.closest('input') || e.target.closest('button') || e.target.closest('select') || e.target.closest('textarea') || e.target.closest('.tabs')) return;
  if (e.touches.length > 1) return;
  
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swipeDX = 0; 
  swipeActive = false;
}, {passive: true});

document.addEventListener('touchmove', e => {
  if (swipeStartX === null || ui.tab !== 'today') return;
  const dx = e.touches[0].clientX - swipeStartX;
  const dy = e.touches[0].clientY - swipeStartY;
  
  if (!swipeActive) {
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      swipeActive = true;
      initSwipeTrack();
    } else if (Math.abs(dy) > 12) {
      swipeStartX = null;
      return;
    }
  }
  
  if (swipeActive && swipeTrack) {
    e.preventDefault();
    swipeDX = dx;
    swipeTrack.style.transform = `translateX(${dx}px)`;
  }
}, {passive: false});

document.addEventListener('touchend', e => {
  if (swipeStartX === null || ui.tab !== 'today' || !swipeActive || !swipeTrack) {
    swipeStartX = null; swipeActive = false;
    return;
  }
  
  const threshold = Math.min(trackWidth * 0.25, 100);
  let targetX = 0, dateOffset = 0;
  
  if (swipeDX < -threshold) { 
    targetX = -trackWidth; 
    dateOffset = 1; 
  } else if (swipeDX > threshold) { 
    targetX = trackWidth; 
    dateOffset = -1; 
  }
  
  swipeSettling = true;
  swipeTrack.style.transition = "transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)";
  swipeTrack.style.transform = `translateX(${targetX}px)`;
  
  if (dateOffset !== 0) {
    haptic(15);
    const tabsEl = document.querySelector('#log-header-container .tabs');
    if (tabsEl) {
      const newIdx = dayFor(shiftDate(ui.date, dateOffset));
      const btns = tabsEl.querySelectorAll('button');
      btns.forEach((b, i) => b.classList.toggle('on', i === newIdx));
      animateTabsScroll(tabsEl, tabsTargetLeft(tabsEl), 300);
    }
  }

  setTimeout(() => {
    if (dateOffset !== 0) {
      ui.date = shiftDate(ui.date, dateOffset);
      ui.day = dayFor(ui.date);
    }
    swipeActive = false; 
    swipeTrack = null;
    swipeSettling = false;
    render(true);
  }, 300);
  
  swipeStartX = null; 
  swipeDX = 0;
});


/* iOS cancels touches for edge swipes / system gestures: spring back instead of staying stuck sideways. */
document.addEventListener('touchcancel', () => {
  if (swipeActive && swipeTrack && !swipeSettling) {
    swipeSettling = true;
    swipeTrack.style.transition = "transform 0.25s cubic-bezier(0.25, 1, 0.5, 1)";
    swipeTrack.style.transform = "translateX(0px)";
    setTimeout(() => { swipeActive = false; swipeTrack = null; swipeSettling = false; render(true); }, 250);
  }
  swipeStartX = null; swipeDX = 0;
});
document.addEventListener('touchcancel', e => { if (typeof endTimerDrag === 'function') endTimerDrag(e); });

// Keyboard Ergonomics: Enter Key to focus next weight input
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    e.preventDefault();
    if (e.target.dataset.f === 'r') {
      const inputs = Array.from(document.querySelectorAll('input[data-f="w"], input[data-f="r"]'));
      const idx = inputs.indexOf(e.target);
      if (idx >= 0 && idx + 1 < inputs.length) {
        const nextWeight = inputs.slice(idx + 1).find(inp => inp.dataset.f === 'w');
        if (nextWeight) nextWeight.focus();
        else e.target.blur();
      } else {
        e.target.blur();
      }
    } else {
      e.target.blur();
    }
  }
});

document.addEventListener('touchstart', e => {
  if(document.activeElement && document.activeElement.tagName === 'INPUT') {
    if(!e.target.closest('input') && !e.target.closest('button') && !e.target.closest('[data-act]') && !e.target.closest('.timer-widget')) {
      document.activeElement.blur();
    }
  }
}, {passive:true});


document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const a = btn.getAttribute('data-act');
  const v = btn.getAttribute('data-v');
  const id = btn.getAttribute('data-id');

  if(a==='go'){
    ui.tab = v;
    render();
  }
  else if(a==='starttoday'){
    ui.date = iso(new Date());
    ui.day = dayFor(ui.date);
    ui.tab = 'today';
    render();
  }
  else if(a==='clearhistory'){
    if(confirm('Are you sure you want to delete all logged workout history? This action cannot be undone.')){
      S.logs = {};
      if(S.archivedExercises) delete S.archivedExercises;
      saveState(0);
      render();
    }
  }
  else if(a==='setroutine'){
    S.activeRoutine = v;
    saveState(0);
    render();
  }
  else if(a==='sethomemetric'){
    ui.homeMetric = v;
    render();
  }
  else if(a==='sethomegtype'){
    ui.homeGraphType = v;
    T.homeGraphType = v;
    saveTheme();
    render();
  }
  else if(a==='setproggtype'){
    ui.progGraphType = v;
    T.progGraphType = v;
    saveTheme();
    render();
  }
  else if(a==='cm'){
    let m = ui.cm.m + parseInt(v, 10);
    let y = ui.cm.y;
    if(m<0){ m=11; y--; }
    else if(m>11){ m=0; y++; }
    ui.cm = {y, m};
    render();
  }
  else if(a==='cal'){
    ui.date = safeDate(v, ui.date);
    ui.tab = 'today';
    ui.day = dayFor(ui.date);
    render();
  }
  else if(a==='dt'){
    const base = safeDate(ui.date);
    let d = new Date(base + 'T00:00');
    d.setDate(d.getDate() + parseInt(v, 10));
    ui.date = iso(d);
    ui.day = dayFor(ui.date);
    render();
  }
  else if(a==='today'){
    ui.date = iso(new Date());
    ui.day = dayFor(ui.date);
    render();
  }
  else if(a==='day'){
    const target = dateForDayIdx(parseInt(v, 10), ui.date);
    if(target && target !== ui.date){
      ui.date = target;
      ui.day = dayFor(ui.date);
      render();
    }
  }
  else if(a==='addexercise'){
    if(!getPlan()[ui.day]){alert('This date is a rest day with no workout in your routine, so there is nowhere to add an exercise. Open a scheduled workout day and add it there.');return;}
    const name=prompt('Exercise name to add to this workout day:');
    if(name!==null){
      const clean=name.trim();
      if(!clean){alert('Please enter an exercise name.');return;}
      const day=getPlan()[ui.day];
      if(!day){alert('This date is a rest day with no workout in your routine, so there is nowhere to add the exercise. Open a scheduled workout day and add it there.');return;}
      if(day.ex.some(ex=>ex.name.toLowerCase()===clean.toLowerCase())){
        alert('That exercise is already in this workout.');return;
      }
      const setsInput=prompt('How many working sets?','3');
      if(setsInput===null)return;
      const sets=parseInt(setsInput,10);
      if(!Number.isInteger(sets)||sets<1||sets>20){alert('Enter a number of sets from 1 to 20.');return;}
      const range=prompt('Target rep range (e.g. 8-12):','8-12');
      if(range===null)return;
      const cleanRange=range.trim()||'8-12';
      day.ex.push({id:'custom_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),name:clean,sets,range:cleanRange});
      saveState(0);
      render();
    }
  }
  else if(a==='removeexercise'){
    const day=getPlan()[ui.day];
    const ex=day&&day.ex.find(item=>item.id===id);
    if(!ex){
      /* Off-Plan exercise: it only exists as logged data for this date */
      const rec=S.logs[ui.date]&&S.logs[ui.date][id];
      if(rec&&confirm('Remove this off-plan exercise and its logged sets from this date?')){
        delete S.logs[ui.date][id];
        if(!Object.keys(S.logs[ui.date]).length) delete S.logs[ui.date];
        delete ui.extra[id];
        pruneArchivedExercises();
        saveState(0);
        render();
      }
      return;
    }
    if(ex&&confirm(`Remove "${ex.name}" from this workout routine? Past logs will be kept and remain available in Progress. This change affects future weeks too.`)){
      const hasHistory=Object.values(S.logs||{}).some(log=>log&&log[id]&&filled(log[id]));
      if(hasHistory){
        if(!S.archivedExercises)S.archivedExercises={};
        S.archivedExercises[id]={name:ex.name,sets:ex.sets,range:ex.range};
      }
      day.ex=day.ex.filter(item=>item.id!==id);
      delete ui.extra[id];
      if(ui.prog===id)ui.prog=null;
      pruneArchivedExercises();
      saveState(0);
      render();
    }
  }
  else if(a==='addset'){
    haptic(10);
    ui.extra[id] = (ui.extra[id] || 0) + 1;
    render();
  }
  else if(a==='starttimer'){
    haptic(10);
    startTimer((T.restTimerMin || 3) * 60);
  }
  else if(a==='timer-add'){
    haptic(10);
    if(targetEndTime > 0){
      targetEndTime += 30000;
      timerTotalSecs += 30;
      updateTimerLogic();
    }
  }
  else if(a==='timer-close'){
    haptic(10);
    stopTimer();
  }
  else if(a==='customtimer'){
    promptCustomTimer();
  }
  else if(a==='copy'){
    const t = document.getElementById('bk');
    t.select();
    document.execCommand('copy');
    document.getElementById('bkmsg').textContent = 'Copied JSON to clipboard!';
  }
  else if(a==='restore'){
    try{
      applyImportedState(JSON.parse(document.getElementById('bk').value));
      render();
      document.getElementById('bkmsg').textContent = 'Restored successfully!';
    }catch(x){
      document.getElementById('bkmsg').textContent = 'Restore failed: ' + (x.message || 'check the backup data.');
    }
  }
  else if(a==='dlrecovery'){
    let raw=null; try{ raw=localStorage.getItem(KEY+'_corrupt'); }catch(_){}
    if(raw) downloadTextFile(raw, exportFileName('rec','json'), 'application/json');
    else alert('No recovery copy was found in this browser.');
  }
  else if(a==='droprecovery'){
    if(confirm('Delete the recovery copy of the unreadable data? This cannot be undone.')){
      try{ localStorage.removeItem(KEY+'_corrupt'); }catch(_){}
      loadProblem=null;
      render();
    }
  }
  else if(a==='exptxt'){
    const name=exportFileName('bak','txt');
    downloadTextFile(createTextBackup(), name);
    document.getElementById('bkmsg').textContent=`TXT backup exported (${name}). You can read it directly or import it later to restore your data.`;
  }
  else if(a==='expcsv'){
    const rows=[['Date','Exercise','Set','Weight','Reps','Note']];
    const allEx=exList();
    Object.keys(S.logs||{}).sort().forEach(d=>{
      Object.keys(S.logs[d]||{}).forEach(exId=>{
        const r=S.logs[d][exId]||{};
        const exItem=allEx.find(x=>x.id===exId);
        const exName=exItem?exItem.name:(S.archivedExercises?.[exId]?.name||exId);
        const sets=Array.isArray(r.sets)?r.sets:[];
        if(!sets.length){ rows.push([d,exName,'','','',r.note||'']); return; }
        sets.forEach((set,idx)=>rows.push([d,exName,idx+1,set?.w ?? '',set?.r ?? '',r.note||'']));
      });
    });
    const csv=rows.map(row=>row.map(csvEscape).join(',')).join('\r\n')+'\r\n';
    const name=exportFileName('csv','csv');
    downloadTextFile(csv, name, 'text/csv;charset=utf-8');
    document.getElementById('bkmsg').textContent=`CSV exported (${name}).`;
  }
  else if(a==='impfile'){
    document.getElementById('impfile_input').click();
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  const f = el.getAttribute('data-f');
  const id = el.getAttribute('data-id');
  const i = el.getAttribute('data-i');

  if(f === 'w' || f === 'r'){
    if(!isValidISODate(ui.date)) return;
    const idx = parseInt(i, 10);
    if(!Number.isInteger(idx) || idx < 0) return;
    if(!S.logs[ui.date]) S.logs[ui.date] = {};
    if(!S.logs[ui.date][id]) S.logs[ui.date][id] = {sets:[], note:''};
    
    while(S.logs[ui.date][id].sets.length <= idx){
      S.logs[ui.date][id].sets.push({w:'', r:''});
    }
    
    const raw = el.value.trim();
    if(raw === ''){
      S.logs[ui.date][id].sets[idx][f] = '';
    } else {
      const value = Number(raw);
      const valid = Number.isFinite(value) && value >= 0 && (f === 'w' || Number.isInteger(value));
      if(valid) S.logs[ui.date][id].sets[idx][f] = value;
      else if(f === 'r') S.logs[ui.date][id].sets[idx][f] = '';
    }
    saveState(320);

    const row = el.closest('.row');
    if(row) {
      const wInput = row.querySelector('[data-f="w"]');
      const rInput = row.querySelector('[data-f="r"]');
      const wVal = wInput ? wInput.value.trim() : '';
      const rVal = rInput ? rInput.value.trim() : '';
      if(wVal !== '' && rVal !== '') row.classList.add('set-done');
      else row.classList.remove('set-done');
    }
  }
  else if(f === 'note'){
    if(!isValidISODate(ui.date)) return;
    if(!S.logs[ui.date]) S.logs[ui.date] = {};
    if(!S.logs[ui.date][id]) S.logs[ui.date][id] = {sets:[], note:''};
    S.logs[ui.date][id].note = el.value;
    saveState(400);
  }
  else if(f === 'bg' || f === 'card' || f === 'acc' || f === 'ink' || f === 'up' || f === 'down' || f === 'heatTrain' || f === 'heatRest'){
    T[f] = el.value;
    saveTheme();
    applyTheme();
  }
});

document.addEventListener('change', e => {
  if(e.target.id === 'date'){
    const candidate = e.target.value;
    if(isValidISODate(candidate)){
      ui.date = candidate;
      ui.day = dayFor(ui.date);
      render();
    } else {
      e.target.value = ui.date;
    }
  }
  else if(e.target.matches && e.target.matches('input[data-f="w"], input[data-f="r"]')){
    const row = e.target.closest('.row');
    const wEl = row && row.querySelector('[data-f="w"]'), rEl = row && row.querySelector('[data-f="r"]');
    if(wEl && rEl && wEl.value.trim() !== '' && rEl.value.trim() !== ''){
      checkPR(e.target.getAttribute('data-id'), num(wEl.value), num(rEl.value));
    }
  }
  else if(e.target.id === 'psel'){
    ui.prog = e.target.value;
    render();
  }
  else if(e.target.id === 's_alarm') {
    document.getElementById('custom-audio-wrap').style.display = e.target.value === 'custom' ? 'block' : 'none';
    T.alarmType = e.target.value;
    saveTheme();
  }
  else if(e.target.id === 's_restmin') {
    const m = Number(e.target.value);
    if(Number.isFinite(m) && m>0 && m<=60){
      T.restTimerMin = m;
      saveTheme();
    } else {
      e.target.value = T.restTimerMin || 3;
    }
  }
  else if(e.target.id === 'c_glass') {
    haptic(15);
    T.glass = e.target.checked;
    saveTheme();
    applyTheme();
  }
  else if(e.target.id === 'custom-audio-file'){
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 500 * 1024) {
      alert('File too large! Please choose a sound under 500KB to ensure smooth backups.');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = function(evt){
      const prevSound = T.customAlarmData;
      T.customAlarmData = evt.target.result;
      _customAudioEl = null;
      if(saveTheme()) alert('Custom sound saved!');
      else { T.customAlarmData = prevSound; alert('Could not save the sound: browser storage is full. Try a smaller file.'); }
    };
    reader.readAsDataURL(file);
  }
  else if(e.target.id === 'impfile_input'){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(evt){
      const content = evt.target.result;
      try{
        const backupStart='LIFTLOG_BACKUP_JSON_BEGIN';
        const backupEnd='LIFTLOG_BACKUP_JSON_END';
        if(content.includes(backupStart) && content.includes(backupEnd)){
          const payload=content.split(backupStart)[1].split(backupEnd)[0].trim();
          applyImportedState(JSON.parse(payload));
        } else if(file.name.toLowerCase().endsWith('.json') || content.trim().startsWith('{')){
          applyImportedState(JSON.parse(content));
        } else if(file.name.toLowerCase().endsWith('.csv')) {
          const parsed = parseCSVLogs(content);
          S.logs = mergeImportedLogs(S.logs, parsed);
          normalizeLogNumbers(S);
        } else {
          const parsed = parseTXTLogs(content);
          S.logs = mergeImportedLogs(S.logs, parsed);
          normalizeLogNumbers(S);
        }
        pruneArchivedExercises();
        saveState(0);
        render();
        document.getElementById('bkmsg').textContent = 'Data imported successfully!';
        alert('Data imported successfully!');
      }catch(err){
        console.error(err);
        document.getElementById('bkmsg').textContent = 'Import failed: ' + (err.message || 'could not parse file.');
        alert('Import failed: ' + (err.message || 'could not parse file.'));
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  }
});

let errorDialogOpen=false;
function showCrashDialog(message, detail=''){
  if(errorDialogOpen) return;
  errorDialogOpen=true;
  const box=document.getElementById('error-box');
  if(!box) return;
  box.innerHTML=`<div class="error-overlay"><div class="error-card"><h2>⚠️ Something went wrong</h2><p>Lift Log hit an unexpected error. Your saved workouts have not been deliberately changed. Try returning to Home or reloading the app.</p><div><b>${esc(String(message||'Unexpected error'))}</b></div><div class="error-detail">${esc(String(detail||''))}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn acc" id="error-home">Go to Home</button><button class="btn" id="error-reload">Reload app</button><button class="btn" id="error-dismiss">Dismiss</button></div></div></div>`;
  document.getElementById('error-home').onclick=()=>{errorDialogOpen=false;box.innerHTML='';try{ui.tab='home';render()}catch(e){showCrashDialog('Could not return Home',e&&e.stack||e)}};
  document.getElementById('error-reload').onclick=()=>location.reload();
  document.getElementById('error-dismiss').onclick=()=>{errorDialogOpen=false;box.innerHTML=''};
}
window.addEventListener('error', e=>{
  showCrashDialog(e.message||'Script error',e.filename?`${e.filename}:${e.lineno||0}:${e.colno||0}`:'');
});
window.addEventListener('unhandledrejection', e=>{
  const reason=e.reason;
  showCrashDialog('An operation failed',reason&&(reason.stack||reason.message)||String(reason||''));
});

window.onload = function(){
  S = loadState();
  T = loadTheme();
  normalizeLogNumbers(S);
  if(pruneArchivedExercises()) saveState(0);
  ui.date = safeDate(ui.date);
  ui.day = dayFor(ui.date);
  render();
};

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden'){
    if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; saveStateImmediate(); }
  }
});
window.addEventListener('beforeunload', ()=>{
  if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; saveStateImmediate(); }
  stopTimer();
});
window.addEventListener('pagehide', ()=>{
  if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; saveStateImmediate(); }
  stopTimer();
});
</script>
