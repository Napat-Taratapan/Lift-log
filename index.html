<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#141413">
<title>Lift Log</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#141413;--card:#1e1e1c;--ink:#efefea;--acc:#ff8a4c;--mute:#9a9a92;--line:#33332f;--accbg:#2c1e16;--ok:#69db7c;--onacc:#111;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:720px;margin:0 auto;padding:4px 12px 80px}
.bar{display:flex;align-items:center;justify-content:space-between;height:48px}
.ttl{font-weight:700;font-size:17px}
.ib{width:40px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:20px;line-height:1;cursor:pointer;padding:0}
h2.sec{font-size:17px;margin:18px 0 2px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tabs button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.tabs button{white-space:nowrap;font-size:13px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
input[type=color]{width:56px;height:36px;padding:2px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0;font-size:16px}
.meta{color:var(--mute);font-size:13px;margin:2px 0 6px}
.last{font-size:13px;color:var(--mute);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:8px}
.up{display:block;margin-top:4px;color:var(--ok);font-weight:600}
.row{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
.row span{color:var(--mute);font-size:13px}
.row input{width:100%;text-align:center}
.note{width:100%;margin-top:4px}
.small{font-size:13px;padding:6px 10px}
.acc{color:var(--acc);border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:12px}
.wrap{overflow-x:auto}
.stats{display:flex;gap:8px;margin:8px 0}
.stat{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--mute)}
.pe{display:grid;grid-template-columns:1fr 54px 76px 38px;gap:6px;margin-bottom:6px}
.warn{background:var(--accbg);color:var(--acc);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:13px}
textarea{width:100%;height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
svg{width:100%;height:auto;display:block}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.cr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
/* home menu */
.hero{padding:28px 4px 22px}
.logo{font-size:46px;line-height:1;font-weight:900;color:var(--acc);text-shadow:3px 3px 0 var(--line)}
.sub{color:var(--mute);margin-top:8px}
.mb{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;font:inherit;cursor:pointer;box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s}
.mb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.mb.sel{border-color:var(--acc);box-shadow:0 5px 0 var(--acc)}
.mb.sel:active{box-shadow:0 1px 0 var(--acc)}
.mb .ic{font-size:26px;width:36px;text-align:center}
.mb b{display:block;font-size:19px}
.mb small{color:var(--mute);font-size:13px}
.mb::after{content:"▸";margin-left:auto;color:var(--acc);font-size:22px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:12px;color:var(--mute);text-align:center;padding:4px 0}
.cd{aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;cursor:pointer}
.cd small{font-size:10px;color:var(--mute);line-height:1}
.cd.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
.cd.on small{color:var(--onacc)}
.cd.td{outline:2px solid var(--acc);outline-offset:1px}
</style>
</head>
<body>
<main>
<div class="bar"><button class="ib" id="back" data-act="go" data-v="home" aria-label="Back to menu">‹</button><div class="ttl" id="ttl"></div><button class="ib" data-act="go" data-v="set" aria-label="Settings">⚙</button></div>
<div id="warn"></div>
<div id="app"></div>
</main>
<script>
const KEY='liftlog_v1',TKEY='liftlog_theme_v1';
const DEF=[["Monday - Pull",[["Lat Pulldown Machine",3,"8-12"],["Chest-Supported Row Machine",3,"8-12"],["Seated Cable Row",2,"10-15"],["Machine Pullover",2,"10-15"],["Reverse Pec Deck",3,"12-15"],["Preacher Curl Machine",3,"8-12"],["Cable Hammer Curl",2,"10-15"]]],
["Tuesday - Legs",[["Leg Press",4,"8-12"],["Hack Squat Machine",3,"8-12"],["Seated Leg Curl",3,"8-12"],["Leg Extension",3,"10-15"],["Hip Thrust Machine",3,"8-12"],["Adductor Machine",2,"12-15"]]],
["Wednesday - Push",[["Incline Chest Press Machine",4,"6-10"],["Pec Deck",3,"10-15"],["Low-to-High Cable Fly",2,"10-15"],["Machine Lateral Raise",3,"10-15"],["Cable Triceps Pushdown",3,"8-12"],["Overhead Cable Triceps Extension",2,"10-15"]]],
["Thursday - Pull",[["Neutral-Grip Lat Pulldown",3,"8-12"],["High Row Machine",3,"8-12"],["Seated Cable Row",3,"10-12"],["Machine Pullover",2,"10-15"],["Reverse Pec Deck",3,"12-15"],["Preacher Curl Machine",3,"8-12"],["Bayesian Cable Curl",2,"10-15"]]],
["Saturday - Legs",[["Seated Leg Curl",4,"8-12"],["Leg Press",3,"10-15"],["Hack Squat Machine",3,"8-12"],["Hip Thrust Machine",3,"8-12"],["Leg Extension",2,"12-15"],["Lying Leg Curl",2,"10-15"],["Adductor Machine",2,"12-15"]]],
["Sunday - Push",[["Incline Chest Press Machine",4,"6-10"],["Incline Press Machine",3,"8-12"],["Pec Deck",3,"10-15"],["Low-to-High Cable Fly",2,"10-15"],["Machine Lateral Raise",3,"10-15"],["Cable Triceps Pushdown",3,"8-12"]]]];
const DEFT={bg:'#141413',card:'#1e1e1c',acc:'#ff8a4c',ink:'#efefea'};
let storageOK=true;
function defPlan(){return DEF.map((d,i)=>({name:d[0],ex:d[1].map((e,j)=>({id:'d'+i+'_'+j,name:e[0],sets:e[1],range:e[2]}))}))}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.plan&&o.logs)return{plan:o.plan,logs:o.logs}}}catch(e){storageOK=false}return{plan:defPlan(),logs:{}}}
function loadT(){try{const r=localStorage.getItem(TKEY);if(r){const o=JSON.parse(r),t={...DEFT};for(const k in DEFT)if(/^#[0-9a-f]{6}$/i.test(o[k]))t[k]=o[k].toLowerCase();return t}}catch(e){}return{...DEFT}}
let S=load(),T=loadT();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}warn()}
function saveT(){try{localStorage.setItem(TKEY,JSON.stringify(T))}catch(e){}}
function warn(){document.getElementById('warn').innerHTML=storageOK?'':'<div class="warn">This browser is blocking saving (private mode?). Entries will be lost when you close the page.</div>'}
/* colours */
const h2r=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const r2h=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=h2r(a),B=h2r(b);return r2h(A.map((v,i)=>v*t+B[i]*(1-t)))};
const lum=h=>{const[r,g,b]=h2r(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
function applyTheme(){
  const s=document.documentElement.style,set=(k,v)=>s.setProperty(k,v);
  set('--bg',T.bg);set('--card',T.card);set('--acc',T.acc);set('--ink',T.ink);
  set('--mute',mix(T.ink,T.bg,.55));set('--line',mix(T.ink,T.card,.16));set('--accbg',mix(T.acc,T.card,.16));
  set('--onacc',lum(T.acc)>.45?'#111111':'#ffffff');set('--ok',lum(T.bg)>.5?'#2b8a3e':'#69db7c');
  s.colorScheme=lum(T.bg)>.5?'light':'dark';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=T.bg;
}
/* helpers */
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dayIdx=d=>S.plan.findIndex(p=>p.name.startsWith(WD[new Date(d+'T00:00').getDay()]));
const dayFor=d=>Math.max(0,dayIdx(d));
const now=new Date();
const ui={tab:'home',date:iso(now),day:0,extra:{},prog:null,cm:{y:now.getFullYear(),m:now.getMonth()}};
ui.day=dayFor(ui.date);
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
const filled=r=>r&&r.sets&&r.sets.some(s=>s&&num(s.w)!==null);
function lastBefore(id,date){const ds=Object.keys(S.logs).filter(d=>d<date&&filled(S.logs[d][id])).sort();return ds.length?ds[ds.length-1]:null}
function topW(r){return Math.max(...r.sets.map(s=>num(s.w)).filter(x=>x!==null))}
function setsTxt(r){return r.sets.filter(s=>s&&num(s.w)!==null).map(s=>s.w+'×'+(s.r||'?')).join(', ')}
function exList(){const o=[];S.plan.forEach(d=>d.ex.forEach(e=>o.push({...e,day:d.name})));return o}

function render(){
  const t=ui.tab;
  document.getElementById('back').style.visibility=t==='home'?'hidden':'visible';
  document.getElementById('ttl').textContent={home:'',log:'Workout',cal:'Calendar',prog:'Progress',set:'Settings'}[t];
  warn();
  document.getElementById('app').innerHTML={home:vHome,log:vLog,cal:vCal,prog:vProg,set:vSet}[t]();
}

function vHome(){
  const k=dayIdx(iso(new Date())),n=Object.keys(S.logs).length;
  const items=[['today','🏋️','Today’s Workout',k>=0?S.plan[k].name:'No session scheduled today'],
    ['cal','📅','Calendar',n?n+(n===1?' workout':' workouts')+' logged':'Nothing logged yet'],
    ['prog','📈','Progress','Charts and personal bests'],
    ['set','⚙️','Settings','Colours, exercises, backup']];
  return'<div class="hero"><div class="logo">Lift Log</div><div class="sub">Choose your next move</div></div>'+
    items.map((x,i)=>`<button class="mb${i?'':' sel'}" data-act="go" data-v="${x[0]}"><span class="ic">${x[1]}</span><span><b>${x[2]}</b><small>${esc(x[3])}</small></span></button>`).join('');
}

function vCal(){
  const{y,m}=ui.cm,first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),td=iso(new Date());
  const name=new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  let h=`<div class="top" style="justify-content:space-between"><button class="btn small" data-act="cm" data-v="-1">‹</button><b>${name}</b><button class="btn small" data-act="cm" data-v="1">›</button></div><div class="cal">`;
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(w=>h+=`<div class="h">${w}</div>`);
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,k=dayIdx(ds),lab=k>=0?S.plan[k].name.split(' - ').pop():'Rest';
    h+=`<button class="cd${S.logs[ds]?' on':''}${ds===td?' td':''}" data-act="cal" data-v="${ds}"><span>${d}</span><small>${esc(lab)}</small></button>`;
  }
  return h+'</div><div class="meta" style="margin-top:10px">Filled days have a logged workout. Tap any day to open it.</div>';
}

function vLog(){
  if(ui.day>=S.plan.length)ui.day=0;
  const d=S.plan[ui.day];
  let h=`<div class="top"><button class="btn small" data-act="dt" data-v="-1">‹</button><input type="date" id="date" value="${ui.date}"><button class="btn small" data-act="dt" data-v="1">›</button><button class="btn small" data-act="today">Today</button></div>`;
  h+='<div class="tabs">'+S.plan.map((p,i)=>`<button class="${i===ui.day?'on':''}" data-act="day" data-v="${i}">${esc(p.name)}</button>`).join('')+'</div>';
  if(!d.ex.length)return h+'<div class="empty">No exercises on this day. Add some in Settings.</div>';
  d.ex.forEach(e=>{
    const rec=(S.logs[ui.date]||{})[e.id]||{sets:[],note:''};
    const lb=lastBefore(e.id,ui.date),lr=lb?S.logs[lb][e.id]:null;
    const n=Math.max(e.sets,rec.sets.length,ui.extra[e.id]||0);
    const hi=parseInt((String(e.range).split('-')[1]||e.range),10);
    let up='';
    if(lr&&hi){const ss=lr.sets.filter(s=>num(s.w)!==null);if(ss.length>=e.sets&&ss.every(s=>(num(s.r)||0)>=hi))up='<span class="up">↑ You hit the top of the range last time. Try a bit heavier.</span>'}
    h+=`<div class="card"><h3>${esc(e.name)}</h3><div class="meta">${e.sets} sets × ${esc(e.range)} reps</div>`;
    if(lr)h+=`<div class="last">Last (${fmt(lb)}): ${esc(setsTxt(lr))}${up}</div>`;
    for(let i=0;i<n;i++){
      const s=rec.sets[i]||{w:'',r:''},ls=lr&&(lr.sets[i]||lr.sets[lr.sets.length-1]);
      h+=`<div class="row"><span>Set ${i+1}</span><input inputmode="decimal" data-id="${e.id}" data-i="${i}" data-f="w" placeholder="${ls&&ls.w?esc(ls.w):'kg'}" value="${esc(s.w)}"><input inputmode="numeric" data-id="${e.id}" data-i="${i}" data-f="r" placeholder="${ls&&ls.r?esc(ls.r):'reps'}" value="${esc(s.r)}"></div>`;
    }
    h+=`<button class="btn small" data-act="addset" data-id="${e.id}">+ set</button><input class="note" data-id="${e.id}" data-f="note" placeholder="Notes" value="${esc(rec.note)}"></div>`;
  });
  return h;
}

function vProg(){
  const all=exList();if(!all.length)return'<div class="empty">No exercises yet.</div>';
  if(!ui.prog||!all.find(e=>e.id===ui.prog))ui.prog=all[0].id;
  const e=all.find(x=>x.id===ui.prog);
  let h='<select id="psel" style="width:100%;margin-bottom:10px">'+S.plan.map(d=>`<optgroup label="${esc(d.name)}">`+d.ex.map(x=>`<option value="${x.id}"${x.id===ui.prog?' selected':''}>${esc(x.name)}</option>`).join('')+'</optgroup>').join('')+'</select>';
  const ds=Object.keys(S.logs).filter(d=>filled(S.logs[d][e.id])).sort();
  if(!ds.length)return h+'<div class="empty">No sessions logged for this exercise yet.<br>Log one in Today’s Workout and it will show up here.</div>';
  const tops=ds.map(d=>topW(S.logs[d][e.id]));
  const cur=tops[tops.length-1],pr=Math.max(...tops),diff=cur-tops[0];
  h+=`<div class="card"><h3>${esc(e.name)}</h3><div class="meta">${esc(e.day)}, ${esc(e.range)} reps</div><div class="stats"><div class="stat"><b>${cur} kg</b><span>Latest top</span></div><div class="stat"><b>${pr} kg</b><span>Best</span></div><div class="stat"><b>${diff>0?'+':''}${Math.round(diff*10)/10} kg</b><span>Since first</span></div></div>${chart(ds,tops)}</div>`;
  h+='<div class="card wrap"><table><tr><th>Date</th><th>Sets (kg×reps)</th><th>Top</th></tr>'+ds.slice().reverse().map(d=>{const r=S.logs[d][e.id];return`<tr><td>${fmt(d)}</td><td>${esc(setsTxt(r))}${r.note?'<br><span class="meta">'+esc(r.note)+'</span>':''}</td><td>${topW(r)}</td></tr>`}).join('')+'</table></div>';
  return h;
}
function chart(ds,v){
  const W=600,H=200,p=34;
  if(v.length<2)return'<div class="meta">Log at least two sessions to see the trend line.</div>';
  let mn=Math.min(...v),mx=Math.max(...v);if(mn===mx){mn-=1;mx+=1}
  const X=i=>p+i*(W-p-12)/(v.length-1),Y=x=>H-24-(x-mn)*(H-44)/(mx-mn);
  const pts=v.map((x,i)=>X(i)+','+Y(x)).join(' ');
  const L='style="stroke:var(--line)"',M='style="fill:var(--mute)"',A='style="fill:var(--acc)"';
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Top weight over time"><line x1="${p}" y1="${Y(mn)}" x2="${W-12}" y2="${Y(mn)}" ${L}/><line x1="${p}" y1="${Y(mx)}" x2="${W-12}" y2="${Y(mx)}" ${L}/><text x="4" y="${Y(mx)+4}" font-size="12" ${M}>${mx}</text><text x="4" y="${Y(mn)+4}" font-size="12" ${M}>${mn}</text><polyline points="${pts}" fill="none" style="stroke:var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="4" ${A}/>`).join('')}<text x="${p}" y="${H-6}" font-size="12" ${M}>${fmt(ds[0])}</text><text x="${W-12}" y="${H-6}" font-size="12" text-anchor="end" ${M}>${fmt(ds[ds.length-1])}</text></svg>`;
}

function vSet(){
  const rows=[['bg','Background'],['card','Main (cards)'],['acc','Select (highlight)'],['ink','Text']];
  let h='<div class="card"><h3>Colours</h3><div class="meta">Changes apply right away.</div>'+
    rows.map(r=>`<div class="cr"><label for="c_${r[0]}">${r[1]}</label><input type="color" id="c_${r[0]}" data-c="${r[0]}" value="${T[r[0]]}"></div>`).join('')+
    '<button class="btn small acc" style="margin-top:10px" data-act="rcol">Restore colours to default</button></div>';
  h+='<h2 class="sec">Exercises</h2><div class="meta" style="margin-bottom:8px">Changes here apply to every week. Logged history is kept. Fields: exercise, sets, rep range.</div>';
  S.plan.forEach((d,di)=>{
    h+=`<div class="card"><h3 style="margin-bottom:8px">${esc(d.name)}</h3>`;
    d.ex.forEach((e,ei)=>{h+=`<div class="pe"><input data-p="name" data-d="${di}" data-e="${ei}" value="${esc(e.name)}"><input inputmode="numeric" data-p="sets" data-d="${di}" data-e="${ei}" value="${e.sets}"><input data-p="range" data-d="${di}" data-e="${ei}" value="${esc(e.range)}"><button class="btn small" data-act="del" data-d="${di}" data-e="${ei}" aria-label="Remove ${esc(e.name)}">✕</button></div>`});
    h+=`<button class="btn small acc" data-act="add" data-d="${di}">+ Add exercise</button></div>`;
  });
  h+='<button class="btn acc" style="width:100%;margin-bottom:10px" data-act="rplan">Restore workout plan to default</button>';
  h+=`<div class="card"><h3>Backup</h3><div class="meta">Your data lives in this browser only. Copy the text below somewhere safe, or paste a backup here and restore it.</div><textarea id="bk">${esc(JSON.stringify({plan:S.plan,logs:S.logs,theme:T}))}</textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn small" data-act="copy">Copy</button><button class="btn small acc" data-act="restore">Restore from text</button></div><div id="bkmsg" class="meta"></div></div>`;
  return h;
}

const app=document.getElementById('app');
app.addEventListener('input',e=>{
  const t=e.target,id=t.dataset.id;
  if(id){
    const L=S.logs[ui.date]=S.logs[ui.date]||{};
    const r=L[id]=L[id]||{sets:[],note:''};
    if(t.dataset.f==='note')r.note=t.value;
    else{const i=+t.dataset.i;while(r.sets.length<=i)r.sets.push({w:'',r:''});r.sets[i][t.dataset.f]=t.value}
    if(!r.note&&!r.sets.some(s=>s.w!==''||s.r!==''))delete L[id];
    if(!Object.keys(L).length)delete S.logs[ui.date];
    save();
  }else if(t.dataset.p){
    const ex=S.plan[+t.dataset.d].ex[+t.dataset.e];
    ex[t.dataset.p]=t.dataset.p==='sets'?Math.max(1,parseInt(t.value)||1):t.value;
    save();
  }else if(t.dataset.c){
    T[t.dataset.c]=t.value;saveT();applyTheme();
  }
});
app.addEventListener('change',e=>{
  if(e.target.id==='date'&&e.target.value){ui.date=e.target.value;ui.day=dayFor(ui.date);ui.extra={};render()}
  if(e.target.id==='psel'){ui.prog=e.target.value;render()}
});
document.body.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='go'){
    if(v==='today'){ui.date=iso(new Date());ui.day=dayFor(ui.date);ui.extra={};ui.tab='log'}
    else{ui.tab=v;if(v==='cal'){const n=new Date();ui.cm={y:n.getFullYear(),m:n.getMonth()}}}
    render();window.scrollTo(0,0);
  }
  else if(a==='cal'){ui.date=v;ui.day=dayFor(v);ui.extra={};ui.tab='log';render();window.scrollTo(0,0)}
  else if(a==='cm'){let{y,m}=ui.cm;m+=+v;if(m<0){m=11;y--}if(m>11){m=0;y++}ui.cm={y,m};render()}
  else if(a==='day'){ui.day=+v;render()}
  else if(a==='dt'){const d=new Date(ui.date+'T00:00');d.setDate(d.getDate()+ +v);ui.date=iso(d);ui.day=dayFor(ui.date);ui.extra={};render()}
  else if(a==='today'){ui.date=iso(new Date());ui.day=dayFor(ui.date);ui.extra={};render()}
  else if(a==='addset'){const id=b.dataset.id,ex=exList().find(x=>x.id===id),rec=(S.logs[ui.date]||{})[id];ui.extra[id]=Math.max(ex.sets,rec?rec.sets.length:0,ui.extra[id]||0)+1;render()}
  else if(a==='add'){S.plan[+b.dataset.d].ex.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:'New exercise',sets:3,range:'8-12'});save();render()}
  else if(a==='del'){const ex=S.plan[+b.dataset.d].ex;if(confirm('Remove '+ex[+b.dataset.e].name+' from the plan? Its logged history is kept.')){ex.splice(+b.dataset.e,1);save();render()}}
  else if(a==='rcol'){if(confirm('Restore the default colours?')){T={...DEFT};saveT();applyTheme();render()}}
  else if(a==='rplan'){if(confirm('Restore the original exercise plan? Your logged weights are kept, but exercises you added will be hidden.')){S.plan=defPlan();save();render()}}
  else if(a==='copy'){const t=document.getElementById('bk');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}document.getElementById('bkmsg').textContent=ok?'Copied.':'Text selected. Use your keyboard’s copy option.'}
  else if(a==='restore'){
    try{const o=JSON.parse(document.getElementById('bk').value);if(!o.plan||!o.logs)throw 0;
      if(confirm('Replace everything in this browser with this backup?')){S={plan:o.plan,logs:o.logs};if(o.theme){const t={...DEFT};for(const k in DEFT)if(/^#[0-9a-f]{6}$/i.test(o.theme[k]))t[k]=o.theme[k].toLowerCase();T=t;saveT();applyTheme()}save();render()}}
    catch(x){document.getElementById('bkmsg').textContent='That text is not a valid backup.'}
  }
});
applyTheme();render();
</script>
</body>
</html>
