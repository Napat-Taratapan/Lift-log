    error.textContent='';
    error.style.display='none';
  });
  document.addEventListener('keydown',onKey);
  document.body.appendChild(root);
  setTimeout(()=>root.querySelector('#ppl-schedule-from')?.focus(),30);
}

function performRemoveExercise(id){
  const sourceDay = sourceDayForDate(ui.date,ui.day);
  const day = getPlanForDate(ui.date)[ui.day];
  const ex = day && day.ex.find(item => item.id === id);
  if(!ex){
    const rec = S.logs[ui.date] && S.logs[ui.date][id];
    if(!rec) return;
    showAppConfirm({
      title: 'Remove exercise?',
      message: 'Remove this off-plan exercise and its logged sets from this date?',
      confirmLabel: 'Remove',
      danger: true,
      onConfirm: ()=>{
        delete S.logs[ui.date][id];
        if(!Object.keys(S.logs[ui.date]).length) delete S.logs[ui.date];
        delete ui.extra[id];
        pruneArchivedExercises();
        saveState(0);
        render();
      }
    });
    return;
  }
  showAppConfirm({
    title: 'Remove from routine?',
    message:S.activeRoutine==='ppl'
      ? 'Use this day as the shared template for matching PPL days from this date forward, then remove "'+ex.name+'". Earlier templates and all logged values are kept.'
      : 'Remove "'+ex.name+'" from this routine? Past logs stay in Progress.',
    confirmLabel: 'Remove',
    danger: true,
    onConfirm: ()=>{
      if(S.activeRoutine==='ppl'){
        const template=pplTemplateForDate(sourceDay,ui.date).filter(item=>item.id!==id);
        if(!syncPplTemplateFromDay(sourceDay,template,ui.date)){
          showAppAlert('Could not sync this PPL template. No routine changes were applied.');
          return;
        }
      }else{
        archiveExerciseIfHasHistory(ex);
        day.ex = day.ex.filter(item => item.id !== id);
      }
      delete ui.extra[id];
      if(ui.prog === id) ui.prog = null;
      pruneArchivedExercises();
      saveState(0);
      render();
    }
  });
}

function positionExerciseContextMenu(menu, card){
  const gap = 10;
  const pad = 12;
  const safeTop = 8 + (parseInt(getComputedStyle(document.documentElement).paddingTop) || 0);
  const safeBottom = 96 + (parseInt(getComputedStyle(document.body).paddingBottom) || 0);
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  menu.style.left = '0px';
  menu.style.top = '0px';
  menu.style.visibility = 'hidden';
  menu.style.display = 'block';
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  menu.style.visibility = '';

  const place = ()=>{
    const vr = card.getBoundingClientRect();
    const spaceBelow = vh - safeBottom - vr.bottom;
    const spaceAbove = vr.top - safeTop;
    let below = true;
    if(spaceBelow < mh + gap && spaceAbove >= mh + gap) below = false;
    else if(spaceBelow >= mh + gap) below = true;
    else if(spaceAbove >= spaceBelow) below = false;

    let top = below ? vr.bottom + gap : vr.top - gap - mh;
    let left = vr.left + (vr.width - mw) / 2;
    left = Math.max(pad, Math.min(left, vw - mw - pad));
    top = Math.max(safeTop, Math.min(top, vh - safeBottom - mh));

    menu.style.left = Math.round(left) + 'px';
    menu.style.top = Math.round(top) + 'px';
    menu.classList.toggle('place-above', !below);
    return { below, spaceBelow, spaceAbove, mh, vr };
  };

  let info = place();
  const needsScroll =
    (info.below && info.spaceBelow < info.mh + gap) ||
    (!info.below && info.spaceAbove < info.mh + gap);

  if(needsScroll){
    const overflow = info.below
      ? (info.mh + gap) - info.spaceBelow
      : (info.mh + gap) - info.spaceAbove;
    const targetScroll = info.below
      ? window.scrollY + overflow + 8
      : Math.max(0, window.scrollY - overflow - 8);
    if(exCtx) exCtx.ignoreScrollUntil = Date.now() + 450;
    window.scrollTo({ top: targetScroll, behavior: 'smooth' });
    let frames = 0;
    const reposition = ()=>{
      frames++;
      place();
      if(frames < 24) requestAnimationFrame(reposition);
    };
    requestAnimationFrame(reposition);
    setTimeout(()=>place(), 360);
  }
}

    if(act === 'units'){ setExerciseUnit(exId,unitForExercise(exId)==='kg'?'lbs':'kg'); render(true); return; }
    closeExerciseContextMenu();
    if(act === 'last') renderSetInsight(exId,0,'last');
    else if(act === 'suggested') renderSetInsight(exId,0,'suggested');
    else if(act === 'progress'){
      const day=getPlanForDate(ui.date)[ui.day];
      ui.progressReturn={date:ui.date,day:ui.day,dayOverrideDate:ui.dayOverrideDate,routine:S.activeRoutine,dayName:day&&day.name||'workout',scrollY:window.scrollY};
      ui.prog=exId;
      ui.tab='prog';
      render();
      window.scrollTo(0,0);
    }
    else if(act === 'rename') startRenameExercise(exId);
    else if(act === 'remove') performRemoveExercise(exId);
  });

  document.body.appendChild(bd);
  document.body.appendChild(menu);
  positionExerciseContextMenu(menu, card);
  exCtx = { card, id, opened: true, ignoreScrollUntil: prevIgnore || 0 };
}

function beginProgressivePress(card){
  if(!card) return null;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){
    card.classList.add('ctx-pressing');
    return null;
  }
  card.classList.add('ctx-pressing');
  const t0 = performance.now();
  const dur = 420;
  let raf = 0;
  const step = (now)=>{
    if(!exCtx || exCtx.card !== card || exCtx.opened) return;
    const p = Math.min(1, (now - t0) / dur);
    // Ease out toward 1.03
    const s = 1 + 0.03 * (1 - Math.pow(1 - p, 2));
    card.style.transform = 'scale('+s.toFixed(4)+')';
    if(p < 1){
      raf = requestAnimationFrame(step);
      if(exCtx) exCtx.pressRaf = raf;
    }
  };
  raf = requestAnimationFrame(step);
  return raf;
}

function onExCtxPointerDown(e){
  if(ui.tab !== 'today' && ui.tab !== 'log') return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  if(document.body.classList.contains('exercise-reordering')) return;
  if(e.target.closest('input, textarea, select, button, a, .drag-handle, [data-drag-handle], [data-act], [data-ex-collapse-toggle]')) return;
  const card = e.target.closest('[data-ex-card]');
  if(!card) return;

  if(exCtx && exCtx.timer) clearTimeout(exCtx.timer);
  if(exCtx && exCtx.pressRaf) cancelAnimationFrame(exCtx.pressRaf);
  if(exCtx && !exCtx.opened) closeExerciseContextMenu();

  const startX = e.clientX, startY = e.clientY;
  const pointerId = e.pointerId;
  exCtx = {
    card, id: card.getAttribute('data-ex-card'),
    startX, startY, pointerId, opened: false, ignoreScrollUntil: 0,
    pressRaf: null,
    timer: null
  };
  exCtx.pressRaf = beginProgressivePress(card);
  exCtx.timer = setTimeout(()=>{
    if(!exCtx || exCtx.card !== card) return;
    if(exCtx.pressRaf) cancelAnimationFrame(exCtx.pressRaf);
    openExerciseContextMenu(card, startX, startY);
  }, 380);
}

function onExCtxPointerMove(e){
  if(!exCtx || exCtx.opened) return;
  if(exCtx.pointerId !== undefined && e.pointerId !== exCtx.pointerId) return;
  const dx = e.clientX - exCtx.startX;
  const dy = e.clientY - exCtx.startY;
  if(Math.hypot(dx, dy) > 12){
    if(exCtx.timer) clearTimeout(exCtx.timer);
    if(exCtx.pressRaf) cancelAnimationFrame(exCtx.pressRaf);
    if(exCtx.card){
      exCtx.card.classList.remove('ctx-pressing');
      exCtx.card.style.transform = '';
    }
    exCtx = null;
  }
}

function onExCtxPointerUp(e){
  if(!exCtx) return;
  if(exCtx.pointerId !== undefined && e.pointerId !== undefined && e.pointerId !== exCtx.pointerId) return;
  if(!exCtx.opened){
    if(exCtx.timer) clearTimeout(exCtx.timer);
    if(exCtx.pressRaf) cancelAnimationFrame(exCtx.pressRaf);
    if(exCtx.card){
      exCtx.card.classList.remove('ctx-pressing');
      exCtx.card.style.transform = '';
    }
    exCtx = null;
  }
}

function dismissExLongpressTip(){
  try{ localStorage.setItem(EX_TIP_KEY, '1'); }catch(_){}
  const el = document.getElementById('ex-longpress-tip');
  if(el) el.remove();
}

function shouldShowExLongpressTip(){
  try{
    if(localStorage.getItem(EX_TIP_KEY)) return false;
    const hasPriorLiftLogData=Object.keys(localStorage).some(key=>key.startsWith('liftlog_'));
    if(hasPriorLiftLogData){ localStorage.setItem(EX_TIP_KEY,'existing'); return false; }
    // Mark it seen on first display so it stays a one-time hint even if it is not dismissed.
    localStorage.setItem(EX_TIP_KEY,'seen');
    return true;
  }catch(_){ return false; }
}

        }else if(syncPpl){
          const nextTemplate=[...template,{id:newPplExerciseId(),name:clean,sets,range:cleanRange}];
          if(!syncPplTemplateFromDay(sourceDay,nextTemplate,ui.date)){
            showAppAlert('Could not sync this PPL template. No routine changes were applied.');
            return;
          }
          const id=nextTemplate[nextTemplate.length-1].id;
          if(!S.logs[ui.date]) S.logs[ui.date]={};
          S.logs[ui.date][id]={sets:Array.from({length:sets},()=>({w:'',r:''})),note:''};
        }else{
          const id=newExerciseId();
          if(!S.archivedExercises) S.archivedExercises={};
          S.archivedExercises[id]={name:clean,sets,range:cleanRange,sessionOnlyDate:ui.date};
          if(!S.logs[ui.date]) S.logs[ui.date]={};
          S.logs[ui.date][id]={sets:Array.from({length:sets},()=>({w:'',r:''})),note:''};
        }
        saveState(0);
        render();
      }
    });
  }
  else if(a==='removeexercise'){
    performRemoveExercise(id);
  }
  else if(a==='addset'){
    const ex = resolveLogExercise(id);
    const currentN = visibleSetCount(ex,(S.logs[ui.date]||{})[id],ui.date);
    const sourceDay=sourceDayForDate(ui.date,ui.day);
    const syncPlannedCount=isPplTemplateExercise(sourceDay,id,ui.date);
    if(syncPlannedCount&&currentN>=50){
      showAppAlert('A shared PPL exercise cannot have more than 50 planned sets.');
      return;
    }
    if(syncPlannedCount&&!syncPplPlannedSets(sourceDay,id,currentN+1,ui.date)){
      showAppAlert('Could not sync this PPL set-count change. No workout data was changed.');
      return;
    }
    if(!S.logs[ui.date]) S.logs[ui.date]={};
    const rec = S.logs[ui.date][id] || (S.logs[ui.date][id]={sets:[],note:''});
    haptic(10);
    rec.setCountOverride=currentN+1;
    ui.extra[setCountKey(id, ui.date)] = rec.setCountOverride;
    saveState(0);
    updateWorkoutProgress();
    animateAddSetRow(id);
  }
  else if(a==='removeset'){
    const ex = resolveLogExercise(id);
    const rec = (S.logs[ui.date] && S.logs[ui.date][id]) || {sets:[], note:''};
    const currentN = visibleSetCount(ex, rec, ui.date);
    if(currentN <= 1) return;
    haptic(10);
    const nextN = currentN - 1;
    const sourceDay=sourceDayForDate(ui.date,ui.day);
    const syncPlannedCount=isPplTemplateExercise(sourceDay,id,ui.date)&&nextN<=50;
    const remove=()=>{
      if(syncPlannedCount&&!syncPplPlannedSets(sourceDay,id,nextN,ui.date)){
        showAppAlert('Could not sync this PPL set-count change. No workout data was changed.');
        return;
      }
      if(!S.logs[ui.date]) S.logs[ui.date]={};
      const savedRec=S.logs[ui.date][id]||(S.logs[ui.date][id]={sets:[],note:''});
      savedRec.setCountOverride=nextN;
      ui.extra[setCountKey(id, ui.date)] = nextN;
      if(Array.isArray(savedRec.sets) && savedRec.sets.length > nextN){
        savedRec.sets = savedRec.sets.slice(0, nextN);
      }
      saveState(0);
      updateWorkoutProgress();
      animateRemoveSetRow(id, nextN);
    };
    const trailing=rec.sets&&rec.sets[currentN-1];
    if(trailing && (trailing.w!==''&&trailing.w!=null || trailing.r!==''&&trailing.r!=null)){
      showAppConfirm({
        title:'Remove completed set?',
        message:syncPlannedCount
          ? 'This removes the logged values from this date and updates the shared planned set count on matching PPL days from this date forward. Earlier templates and other dates’ logs stay unchanged.'
          : 'This set has logged values. Removing it will delete those values from this workout.',
        confirmLabel:'Remove set',danger:true,onConfirm:remove
      });
    } else remove();
  }
  else if(a==='renameexercise'){
    startRenameExercise(id);
  }
  else if(a==='starttimer'){
    haptic(10);
    startTimer((T.restTimerMin || 3) * 60);
  }
  else if(a==='starttimer-suggested'){
    const seconds=Number(v);
    if(Number.isFinite(seconds)&&seconds>0) startTimer(seconds);
  }
  else if(a==='timer-restart'){
    haptic(10);
    startTimer((T.restTimerMin || 3) * 60);
  }
  else if(a==='timer-close'){
    haptic(10);
    dismissTimer();
  }
  else if(a==='customtimer'){
    if(Date.now() >= timerNoClickUntil) promptCustomTimer();
  }
  else if(a==='copy'){
    const t = document.getElementById('bk');
    t.select();
    const copied=document.execCommand('copy');
    document.getElementById('bkmsg').textContent = copied ? 'Copied JSON backup to clipboard!' : 'Copy failed. Select and copy the JSON manually.';
    if(copied) markFullBackupDate();
  }
  else if(a==='restore'){
    try{
      applyImportedState(JSON.parse(document.getElementById('bk').value));
      render();
      document.getElementById('bkmsg').textContent = 'Restored successfully!';
    }catch(x){
      document.getElementById('bkmsg').textContent = 'Restore failed: ' + (x.message || 'check the backup data.');
    }
  }
  else if(a==='dlrecovery'){
    let raw=null; try{ raw=safeStorageGet(RECOVERY_KEY); }catch(_){ }
    if(raw) downloadTextFile(raw, exportFileName('rec','json'), 'application/json');
    else showAppAlert('No recovery copy was found in this browser.');
  }
  else if(a==='droprecovery'){
    showAppConfirm({
      title:'Delete recovery copy?',
      message:'Delete the recovery copy of the unreadable data? This cannot be undone.',
      confirmLabel:'Delete copy',danger:true,
      onConfirm:()=>{safeStorageRemove(RECOVERY_KEY);loadProblem=null;render();}
    });
  }
  else if(a==='exptxt'){
    const name=exportFileName('bak','txt');
    downloadTextFile(createTextBackup(), name);
    document.getElementById('bkmsg').innerHTML=`TXT backup download started (${esc(name)}). After saving it to Files, confirm here: <button type="button" class="btn small" data-act="confirm-backup-export">I saved it</button>`;
  }
  else if(a==='confirm-backup-export'){
    const recorded=markFullBackupDate();
    document.getElementById('bkmsg').textContent=recorded?'Backup saved and reminder reset.':'Backup saved, but the reminder date could not be stored in this browser.';
  }
  else if(a==='expcsv'){
    const rows=[['Date','Exercise','Exercise ID','Set','Weight','Reps','Note','Unit','Record Type']];
    Object.keys(S.logs||{}).sort().forEach(d=>{
      Object.keys(S.logs[d]||{}).forEach(exId=>{
        const r=S.logs[d][exId]||{};
        const exName=exerciseNameById(exId);
        const sets=Array.isArray(r.sets)?r.sets:[];
        const unit=unitForExercise(exId);
        if(!sets.length){ rows.push([d,exName,exId,'','','','',unit,'workout']); return; }
        sets.forEach((set,idx)=>rows.push([d,exName,exId,idx+1,set?.w===''||set?.w==null?'':formatExerciseWeight(exId,set.w),set?.r ?? '',r.note||'',unit,'workout']));
      });
    });
    const weightUnit=S.weightUnit==='lbs'?'lbs':'kg';
    Object.keys(S.weightLogs||{}).sort().forEach(date=>{
      const kg=Number(S.weightLogs[date]);
      const display=weightUnit==='lbs'?kg*LB_PER_KG:kg;
      rows.push([date,'','','',Number.isFinite(display)?display.toFixed(3):'','','',weightUnit,'body_weight']);
    });
    const csv=rows.map(row=>row.map(csvEscape).join(',')).join('\r\n')+'\r\n';
    const name=exportFileName('csv','csv');
    downloadTextFile(csv, name, 'text/csv;charset=utf-8');
    document.getElementById('bkmsg').textContent=`CSV exported (${name}).`;
  }
  else if(a==='impfile'){
    document.getElementById('impfile_input').click();
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if(el.id==='weight-value'){updateWeightDialDisplay();return;}
  const cust = el.getAttribute('data-cust');
  if(cust){
    const di = parseInt(el.getAttribute('data-di'), 10);
    const ei = parseInt(el.getAttribute('data-ei'), 10);
    const plan = getCustomPlan();
    if(!Number.isInteger(di) || di<0 || di>=plan.length) return;
    if(cust === 'dayname'){
      const name = el.value.trim();
      if(name) plan[di].name = name;
      saveState(400);
      return;
    }
    if(!plan[di].ex || !Number.isInteger(ei) || ei<0 || ei>=plan[di].ex.length) return;
    if(cust === 'exname'){
      return;
    }
    if(cust === 'sets'){
      const n = parseInt(el.value, 10);
      if(Number.isInteger(n) && n>=1 && n<=20) plan[di].ex[ei].sets = n;
      saveState(400);
      return;
    }
    if(cust === 'range'){
      const r = el.value.trim();
      if(r) plan[di].ex[ei].range = r;
      saveState(400);
      return;
    }
    return;
  }
  const f = el.getAttribute('data-f');
  const id = el.getAttribute('data-id');
  const i = el.getAttribute('data-i');

  if(f === 'w' || f === 'r'){
    if(!isValidISODate(ui.date)) return;
    const idx = parseInt(i, 10);
    if(!Number.isInteger(idx) || idx < 0) return;
    if(!S.logs[ui.date]) S.logs[ui.date] = {};
    if(!S.logs[ui.date][id]) S.logs[ui.date][id] = {sets:[], note:''};
    
    while(S.logs[ui.date][id].sets.length <= idx){
      S.logs[ui.date][id].sets.push({w:'', r:''});
    }
    
    const raw = el.value.trim();
    if(raw === ''){
      S.logs[ui.date][id].sets[idx][f] = '';
    } else {
      const value = Number(raw);
      const valid = Number.isFinite(value) && value >= 0 && (f === 'w' || Number.isInteger(value));
      if(valid) S.logs[ui.date][id].sets[idx][f] = f==='w'?weightToKg(id,value):value;
      else if(f === 'r') S.logs[ui.date][id].sets[idx][f] = '';
    }
    saveState(320);

    const row = el.closest('.row');
    if(row) {
      const wInput = row.querySelector('[data-f="w"]');
      const rInput = row.querySelector('[data-f="r"]');
      const wVal = wInput ? wInput.value.trim() : '';
      const rVal = rInput ? rInput.value.trim() : '';
      
      if(wVal !== '' && rVal !== '') {
        if(!row.classList.contains('set-done')) {
          row.classList.add('set-done', 'set-just-done');
          haptic(15);
          setTimeout(() => row.classList.remove('set-just-done'), 500);
        }
      } else {
        row.classList.remove('set-done', 'set-just-done');
      }
      const card=el.closest('[data-ex-card]');
      if(T.focusMode&&card){
        const planned=Math.max(1,Number(card.getAttribute('data-planned-sets'))||1);
        const completed=card.querySelectorAll('.row.set-done').length;
        if(completed>=planned) setExerciseCollapsed(card,true);
      }
      updateWorkoutProgress();
    }
  }
  else if(f === 'note'){
    if(!isValidISODate(ui.date)) return;
    if(!S.logs[ui.date]) S.logs[ui.date] = {};
    if(!S.logs[ui.date][id]) S.logs[ui.date][id] = {sets:[], note:''};
    S.logs[ui.date][id].note = el.value;
    saveState(400);
  }
  else if(f === 'bg' || f === 'card' || f === 'acc' || f === 'ink' || f === 'up' || f === 'down' || f === 'heatTrain' || f === 'heatRest'){
    T[f] = el.value;
    saveTheme();
    applyTheme();
  }
});

document.addEventListener('change', e => {
  const cust = e.target.getAttribute && e.target.getAttribute('data-cust');
  if(cust === 'dayname' || cust === 'exname' || cust === 'range' || cust === 'sets'){
    const di = parseInt(e.target.getAttribute('data-di'), 10);
    const ei = parseInt(e.target.getAttribute('data-ei'), 10);
    const plan = getCustomPlan();
    if(cust === 'dayname' && plan[di]){
      if(!e.target.value.trim()){ e.target.value = plan[di].name; }
      else {
        const name=e.target.value.trim();
        if(name!==plan[di].name){
          const previousSchedule=customScheduleForDate(iso(new Date()));
          plan[di].name=name;
          recordCustomScheduleChange(previousSchedule);
          saveState(0);
        }
      }
    }
    if(cust === 'exname' && plan[di] && plan[di].ex && plan[di].ex[ei]){
      const exercise=plan[di].ex[ei],name=e.target.value.trim();
      if(!name){e.target.value=exercise.name;}
      else{
        const result=renameExerciseEverywhere(exercise.id,name);
        if(result.ok){
          if(result.unchanged) e.target.value=exercise.name;
          else{
            document.querySelectorAll('#custom-routine-editor [data-cust="exname"]').forEach(input=>{
              const inputDay=Number(input.getAttribute('data-di'));
              const inputExercise=Number(input.getAttribute('data-ei'));
              const current=plan[inputDay]&&plan[inputDay].ex&&plan[inputDay].ex[inputExercise];
              if(current) input.value=current.name;
            });
            invalidateDerived();
            saveState(0);
          }
        }else e.target.value=exercise.name;
      }
    }
    if(cust === 'sets' && plan[di] && plan[di].ex && plan[di].ex[ei]){
      const n = parseInt(e.target.value, 10);
      if(!Number.isInteger(n) || n<1 || n>20){ e.target.value = plan[di].ex[ei].sets; }
      else { plan[di].ex[ei].sets = n; saveState(0); }
    }
    if(cust === 'range' && plan[di] && plan[di].ex && plan[di].ex[ei]){
      if(!e.target.value.trim()){ e.target.value = plan[di].ex[ei].range; }
      else { plan[di].ex[ei].range = e.target.value.trim(); saveState(0); }
    }
  }
  if(e.target.id === 's_backup_reminder'){
    T.backupReminder=e.target.checked;
    const daysInput=document.getElementById('s_backup_days');
    if(daysInput) daysInput.disabled=!T.backupReminder;
    saveTheme();
  }
  else if(e.target.id === 's_backup_days'){
    const days=Math.round(Number(e.target.value));
    if(Number.isFinite(days)&&days>=1&&days<=365){T.backupReminderDays=days;saveTheme();}
    else e.target.value=T.backupReminderDays;
  }
  else if(e.target.id === 'date'){
    const candidate = e.target.value;
    if(isValidISODate(candidate)){
      ui.date = candidate;
      ui.dayOverrideDate = null;
      ui.day = dayFor(ui.date);
      render();
    } else {
      e.target.value = ui.date;
    }
  }
  else if(e.target.matches && e.target.matches('input[data-f="w"], input[data-f="r"]')){
    const row = e.target.closest('.row');
    const wEl = row && row.querySelector('[data-f="w"]'), rEl = row && row.querySelector('[data-f="r"]');
    if(wEl && rEl && wEl.value.trim() !== '' && rEl.value.trim() !== ''){
      checkPR(e.target.getAttribute('data-id'), weightToKg(e.target.getAttribute('data-id'),num(wEl.value)), num(rEl.value));
    }
  }
  else if(e.target.id === 'psel'){
    ui.prog = e.target.value;
    ui.progShowAll=false;
    ui.progTableAll=false;
    render();
  }
  else if(e.target.id === 's_alarm') {
    document.getElementById('custom-audio-wrap').style.display = e.target.value === 'custom' ? 'block' : 'none';
    T.alarmType = e.target.value;
    saveTheme();
  }
  else if(e.target.id === 's_focus_mode') {
    T.focusMode=e.target.checked;
    saveTheme();
    render(true);
  }
  else if(e.target.id === 's_rest_suggestions') {
    T.restSuggestions=e.target.checked;
    saveTheme();
    render(true);
  }
  else if(e.target.id === 's_restmin') {
    const m = Number(e.target.value);
    if(Number.isFinite(m) && m>0 && m<=60){
      T.restTimerMin = m;
      saveTheme();
    } else {
      e.target.value = T.restTimerMin || 3;
    }
  }
  else if(e.target.id === 'c_glass') {
    haptic(15);
    T.glass = e.target.checked;
    saveTheme();
    applyTheme();
  }
  else if(e.target.id === 'custom-audio-file'){
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 500 * 1024) {
      showAppAlert('File too large! Please choose a sound under 500KB to ensure smooth backups.');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = function(evt){
      const prevSound = T.customAlarmData;
      T.customAlarmData = evt.target.result;
      _customAudioEl = null;
      if(saveTheme()) showAppAlert('Custom sound saved!');
      else { T.customAlarmData = prevSound; showAppAlert('Could not save the sound: browser storage is full. Try a smaller file.'); }
    };
    reader.readAsDataURL(file);
  }
  else if(e.target.id === 'impfile_input'){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    const reportReadFailure=message=>{
      console.error(reader.error||message);
      const bkmsg=document.getElementById('bkmsg');
      if(bkmsg) bkmsg.textContent='Import failed: '+message;
      showAppAlert('Import failed: '+message);
      e.target.value='';
    };
    reader.onerror=()=>reportReadFailure(reader.error&&reader.error.message||'could not read file.');
    reader.onabort=()=>reportReadFailure('file reading was cancelled.');
    reader.onload = function(evt){
      const content = evt.target.result;
      const previousArchived=S.archivedExercises?{...S.archivedExercises}:null;
      let importCommitted=false;
      try{
        const backupStart='LIFTLOG_BACKUP_JSON_BEGIN';
        const backupEnd='LIFTLOG_BACKUP_JSON_END';
        if(content.includes(backupStart) && content.includes(backupEnd)){
          const payload=content.split(backupStart)[1].split(backupEnd)[0].trim();
          applyImportedState(JSON.parse(payload));
          importCommitted=true;
        } else if(file.name.toLowerCase().endsWith('.json') || content.trim().startsWith('{')){
          applyImportedState(JSON.parse(content));
          importCommitted=true;
        } else if(file.name.toLowerCase().endsWith('.csv')) {
          const parsed = parseCSVLogs(content);
          applyImportedState({
            ...S,
            logs:mergeImportedLogs(S.logs,parsed.logs),
            weightLogs:{...(S.weightLogs||{}),...parsed.weightLogs},
            weightUnit:parsed.weightUnit||S.weightUnit
          });
          importCommitted=true;
        } else {
          const parsed = parseTXTLogs(content);
          applyImportedState({
            ...S,
            logs:mergeImportedLogs(S.logs,parsed.logs),
            weightLogs:{...(S.weightLogs||{}),...parsed.weightLogs},
            weightUnit:parsed.weightUnit||S.weightUnit
          });
          importCommitted=true;
        }
        pruneArchivedExercises();
        saveState(0);
        render();
        document.getElementById('bkmsg').textContent = 'Data imported successfully!';
        showAppAlert('Data imported successfully!');
      }catch(err){
        if(!importCommitted){
          if(previousArchived) S.archivedExercises=previousArchived;
          else delete S.archivedExercises;
        }
        console.error(err);
        document.getElementById('bkmsg').textContent = 'Import failed: ' + (err.message || 'could not parse file.');
        showAppAlert('Import failed: ' + (err.message || 'could not parse file.'));
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  }
});

let errorDialogOpen=false;
let lastCrashAction='No recent button action recorded';
document.addEventListener('click',event=>{
  const target=event.target;
  const action=target&&target.closest?target.closest('[data-act]'):null;
  if(action) lastCrashAction=String(action.getAttribute('data-act')||'Unknown action');
},true);
function likelyCrashCause(message, detail=''){
  const text=String(message||'')+'\n'+String(detail||'');
  if(/QuotaExceededError|quota.?exceeded|storage.?full/i.test(text))
    return 'Browser storage may be full or unavailable. The app may have failed while saving data.';
  if(/Cannot read propert(?:y|ies) of (?:null|undefined)|undefined is not an object|null is not an object/i.test(text))
    return 'Code tried to read a property from a missing value. This can happen when expected app data or a page element is absent.';
  if(/(?:is not a function|not callable)/i.test(text))
    return 'Code tried to call a value that is not a function. A stale UI element or unexpected data shape may be involved.';
  if(/ReferenceError:.*is not defined|\b[A-Za-z_$][\w$]* is not defined/i.test(text))
    return 'Code referenced a variable or function that is not defined. Check for a typo or code running before initialization.';
  if(/Maximum call stack size exceeded|too much recursion/i.test(text))
    return 'A function may be calling itself repeatedly without reaching a stopping condition.';
  if(/SyntaxError.*JSON|Unexpected token.*JSON|JSON\.parse/i.test(text))
    return 'JSON parsing failed. Imported data or saved browser data may be malformed.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(text))
    return 'A network request may have failed or been blocked.';
  if(/TypeError/i.test(text))
    return 'A value had an unexpected type or shape. The stack trace below may identify where it happened.';
  return 'The exact cause could not be inferred automatically. Use the error message and first app-code stack frame below to investigate.';
}
function showCrashDialog(message, detail='', location=''){
  if(errorDialogOpen) return;
  const box=document.getElementById('error-box');
  if(!box) return;
  errorDialogOpen=true;
  const reason=String(message||'Unexpected error');
  const details=String(detail||'');
  const appContext='Screen: '+String(ui&&ui.tab||'unknown')+' · Last button action: '+lastCrashAction;
  box.innerHTML=`<div class="error-overlay"><div class="error-card"><h2>⚠️ Something went wrong</h2><p>An unexpected error occurred. Changes since the last successful save may not be saved.</p><div><b>Error:</b> ${esc(reason)}</div>${location?`<div class="error-context"><b>Location:</b> ${esc(location)}</div>`:''}<div class="error-suspect"><b>Likely cause (best-effort guess):</b><br>${esc(likelyCrashCause(reason,details))}</div><div class="error-context">${esc(appContext)}</div>${details?`<details><summary>Technical details (stack trace)</summary><div class="error-detail">${esc(details)}</div></details>`:''}<div style="font-size:11px;color:var(--mute);margin:8px 0">The suspected cause is an automated hint, not a confirmed diagnosis. No crash details are sent anywhere.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn acc" id="error-home">Go to Home</button><button class="btn" id="error-reload">Reload app</button><button class="btn" id="error-dismiss">Dismiss</button></div></div></div>`;
  document.getElementById('error-home').onclick=()=>{errorDialogOpen=false;box.innerHTML='';try{ui.tab='home';render()}catch(e){showCrashDialog('Could not return Home',e&&e.stack||e)}};
  document.getElementById('error-reload').onclick=()=>location.reload();
  document.getElementById('error-dismiss').onclick=()=>{errorDialogOpen=false;box.innerHTML=''};
}
window.addEventListener('error', e=>{
  const error=e.error;
  const location=e.filename?`${e.filename}:${e.lineno||0}:${e.colno||0}`:'Location unavailable (possibly a cross-origin script error).';
  showCrashDialog(e.message||'Script error',error&&error.stack||'',location);
});
window.addEventListener('unhandledrejection', e=>{
  const reason=e.reason;
  const message=reason&&reason.message?reason.message:String(reason||'An operation failed');
  showCrashDialog(message,reason&&reason.stack||'Unhandled promise rejection', '');
});

const pullRefresh={startY:null,active:false,ready:false,loading:false,timer:null};
const pullRefreshDeadZone=18;
const pullRefreshTravel=260;
const pullRefreshMaxShift=92;
function resetPullRefresh(){
  const indicator=document.getElementById('pull-refresh');
  if(pullRefresh.timer){clearTimeout(pullRefresh.timer);pullRefresh.timer=null;}
  pullRefresh.startY=null;
  pullRefresh.active=false;
  pullRefresh.ready=false;
  pullRefresh.loading=false;
