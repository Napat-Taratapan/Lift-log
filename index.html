function timerShowBox(box){
  if(timerExitTimer){ clearTimeout(timerExitTimer); timerExitTimer=null; }
  timerExitTok++;
  box.classList.remove('exiting','docked-left','docked-right','dragging','scrubbing','finished');
  box.style.opacity=''; box.style.transition='none';
  const body=box.querySelector('.timer-body'); if(body) body.style.opacity='';
  box.style.display='flex';
  const vw=window.innerWidth, w=box.offsetWidth||240;
  if(timerRestPos){
    timerSetPos(Math.max(12, Math.min(vw-w-12, timerRestPos.x)), timerClampY(timerRestPos.y));
  }
  const rect=box.getBoundingClientRect();
  const side=(rect.left + w/2) < vw/2 ? 'left' : 'right';
  box.style.setProperty('--tin', (side==='left' ? -(rect.left+w+24) : (vw-rect.left+24))+'px');
  box.style.animation='none'; void box.offsetWidth; box.style.animation='';
}
function timerUndockIfDocked(){
  const box=_tbox(); if(!box) return;
  const l=box.classList.contains('docked-left'), r=box.classList.contains('docked-right');
  if(!l && !r) return;
  const rect=box.getBoundingClientRect(), w=timerW();
  timerUndockTo(l ? 16 : Math.max(16, window.innerWidth-w-16), rect.top);
}

function startTimer(durationInSeconds){
  if(!Number.isFinite(durationInSeconds) || durationInSeconds <= 0) return;
  const box=_tbox();
  if(!box) return;
  timerCancelAnims();
  const visible = box.style.display==='flex' && !box.classList.contains('exiting');
  timerTotalSecs = durationInSeconds;
  targetEndTime = 0;

  if(!visible){
    timerShowBox(box);
    timerPaint(1, durationInSeconds);
    timerBeginCountdown(durationInSeconds);
  } else {
    timerUndockIfDocked();
    timerRunRefill(durationInSeconds);
  }
}

function timerFrameLoop(){
  if(targetEndTime === 0) return;
  const now = Date.now();
  const remMs = Math.max(0, targetEndTime - now);
  timerSecs = Math.ceil(remMs / 1000);
  
  const pct = timerTotalSecs > 0 ? remMs / (timerTotalSecs * 1000) : 0;
  timerPaint(pct, timerSecs);

  if (remMs <= 0) {
    timerInterval = null;
    targetEndTime = 0;
    const box = _tbox();
    if(box) box.classList.add('finished');
    playAlarm();
    haptic([200,100,200,100,200]);
    return;
  }
  timerInterval = requestAnimationFrame(timerFrameLoop);
}

function timerBeginCountdown(secs){
  timerSecs = secs;
  targetEndTime = Date.now() + secs*1000;
  if(timerInterval) cancelAnimationFrame(timerInterval);
  const box = _tbox();
  if(box) box.classList.remove('finished');
  timerInterval = requestAnimationFrame(timerFrameLoop);
}

function timerRunRefill(toSecs){
  const fromFrac=timerDispFrac, fromSecs=timerDispSecs;
  const dur = 350 + 550*(1-_clamp01(fromFrac));
  const r = timerRefill = {raf:0, fb:0, t0:performance.now()};
  const finish = ()=>{
    if(timerRefill!==r) return;
    cancelAnimationFrame(r.raf); clearTimeout(r.fb); timerRefill=null;
    timerPaint(1, toSecs);
    timerBeginCountdown(toSecs);
  };
  const step = (now)=>{
    if(timerRefill!==r) return;
    const p=_clamp01((now - r.t0)/dur);
    const e = p<.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;
    timerPaint(fromFrac + (1-fromFrac)*e, fromSecs + (toSecs-fromSecs)*e);
    if(p<1) r.raf=requestAnimationFrame(step); else finish();
  };
  r.raf=requestAnimationFrame(step);
  r.fb=setTimeout(finish, dur+150);
}

function timerCurFrac(){
  if(targetEndTime>0 && timerTotalSecs>0) return _clamp01((targetEndTime-Date.now())/1000/timerTotalSecs);
  return 0;
}
function timerRingGeom(){
  const wrap=document.querySelector('.timer-circle-wrap'), r=wrap.getBoundingClientRect();
  return {cx:r.left+r.width/2, cy:r.top+r.height/2, R:45*r.width/100};
}
function timerFingerFrac(x,y,g){
  let a=Math.atan2(x-g.cx, -(y-g.cy));
  if(a<0) a+=2*Math.PI;
  return a/(2*Math.PI);
}
function timerTryStartScrub(e){
  const box=_tbox();
  if(!box || box.style.display!=='flex' || box.classList.contains('exiting') ||
     box.classList.contains('docked-left') || box.classList.contains('docked-right')) return false;
  if(timerTotalSecs<=0) return false;
  const isTouch=!!e.touches;
  if(!isTouch && e.button!==0) return false;
  const pt=isTouch ? e.touches[0] : e;
  if(!pt) return false;
  const g=timerRingGeom();
  const f=timerRefill ? timerDispFrac : timerCurFrac();
  const kn=document.querySelector('.timer-knob');
  if(!kn) return false;
  const kr=kn.getBoundingClientRect();
  const kx=kr.left+kr.width/2, ky=kr.top+kr.height/2;
  if(Math.hypot(pt.clientX-kx, pt.clientY-ky) > TIMER_KNOB_HIT) return false;
  if(!isTouch && Date.now()-timerLastTouchEnd<700) return true;
  if(timerRefill || timerScrub) return false;
  const wasRunning=targetEndTime>0;
  let fv=timerFingerFrac(kx,ky,g);
  if(fv-f>.5) fv-=1; else if(f-fv>.5) fv+=1;
  fv=_clamp01(fv);
  const s=timerScrub={
    id: isTouch ? pt.identifier : 'mouse',
    wasRunning, origEnd: targetEndTime,
    frac0: f, target: f, disp: fv,
    lastRaw: timerFingerFrac(pt.clientX, pt.clientY, g),
    lastSecTick: Math.round(fv * timerTotalSecs),
    moved:false, ending:false, raf:0, lastT:performance.now(), endT:0
  };
  if(timerInterval){ cancelAnimationFrame(timerInterval); timerInterval=null; }
  targetEndTime=0;
  box.classList.remove('finished');
  box.classList.add('scrubbing');
  timerPaint(fv, f*timerTotalSecs);
  haptic(12);
  s.raf=requestAnimationFrame(timerScrubFrame);
  return true;
}
function timerScrubPt(e){
  const s=timerScrub;
  if(e.touches){
    if(s.id==='mouse') return null;
    for(const t of e.touches) if(t.identifier===s.id) return t;
    return null;
  }
  return s.id==='mouse' ? e : null;
}
function onTimerScrubMove(e){
  const s=timerScrub;
  if(!s || s.ending) return;
  const pt=timerScrubPt(e);
  if(!pt) return;
  if(e.cancelable) e.preventDefault();
  const g=timerRingGeom();
  if(Math.hypot(pt.clientX-g.cx, pt.clientY-g.cy) < 14) return;
  const raw=timerFingerFrac(pt.clientX, pt.clientY, g);
  let d=raw-s.lastRaw;
  if(d>.5) d-=1; else if(d<-.5) d+=1;
  s.lastRaw=raw;
  const minF=Math.min(1, 1/Math.max(1,timerTotalSecs));
  s.target=Math.max(minF, Math.min(1, s.target+d));
  if(Math.abs(s.target-s.frac0)>0.002) s.moved=true;
  
  const curSec = Math.round(s.target * timerTotalSecs);
  if(curSec !== s.lastSecTick) {
    s.lastSecTick = curSec;
    haptic(6);
  }
}
function timerScrubFrame(t){
  const s=timerScrub;
  if(!s) return;
  const dt=Math.max(0, Math.min(64, t-s.lastT)); s.lastT=t;
  s.disp += (s.target-s.disp)*(1-Math.exp(-dt/70));
  timerPaint(s.disp, s.disp*timerTotalSecs);
  if(s.ending && (Math.abs(s.target-s.disp)<0.0008 || t-s.endT>450)){ timerFinishScrub(); return; }
  s.raf=requestAnimationFrame(timerScrubFrame);
}
function onTimerScrubEnd(e){
  const s=timerScrub;
  if(!s || s.ending) return;
  if(e.changedTouches){
    let mine=false;
    for(const t of e.changedTouches) if(t.identifier===s.id) mine=true;
    if(!mine) return;
    timerLastTouchEnd=Date.now();
  } else if(s.id!=='mouse') return;
  s.ending=true; s.endT=performance.now();
  timerNoClickUntil=Date.now()+700;
  setTimeout(()=>{ if(timerScrub===s) timerFinishScrub(); }, 650);
}
function timerFinishScrub(){
  const s=timerScrub;
  if(!s) return;
  cancelAnimationFrame(s.raf);
  timerScrub=null;
  timerNoClickUntil=Date.now()+400;
  const box=_tbox(); if(box) box.classList.remove('scrubbing');
  const total=timerTotalSecs;
  if(!s.moved){
    if(s.wasRunning){
      timerPaint(s.frac0, s.frac0*total);
      targetEndTime=s.origEnd;
      timerInterval=requestAnimationFrame(timerFrameLoop);
    } else {
      timerPaint(0, 0);
    }
    return;
  }
  const secs=Math.max(1, Math.round(s.target*total));
  timerPaint(secs/total, secs);
  timerBeginCountdown(secs);
  haptic(10);
}

const _prSeen=new Set();
function checkPR(exId, weight, reps){
  const w = num(weight);
  const r = num(reps);
  if(w === null || w <= 0 || r === null || r < 0) return;
  const current1RM = w * (1 + r / 30);
  if(!Number.isFinite(current1RM) || current1RM <= 0) return;
  let bestPrev = 0;
  const rel = relatedIds(exId);
  Object.keys(S.logs || {}).forEach(d=>{
    if(d >= ui.date || !S.logs[d]) return;
    rel.forEach(rid=>{
      if(S.logs[d][rid]){
        const prevRM = est1RM(S.logs[d][rid]);
        if(prevRM > bestPrev) bestPrev = prevRM;
      }
    });
  });
  if(bestPrev > 0 && current1RM > bestPrev * 1.001){
    const key = ui.date+'|'+exId+'|'+Math.round(current1RM*10);
    if(_prSeen.has(key)) return;
    _prSeen.add(key);
    showPRModal(w, r, Math.round(current1RM));
  }
}

function dateForDayIdx(idx, refDate){
  const d = new Date(safeDate(refDate) + 'T00:00');
  const dow = d.getDay();
  d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
  for(let i=0; i<7; i++){
    const ds = iso(d);
    if(dayIdx(ds) === idx) return ds;
    d.setDate(d.getDate() + 1);
  }
  return null;
}

function tabsTargetLeft(el){
  const btn=el.querySelector('button.on');
  if(!btn) return null;
  const er=el.getBoundingClientRect(), br=btn.getBoundingClientRect();
  const t=el.scrollLeft+(br.left-er.left)-(el.clientWidth-br.width)/2;
  return Math.max(0,Math.min(t,el.scrollWidth-el.clientWidth));
}
function animateTabsScroll(el,to,dur=300){
  if(!el||to===null) return;
  if(el._tabRaf) cancelAnimationFrame(el._tabRaf);
  const from=el.scrollLeft, delta=to-from;
  if(Math.abs(delta)<1){ el.scrollLeft=to; return; }
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){ el.scrollLeft=to; return; }
  const t0=performance.now();
  const ease=x=>1-Math.pow(1-x,4);
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur);
    el.scrollLeft=from+delta*ease(p);
    if(p<1) el._tabRaf=requestAnimationFrame(step); else el._tabRaf=null;
  };
  el._tabRaf=requestAnimationFrame(step);
}

function animateValue(el, start, end, duration, prefix='', suffix='') {
  if(!el) return;
  if (start === end) { el.textContent = prefix + end + suffix; return; }
  const range = end - start;
  let current = start;
  const increment = end > start ? 1 : -1;
  const stepTime = Math.abs(Math.floor(duration / (range || 1)));
  const startTime = performance.now();
  
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(1, elapsed / duration);
    const easeOut = 1 - Math.pow(1 - progress, 3);
    const val = Math.floor(start + range * easeOut);
    el.textContent = prefix + val + suffix;
    if (progress < 1) requestAnimationFrame(update);
    else el.textContent = prefix + end + suffix;
  }
  requestAnimationFrame(update);
}

function triggerCounterAnimations(){
  document.querySelectorAll('[data-counter]').forEach(el => {
    const end = parseInt(el.getAttribute('data-counter'), 10);
    const prefix = el.getAttribute('data-prefix') || '';
    const suffix = el.getAttribute('data-suffix') || '';
    if (!isNaN(end)) animateValue(el, 0, end, 600, prefix, suffix);
  });
}

    if(!navEl.classList.contains('ready')) requestAnimationFrame(()=>requestAnimationFrame(()=>navEl.classList.add('ready')));
  }

  applyTheme();
  warn();
  const app=document.getElementById('app');
  const oldTabs=(wasLogTab&&isLogTab)?app.querySelector('.tabs'):null;
  const oldTabsLeft=oldTabs?oldTabs.scrollLeft:null;
  app.innerHTML=t==='weight'?vWeight(weightChartAnimation):{home:vHome,today:vLog,log:vLog,cal:vCal,prog:vProg,set:vSet}[t]();
  updateCustomSplitEditorModal();
  if(t==='weight'){
    initWeightDial();
    if(weightChartAnimation) animateWeightChartPoint();
  }
  if(isLogTab){
    const tabsEl=app.querySelector('.tabs');
    if(tabsEl){
      if(oldTabsLeft!==null){
        tabsEl.scrollLeft=oldTabsLeft;
        animateTabsScroll(tabsEl,tabsTargetLeft(tabsEl),300);
      } else {
        const tl=tabsTargetLeft(tabsEl);
        if(tl!==null) tabsEl.scrollLeft=tl;
      }
    }
  }

  app.classList.remove('tab-enter-left','tab-enter-right','day-enter-older','day-enter-newer');
  
  if(!skipAnim){
    if(slideDirection){
      void app.offsetWidth;
      app.classList.add(slideDirection==='older'?'day-enter-older':'day-enter-newer');
    } else if(tabChanged){
      void app.offsetWidth;
      app.classList.add(tabDirection === 'right' ? 'tab-enter-right' : 'tab-enter-left');
    }
  }

  if (t === 'home') triggerCounterAnimations();
}

function addDays(ds,n){ const d=new Date(ds+'T00:00'); d.setDate(d.getDate()+n); return iso(d); }
function mondayOf(ds){ const d=new Date(ds+'T00:00'), w=d.getDay(); d.setDate(d.getDate()-(w===0?6:w-1)); return iso(d); }
function dayHasWork(ds){ const L=S.logs[ds]; return !!L && Object.values(L).some(hasExerciseHistory); }
function isRoutineRestDay(ds){
  if(!isValidISODate(ds)) return false;
  const idx=dayIdx(ds);
  if(idx<0) return true;
  const day=getPlanForDate(ds)[idx];
  return !day || !Array.isArray(day.ex) || day.ex.length===0;
}
function hasTrainingContext(ds){
  if(!isValidISODate(ds)) return false;
  const mon=mondayOf(ds);
  for(let i=0;i<7;i++){
    const d=addDays(mon,i);
    if(d!==ds && dayHasWork(d)) return true;
  }
  for(let i=1;i<=3;i++){
    if(dayHasWork(addDays(ds,-i)) || dayHasWork(addDays(ds,i))) return true;
  }
  return false;
}
function isPlannedRestShown(ds){
  return !dayHasWork(ds) && isRoutineRestDay(ds) && hasTrainingContext(ds);
}
function dayVolume(ds){
  const L=S.logs[ds]; let v=0;
  if(L) Object.values(L).forEach(r=>(r&&r.sets||[]).forEach(st=>{ v+=(num(st&&st.w)||0)*(num(st&&st.r)||0); }));
  return v;
}
function relDays(ds,today){
  const n=Math.round((new Date(today+'T00:00')-new Date(ds+'T00:00'))/864e5);
  return n<=0?'today':n===1?'yesterday':n+'d ago';
}
const kfmt=v=>v>=1000?(v/1000).toFixed(1).replace(/\.0$/,'')+'k':String(Math.round(v));
function splitDayName(n){ const p=String(n).split(' - '); return p.length>1?{day:p[0],title:p.slice(1).join(' - ')}:{day:'',title:String(n)}; }

function exerciseSessions(){
  if(_derived.sessions) return _derived.sessions;
  const names={};
  Object.values(S.routines||{}).forEach(pl=>(pl||[]).forEach(d=>{
    (d.ex||[]).forEach(e=>{ names[e.id]=e.name; });
    (Array.isArray(d.pplTemplateHistory)?d.pplTemplateHistory:[]).forEach(snapshot=>{
      (Array.isArray(snapshot&&snapshot.ex)?snapshot.ex:[]).forEach(e=>{if(e&&typeof e.id==='string'&&!(e.id in names)) names[e.id]=e.name;});
    });
  }));
  Object.entries(S.archivedExercises||{}).forEach(([i,e])=>{ if(!(i in names)) names[i]=e&&e.name; });
  const out={};
  Object.keys(S.logs||{}).filter(isValidISODate).sort().forEach(date=>{
    const L=S.logs[date]||{};
    Object.keys(L).forEach(id=>{
      const rec=L[id];
      if(!names[id]||!filled(rec)) return;
      let best=null;
      (rec.sets||[]).forEach(st=>{
        const w=num(st&&st.w), r=num(st&&st.r);
        if(w!==null&&w>=0&&r!==null&&r>=0){ const rm=w*(1+r/30); if(!best||rm>best.rm) best={rm,w,r}; }
      });
      if(!best) return;
      const x=out[normName(names[id])]||(out[normName(names[id])]={name:names[id],list:[]});
      const last=x.list[x.list.length-1];
      if(last&&last.date===date){ if(best.rm>last.rm) x.list[x.list.length-1]={date,...best}; }
      else x.list.push({date,...best});
    });
  });
  _derived.sessions=out;
  return out;
}
function recentPRs(sessions,n){
  const ev=[];
  Object.values(sessions).forEach(x=>{
    let best=0;
    x.list.forEach(st=>{ if(best>0&&st.rm>best*1.001) ev.push({name:x.name,...st}); if(st.rm>best) best=st.rm; });
  });
  return ev.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.rm-a.rm).slice(0,n);
}
function topMovers(sessions,today,n){
  const from=addDays(today,-28), out=[];
  Object.values(sessions).forEach(x=>{
    const l=x.list.filter(st=>st.date>=from&&st.date<=today);
    if(l.length>=2) out.push({name:x.name,gain:l[l.length-1].rm-l[0].rm,pts:l.map(st=>st.rm)});
  });
  return out.filter(m=>m.gain>0.05).sort((a,b)=>b.gain-a.gain).slice(0,n);
}
function sparkSvg(pts){
  const W=64,H=22,mn=Math.min(...pts),mx=Math.max(...pts),sp=(mx-mn)||1;
  const P=pts.map((v,i)=>(2+i*(W-4)/(pts.length-1)).toFixed(1)+','+(H-3-(v-mn)*(H-6)/sp).toFixed(1));
  const e=P[P.length-1].split(',');
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${P.join(' ')}" fill="none" style="stroke:var(--up)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${e[0]}" cy="${e[1]}" r="2.6" style="fill:var(--up)"/></svg>`;
}

function getLastFullBackupDate(){
  try{const value=safeStorageGet(LAST_BACKUP_KEY);return isValidISODate(value)?value:null;}catch(_){return null;}
}
function markFullBackupDate(){
  const date=iso(new Date());
  try{localStorage.setItem(LAST_BACKUP_KEY,date);}catch(_){return false;}
  const status=document.getElementById('backup-reminder-status');
  if(status) status.textContent='Last backup export: '+fmt(date);
  return true;
}

function vHome(){
  const today=iso(new Date()), plan=getPlanForDate(today), idx=dayIdx(today), d=idx>=0?plan[idx]:null;
  const streak=calcStreak(), mon=mondayOf(today);
  let i=0; const step=()=>` style="--i:${i++}"`;

  let backupReminder='';
  if(T.backupReminder){
    const lastBackup=getLastFullBackupDate();
    const lastDate=lastBackup?new Date(lastBackup+'T00:00:00'):null;
    const todayDate=new Date(today+'T00:00:00');
    const daysSince=lastDate?Math.max(0,Math.floor((todayDate-lastDate)/864e5)):null;
    if(daysSince===null||daysSince>=T.backupReminderDays){
      backupReminder=`<div class="warn"${step()} style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span>${daysSince===null?'Make your first backup export to protect your workout history.':'It’s been '+daysSince+' days since your last backup export.'}</span><button class="btn small" data-act="go" data-v="set">Back up</button></div>`;
    }

    let done=0;

      done+=Math.min(n,visibleSetCount(e,r,today));
    });
    const pct=total?done/total:0, C=2*Math.PI*29, nm=splitDayName(d.name);

    card=`<div class="card today-card"${step()}>

        <div class="ring"><svg viewBox="0 0 68 68"><circle class="bg" cx="34" cy="34" r="29"/><circle class="fg" cx="34" cy="34" r="29" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}"/></svg><span>${Math.round(pct*100)}%</span></div>
      </div>
      <button class="cta" data-act="starttoday"${done>0&&done<total?' data-resume-incomplete="true"':''}>${label}</button>
    </div>`;
  } else {
    let next=null;
    for(let k=1;k<=7&&!next;k++){ const ds=addDays(today,k), ix=dayIdx(ds), nextPlan=getPlanForDate(ds); if(ix>=0&&nextPlan[ix].ex.length) next={ds,nm:splitDayName(nextPlan[ix].name)}; }
    card=`<div class="card today-card"${step()}>
      <div class="tc-row"><div class="tc-main"><div class="tc-lab">TODAY</div>
        <div class="tc-name">Rest day</div>
        <div class="tc-sub">${next?'Next: '+esc(fmt(next.ds))+' · '+esc(next.nm.title):'No workouts scheduled'}</div></div>
        <div class="ring" style="display:flex;align-items:center;justify-content:center"><svg class="svg-icon" style="width:32px;height:32px;color:var(--mute)" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></div></div>
      <button class="cta" data-act="starttoday" style="background:var(--accbg);color:var(--acc)">Open today’s log</button>
    </div>`;
  }

  const LET=['M','T','W','T','F','S','S'];
  let wk='', doneW=0, planW=0, elapsed=0;
  const firstLog=Object.keys(S.logs).filter(dayHasWork).sort()[0];
  for(let k=0;k<7;k++){
    const ds=addDays(mon,k), ix=dayIdx(ds), dayPlan=getPlanForDate(ds), planned=ix>=0&&dayPlan[ix].ex.length>0, did=dayHasWork(ds);
    if(planned) planW++;

  else { vBig=kfmt(tv); vSub='kg this week'; }

  const start=addDays(mon,-77); let hm='', maxV=0, cnt=0; const cells=[];

  cells.forEach(c=>{

  const mv=topMovers(sessions,today,3);
  const mvHtml=mv.length?mv.map(m=>`<div class="mv-row"><div><b>${esc(m.name)}</b><small>est. 1RM, last 4 weeks</small></div>${sparkSvg(m.pts)}<div class="g">+${m.gain.toFixed(1)} kg</div></div>`).join(''):'<div class="meta" style="padding:6px 0">Log an exercise in 2+ sessions over four weeks to see your top movers.</div>';

    <div class="card"${step()}><h3><span>Activity</span><small>${cnt} workouts · 12 weeks</small></h3><div class="heat">${hm}</div>${heatLegend}</div>
    <div class="card"${step()}><h3><span>Top Movers</span></h3><div style="margin-top:6px">${mvHtml}</div></div>
  </div>`;
}

function renderStockChart(data, type){
  if(data.length<2) return `<div class="empty"><svg class="svg-icon" style="width:48px;height:48px;color:var(--mute);margin-bottom:12px" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg><div>Log workouts over 2 different weeks to generate your overall progress trend graph!</div></div>`;

  const W=600, H=220, p=36;
  const values=data.map(d=>d.val);
  let mn=Math.min(...values), mx=Math.max(...values);
  if(mn===mx){ mn=Math.max(0, mn-5); mx+=5; }
  if(type==='bar'){ mn=Math.max(0, Math.floor(mn-(mx-mn)*0.4)); }

  const first = values[0], last = values[values.length-1];
  const isUp = last >= first;
  const color = isUp ? 'var(--up)' : 'var(--down)';

  const X=i=>p+i*(W-p-16)/(data.length-1);
  const Y=v=>H-28-(v-mn)*(H-50)/(mx-mn);
  
  const ptsData = data.map((d,i) => ({x: X(i), y: Y(d.val), v: d.val, l: fmt(d.week)}));

  let chartContent='';

  if(type==='bar'){
    const barWidth = Math.max(12, Math.min(36, (W-p)/data.length - 8));
    chartContent = data.map((d,i)=>{
      const x = X(i) - barWidth/2;
      const y = Y(d.val);
      const h = (H-28) - y;
      const prevVal = i>0 ? data[i-1].val : d.val;
      const barColor = d.val >= prevVal ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${barWidth}" height="${h}" rx="4" fill="${barColor}" opacity="0.85"><title>Week ${fmt(d.week)}: ${d.val}</title></rect>`;
    }).join('');
  } else {
    const points = data.map((d,i)=>X(i)+','+Y(d.val)).join(' ');
    const areaPoints = `${X(0)},${H-28} ${points} ${X(data.length-1)},${H-28}`;
    
    chartContent = `
      <defs>
        <linearGradient id="stockGradUp" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--up)" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="var(--up)" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="stockGradDown" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--down)" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="var(--down)" stop-opacity="0.0"/>
        </linearGradient>
      </defs>
      <polygon points="${areaPoints}" fill="url(${isUp ? '#stockGradUp' : '#stockGradDown'})" />
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      ${data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.val)}" r="4.5" fill="${color}"><title>Week ${fmt(d.week)}:${d.val}</title></circle>`).join('')}
    `;
  }

  const diff = last - first;
  const pct = first>0 ? Math.round((diff/first)*100) : 0;
  const ptsString = JSON.stringify(ptsData).replace(/'/g, "&apos;");

  return `
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;margin-bottom:8px">
      <div>
        <span style="font-size:24px;font-weight:bold;color:${color}">${last}</span>
        <span style="font-size:13px;margin-left:6px;color:${color}">${diff>=0?'+':''}${diff} (${pct>=0?'+':''}${pct}%)</span>
      </div>
      <span style="font-size:12px;color:var(--mute)">vs First Logged Week</span>
    </div>
    <div style="position:relative; touch-action:pan-y;">
      <svg viewBox="0 0 ${W} ${H}" role="img" data-pts='${ptsString}' style="touch-action: pan-y; cursor: crosshair;" data-is-vol="${ui.homeMetric === 'vol' ? 'true' : 'false'}">
        <line x1="${p}" y1="${Y(mn)}" x2="${W-12}" y2="${Y(mn)}" style="stroke:var(--line)"/>
        <line x1="${p}" y1="${Y(mx)}" x2="${W-12}" y2="${Y(mx)}" style="stroke:var(--line)"/>
        <text x="4" y="${Y(mx)+4}" font-size="11" style="fill:var(--mute)">${mx}</text>
        <text x="4" y="${Y(mn)+4}" font-size="11" style="fill:var(--mute)">${mn}</text>
        ${chartContent}
        <text x="${p}" y="${H-6}" font-size="11" style="fill:var(--mute)">${fmt(data[0].week)}</text>
        <text x="${W-12}" y="${H-6}" font-size="11" text-anchor="end" style="fill:var(--mute)">${fmt(data[data.length-1].week)}</text>
      </svg>
    </div>
  `;
}

function setExerciseCollapsed(card, collapsed){
  if(!card) return;

    return sum+Math.min(count,visibleSetCount(ex,rec,dateStr));

}

function suggestedRestSeconds(ex){
  if(!T.restSuggestions||!ex) return null;
  const name=String(ex.name||'').toLowerCase();
  const compound=/\b(squat|deadlift|press|row|pulldown|pull-up|chin-up|hip thrust|leg press)\b/.test(name);
  return compound?180:120;
}
function exerciseRecommendation(ex, beforeDate){
  if(!ex || !isValidISODate(beforeDate)) return null;
  const bounds=String(ex.range||'').trim().match(/^(\d+(?:\.\d+)?)(?:\s*(?:-|to)\s*(\d+(?:\.\d+)?))?$/i);
  if(!bounds) return null;
  const low=Number(bounds[1]), high=Number(bounds[2]||bounds[1]);
  if(!Number.isFinite(low)||!Number.isFinite(high)||low<=0||high<low) return null;
  const planned=Math.max(1,Math.round(Number(ex.sets)||1));
  const ids=relatedIds(ex.id), dates=Object.keys(S.logs||{}).filter(d=>isValidISODate(d)&&d<beforeDate).sort().reverse();
  const sessions=[];
  for(const date of dates){
    const records=ids.map(id=>S.logs[date]&&S.logs[date][id]).filter(r=>r&&Array.isArray(r.sets));
    if(!records.length) continue;
    const rec=records.sort((a,b)=>topW(b)-topW(a))[0];
    const sets=rec.sets.map(st=>({w:num(st&&st.w),r:num(st&&st.r)})).filter(st=>st.w!==null&&st.w>0&&st.r!==null&&st.r>=0);
    if(sets.length) sessions.push({date,sets});
    if(sessions.length>=4) break;
  }
  if(!sessions.length) return null;
  let kind='', text='', suggestedKg=null;
  const unit=unitForExercise(ex.id);
  const plannedSets=sessions[0].sets.slice(0,planned);
  if(plannedSets.length>=planned&&plannedSets.every(st=>st.r>=high)){
    const avg=plannedSets.reduce((sum,st)=>sum+st.w,0)/plannedSets.length;
    const step=avg>=100?2.5:avg>=40?1.25:0.5;
    kind='increase';
    suggestedKg=Math.round((avg+step)*2)/2;
    text='You reached '+high+' reps on all '+planned+' planned sets last time. Try about '+formatExerciseWeight(ex.id,suggestedKg)+' '+unit+' next session and aim for '+low+'-'+high+' reps.';
  }
  const underTarget=session=>{const sets=session.sets.slice(0,planned);return sets.length>=planned&&sets.filter(st=>st.r<low-2).length>=Math.ceil(planned/2);};
  if(!text&&sessions.length>=2&&underTarget(sessions[0])&&underTarget(sessions[1])){
    const weights=sessions.slice(0,2).flatMap(session=>session.sets.slice(0,planned).map(st=>st.w));
    const avg=weights.reduce((sum,w)=>sum+w,0)/weights.length;
    kind='reduce';
    suggestedKg=Math.max(0.5,Math.round((avg*0.95)*2)/2);
    text='Reps were more than 2 below your '+low+'-rep target on most sets in your last 2 sessions. Consider reducing to about '+formatExerciseWeight(ex.id,suggestedKg)+' '+unit+' and build back toward '+low+'-'+high+' reps.';
  }
  if(!text&&sessions.length>=3&&sessions.slice(0,3).every(session=>session.sets.length>planned)){
    kind='sets';
    text='You completed more than '+planned+' sets in each of your last 3 sessions. Consider updating the routine to '+Math.min(20,Math.max(...sessions.slice(0,3).map(session=>session.sets.length)))+' planned sets if that extra volume is intentional.';
  }
  let plateau='';
  if(sessions.length>=4){
    const est=session=>Math.max(...session.sets.map(st=>st.w*(1+st.r/30)));
    const values=sessions.slice(0,4).map(est), baseline=values[values.length-1], min=Math.min(...values), max=Math.max(...values);
    if(baseline>0&&min>=baseline*0.995&&max<=baseline*1.005) plateau='Your estimated strength has been roughly unchanged across 4 sessions. Consider checking recovery, technique, or whether the current load is still appropriate.';
  }
  if(!text&&!plateau) return null;
  return {kind:kind||'plateau',text,plateau,suggestedKg,unit};
}

function readVersionHistory(){
  const walker=document.createTreeWalker(document,NodeFilter.SHOW_COMMENT);let comment='';
  while(walker.nextNode()){const value=walker.currentNode.nodeValue||'';if(value.includes('LIFT LOG — VERSION CONTROL')){comment=value;break;}}
  const entries=[],re=/Version\s+(\d+\.\d+\.\d+)\s+change log:\s*([\s\S]*?)(?=\n\s*(?:Version\s+\d+\.\d+\.\d+\s+change log:|Versioning rule:)|$)/g;
  let match;while((match=re.exec(comment))){const version=match[1],parts=version.split('.').map(Number);if(parts[0]!==1||parts[1]<6)continue;const changes=match[2].split(/\r?\n/).map(line=>line.trim()).filter(line=>line.startsWith('- ')).map(line=>line.slice(2));entries.push({version,changes});}
  return entries;
}

    h+=`<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
      <div><b>${esc(e.name)}</b><div class="meta" style="margin:2px 0 0">Exercise progress</div></div>
      <button class="btn small acc" data-act="progress-back">${esc(returnLabel)}</button>
    </div>`;
  }

  const seenNames=new Set(), selName=normName(e.name);
  const optHtml=x=>{const k=normName(x.name); if(seenNames.has(k)) return ''; seenNames.add(k); return `<option value="${esc(x.id)}"${k===selName?' selected':''}>${esc(x.name)}</option>`;};
  let selHtml='<select id="psel" style="width:100%;margin-bottom:10px">';
  getPlan().forEach(d=>{const o=d.ex.map(optHtml).join(''); if(o) selHtml+=`<optgroup label="${esc(d.name)}">${o}</optgroup>`;});
  const archOpts=all.filter(x=>x.day==='Archived exercise').map(optHtml).join('');
  if(archOpts) selHtml+=`<optgroup label="Archived exercises">${archOpts}</optgroup>`;
  h+=selHtml+'</select>';
  
  const rel=relatedIds(e.id);
  const recAt=d=>{let best=null; rel.forEach(r=>{const x=S.logs[d]&&S.logs[d][r]; if(x&&filled(x)&&(!best||topW(x)>topW(best))) best=x;}); return best;};
  const ds=Object.keys(S.logs).filter(d=>recAt(d)).sort();
  if(!ds.length)return h+`<div class="empty"><svg class="svg-icon" style="width:48px;height:48px;color:var(--mute);margin-bottom:12px" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg><div>No sessions logged for this exercise yet.</div><br><button class="btn acc" data-act="go" data-v="today">Go to Today's Workout</button></div>`;
  
  const unit=unitForExercise(e.id);
  const tops=ds.map(d=>topW(recAt(d)));
  const topsDisplay=tops.map(value=>weightFromKg(e.id,value));
  const cur=tops[tops.length-1],pr=Math.max(...tops),diff=cur-tops[0];
  const sessCapped=!ui.progShowAll && ds.length>PERF.sessionCap;
  const dsChart=sessCapped?ds.slice(-PERF.sessionCap):ds;
  const topsChart=sessCapped?topsDisplay.slice(-PERF.sessionCap):topsDisplay;
  let sessNote='';
  if(sessCapped){
    sessNote=`<div class="meta" style="margin:6px 0">Chart: last ${PERF.sessionCap} of ${ds.length} sessions. <button class="btn small" data-act="progshow" data-v="sess">Show all</button></div>`;
  } else if(ui.progShowAll && ds.length>PERF.sessionCap){
    sessNote=`<div class="meta" style="margin:6px 0">Chart: all ${ds.length} sessions. <button class="btn small" data-act="progshow" data-v="sess-less">Show recent</button></div>`;
  }
  
  h+=`<div class="card">
    <h3>
      <span>${esc(e.name)}</span>
      <div class="chart-toggle-group">
        <button class="${(ui.progGraphType||'line')==='line'?'on':''}" data-act="setproggtype" data-v="line">Line</button>
        <button class="${(ui.progGraphType||'line')==='bar'?'on':''}" data-act="setproggtype" data-v="bar">Bar</button>
      </div>
    </h3>
    <div class="meta">${esc(e.day)}, ${esc(e.range)} reps</div>
    <div class="stats">
      <div class="stat"><b>${formatExerciseWeight(e.id,cur)} ${unit}</b><span>Latest</span></div>
      <div class="stat"><b>${formatExerciseWeight(e.id,pr)} ${unit}</b><span>Best</span></div>
      <div class="stat"><b>${diff>0?'+':''}${formatExerciseWeight(e.id,diff)} ${unit}</b><span>Change</span></div>
    </div>
    ${sessNote}
    <div id="prog-ex-chart">${chart(dsChart,topsChart,ui.progGraphType||'line',unit)}</div>
  </div>`;

  const rev=ds.slice().reverse();
  const tableCapped=!ui.progTableAll && rev.length>PERF.tablePage;
  const tableRows=tableCapped?rev.slice(0,PERF.tablePage):rev;
  let tableNote='';
  if(tableCapped){
    tableNote=`<div class="meta" style="margin-bottom:8px">Latest ${PERF.tablePage} of ${rev.length} sessions. <button class="btn small" data-act="progshow" data-v="table">Show older</button></div>`;
  } else if(ui.progTableAll && rev.length>PERF.tablePage){
    tableNote=`<div class="meta" style="margin-bottom:8px">All ${rev.length} sessions. <button class="btn small" data-act="progshow" data-v="table-less">Show latest only</button></div>`;
  }
  h+='<div class="card wrap">'+tableNote+'<table><tr><th>Date</th><th>Sets ('+unit+' x reps)</th><th>Top</th></tr>'+tableRows.map(d=>{const r=recAt(d);return`<tr><td>${fmt(d)}</td><td>${esc(setsTxtForExercise(e.id,r))}${r.note?'<br><span class="meta">'+esc(r.note)+'</span>':''}</td><td>${formatExerciseWeight(e.id,topW(r))} ${unit}</td></tr>`}).join('')+'</table></div>';
  return h;
}

function chart(ds,v,type,unit='kg'){
  const W=600,H=200,p=34;
  if(v.length<2)return'<div class="meta">Log at least two sessions to see the trend line.</div>';
  let mn=Math.min(...v),mx=Math.max(...v);if(mn===mx){mn-=1;mx+=1}
  if(type==='bar'){ mn=Math.max(0, Math.floor(mn-(mx-mn)*0.4)); }
  const X=i=>p+i*(W-p-12)/(v.length-1),Y=x=>H-24-(x-mn)*(H-44)/(mx-mn);
  
  const ptsData = ds.map((d,i) => ({x: X(i), y: Y(v[i]), v: v[i], l: fmt(d)}));

  let mainContent='';
  if(type==='bar'){
    const bw=Math.max(10, Math.min(32, (W-p)/v.length - 6));
    mainContent=v.map((x,i)=>`<rect x="${X(i)-bw/2}" y="${Y(x)}" width="${bw}" height="${(H-24)-Y(x)}" rx="3" fill="var(--acc)" opacity="0.85"><title>${fmt(ds[i])}: ${x} ${unit}</title></rect>`).join('');
  } else {
    const pts=v.map((x,i)=>X(i)+','+Y(x)).join(' ');
    mainContent=`<polyline points="${pts}" fill="none" style="stroke:var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="4" style="fill:var(--acc)"><title>${fmt(ds[i])}: ${x} ${unit}</title></circle>`).join('')}`;
  }

  const ptsString = JSON.stringify(ptsData).replace(/'/g, "&apos;");
  const L='style="stroke:var(--line)"',M='style="fill:var(--mute)"';
  return`
  <div style="position:relative; touch-action:pan-y;">
    <svg viewBox="0 0 ${W} ${H}" role="img" data-pts='${ptsString}' style="touch-action: pan-y; cursor: crosshair;">
      <line x1="${p}" y1="${Y(mn)}" x2="${W-12}" y2="${Y(mn)}" ${L}/>
      <line x1="${p}" y1="${Y(mx)}" x2="${W-12}" y2="${Y(mx)}" ${L}/>
      <text x="4" y="${Y(mx)+4}" font-size="12" ${M}>${mx}</text>
      <text x="4" y="${Y(mn)+4}" font-size="12" ${M}>${mn}</text>
      ${mainContent}
      <text x="${p}" y="${H-6}" font-size="12" ${M}>${fmt(ds[0])}</text>
      <text x="${W-12}" y="${H-6}" font-size="12" text-anchor="end" ${M}>${fmt(ds[ds.length-1])}</text>
    </svg>
  </div>`;
}

function renderWeightChart(entries, animation=null){
  if(!entries.length) return '<div class="empty">Add your first weigh-in to start your chart.</div>';
  const W=600,H=220,p=42;
  const values=entries.map(entry=>bodyWeightFromKg(entry.kg));
  let mn=Math.min(...values),mx=Math.max(...values);
  const animationIndex=animation&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)
    ?entries.findIndex(entry=>entry.date===animation.date):-1;
  const previousDisplay=animationIndex>=0&&Number.isFinite(animation.previousKg)
    ?bodyWeightFromKg(animation.previousKg):null;
  if(previousDisplay!==null){mn=Math.min(mn,previousDisplay);mx=Math.max(mx,previousDisplay);}
  if(mn===mx){const pad=Math.max(0.5,mn*0.01);mn=Math.max(0,mn-pad);mx+=pad;}
  else{const pad=(mx-mn)*0.18;mn=Math.max(0,mn-pad);mx+=pad;}
  const first=entries[0].kg,last=entries[entries.length-1].kg;
  const color=last<first?'var(--up)':last>first?'var(--down)':'var(--mute)';
  const X=i=>entries.length===1?(W+p-12)/2:p+i*(W-p-12)/(entries.length-1);
  const Y=value=>H-30-(value-mn)*(H-54)/(mx-mn);
  const baseline=H-30;
  const startY=animationIndex<0?null:previousDisplay===null?baseline:Y(previousDisplay);
  const chartPoints=entries.map((entry,i)=>[X(i),Y(values[i])]);
  const initialPoints=chartPoints.map(([x,y],i)=>x+','+(i===animationIndex?startY:y)).join(' ');
  const animatedAreaPoints=`${X(0)},${baseline} ${initialPoints} ${X(entries.length-1)},${baseline}`;
  const gradient=entries.length>1?`<defs><linearGradient id="weightTrendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="${animatedAreaPoints}" fill="url(#weightTrendFill)"/>`:'';
  return `<div style="position:relative;touch-action:pan-y">
    <svg data-weight-chart data-weight-baseline="${baseline}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight trend chart" style="width:100%;touch-action:pan-y">
      <line x1="${p}" y1="${Y(mn)}" x2="${W-12}" y2="${Y(mn)}" style="stroke:var(--line)"/>
      <line x1="${p}" y1="${Y(mx)}" x2="${W-12}" y2="${Y(mx)}" style="stroke:var(--line)"/>
      <text x="4" y="${Y(mx)+4}" font-size="11" style="fill:var(--mute)">${mx.toFixed(1)}</text>
      <text x="4" y="${Y(mn)+4}" font-size="11" style="fill:var(--mute)">${mn.toFixed(1)}</text>
      ${gradient}
      ${entries.length>1?`<polyline data-weight-line points="${initialPoints}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`:''}
      ${entries.map((entry,i)=>`<circle data-weight-point="${i}" data-final-y="${Y(values[i])}"${i===animationIndex?` data-start-y="${startY}" data-new-point="${previousDisplay===null?'true':'false'}"`:''} cx="${X(i)}" cy="${i===animationIndex?startY:Y(values[i])}" r="${i===animationIndex&&previousDisplay===null?'2.5':'4.5'}" fill="${color}"${i===animationIndex&&previousDisplay===null?' opacity="0.2"':''}><title>${fmt(entry.date)}: ${values[i].toFixed(1)} ${S.weightUnit}</title></circle>`).join('')}
      <text x="${p}" y="${H-6}" font-size="11" style="fill:var(--mute)">${esc(fmt(entries[0].date))}</text>
      <text x="${W-12}" y="${H-6}" font-size="11" text-anchor="end" style="fill:var(--mute)">${esc(fmt(entries[entries.length-1].date))}</text>
    </svg>
  </div>${entries.length===1?'<div class="meta">Add another weigh-in on a different date to see your trend.</div>':''}`;
}

function animateWeightChartPoint(){
  const svg=document.querySelector('#app [data-weight-chart]');
  if(!svg||window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const point=svg.querySelector('[data-start-y]');
  if(!point) return;
  const points=[...svg.querySelectorAll('[data-weight-point]')].map(el=>({
    x:Number(el.getAttribute('cx')),
    y:Number(el.getAttribute('data-final-y'))
  }));
  const index=Number(point.getAttribute('data-weight-point'));
  const startY=Number(point.getAttribute('data-start-y'));
  const targetY=points[index]&&points[index].y;
  if(!Number.isInteger(index)||!Number.isFinite(startY)||!Number.isFinite(targetY)) return;
  const line=svg.querySelector('[data-weight-line]');
  const area=svg.querySelector('polygon');
  const baseline=Number(svg.getAttribute('data-weight-baseline'));
  const isNew=point.getAttribute('data-new-point')==='true';
  let startTime=null;
  const duration=420;
  const frame=now=>{
    if(!svg.isConnected) return;
    if(startTime===null) startTime=now;
    const progress=Math.min(1,(now-startTime)/duration);
    const eased=1-Math.pow(1-progress,3);
    const y=startY+(targetY-startY)*eased;
    point.setAttribute('cy',String(y));
    if(isNew){
      point.setAttribute('r',String(2.5+2*eased));
      point.setAttribute('opacity',String(0.2+0.8*eased));
    }
    const currentPoints=points.map((item,i)=>item.x+','+(i===index?y:item.y)).join(' ');
    if(line) line.setAttribute('points',currentPoints);
    if(area) area.setAttribute('points',points.length>1?`${points[0].x},${baseline} ${currentPoints} ${points[points.length-1].x},${baseline}`:'');
    if(progress<1) requestAnimationFrame(frame);
    else{
      point.setAttribute('cy',String(targetY));
      if(line) line.setAttribute('points',points.map(item=>item.x+','+item.y).join(' '));
      if(area&&points.length>1) area.setAttribute('points',`${points[0].x},${baseline} ${points.map(item=>item.x+','+item.y).join(' ')} ${points[points.length-1].x},${baseline}`);
    }
  };
  requestAnimationFrame(frame);
}

function initWeightDial(){
  const dial=document.getElementById('weight-dial');
  const valueDisplay=document.getElementById('weight-value-display');
  const valueInput=document.getElementById('weight-value');
  const unitDisplay=document.getElementById('weight-dial-unit');
  const arc=document.getElementById('weight-dial-arc');
  const dots=document.getElementById('weight-dial-dots');
  if(!dial||!valueDisplay||!valueInput||!unitDisplay||!arc||!dots) return;
  const dotCount=36;
  let dragging=false,previousAngle=null,angleRemainder=0,valueBeforeEdit=valueInput.value;
  dots.replaceChildren();
  for(let i=0;i<dotCount;i++){
    const angle=(135+i*270/(dotCount-1))*Math.PI/180;
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',String(150+Math.cos(angle)*118));
    dot.setAttribute('cy',String(150+Math.sin(angle)*118));
    dot.setAttribute('r',i%5===0?'2.2':'1.4');
    dot.setAttribute('class','weight-dial-dot');
    dots.appendChild(dot);
  }
  const fromDisplay=value=>S.weightUnit==='lbs'?value/LB_PER_KG:value;
  const toDisplay=kg=>S.weightUnit==='lbs'?kg*LB_PER_KG:kg;
  const setDraftKg=kg=>{
    const maxDraftKg=S.weightUnit==='lbs'?1000/LB_PER_KG:1000;
    const bounded=Math.min(maxDraftKg,Math.max(0.1,kg));
    valueInput.value=(Math.round(toDisplay(bounded)*10)/10).toFixed(1);
    updateWeightDialDisplay();
  };
  const angleAt=event=>{
    const rect=dial.getBoundingClientRect();
    const x=event.clientX-(rect.left+rect.width/2);
    const y=event.clientY-(rect.top+rect.height/2);
    let angle=Math.atan2(y,x)*180/Math.PI;
    if(angle< -135) angle+=360;
    return angle;
  };
  const finishTyping=()=>{
    if(valueInput.hidden) return;
    const entered=num(valueInput.value);
    if(entered!==null&&entered>0&&entered<=1000) setDraftKg(fromDisplay(entered));
    valueInput.hidden=true;
    valueDisplay.hidden=false;
    valueBeforeEdit=valueInput.value;
    updateWeightDialDisplay();
  };
  const startTyping=()=>{
    valueBeforeEdit=valueInput.value;
    valueDisplay.hidden=true;
    valueInput.hidden=false;
    valueInput.focus();
    valueInput.select();
  };
  dial.addEventListener('pointerdown',event=>{
    if(event.target.closest('#weight-value-display, #weight-value')) return;
    const rect=dial.getBoundingClientRect();
    const radius=Math.hypot(event.clientX-(rect.left+rect.width/2),event.clientY-(rect.top+rect.height/2))/(rect.width/2);
    if(radius<.66||radius>.84) return;
    if(valueInput.value.trim()==='') setDraftKg(70);
    dragging=true;
    previousAngle=angleAt(event);
    angleRemainder=0;
    dial.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  dial.addEventListener('pointermove',event=>{
    if(!dragging) return;
    const angle=angleAt(event);
    let delta=angle-previousAngle;
    if(delta>180) delta-=360;
    if(delta< -180) delta+=360;
    previousAngle=angle;
    angleRemainder+=delta;
    const increments=Math.trunc(angleRemainder/2.5);
    if(increments){
      const current=num(valueInput.value);
      setDraftKg(fromDisplay(current||70)+increments*.1);
      angleRemainder-=increments*2.5;
    }
  });
  const stopDragging=()=>{dragging=false;previousAngle=null;angleRemainder=0;};
  dial.addEventListener('pointerup',stopDragging);
  dial.addEventListener('pointercancel',stopDragging);
  valueDisplay.addEventListener('click',startTyping);
  valueInput.addEventListener('blur',finishTyping);
  valueInput.addEventListener('keydown',event=>{
    if(event.key==='Enter'){event.preventDefault();finishTyping();valueInput.blur();}
    if(event.key==='Escape'){valueInput.value=valueBeforeEdit;finishTyping();}
  });
  dial.addEventListener('keydown',event=>{
    if(event.target!==dial) return;
    if(event.key==='ArrowUp'||event.key==='ArrowRight'){
      const current=num(valueInput.value);
      setDraftKg(fromDisplay(current||70)+.1);
      event.preventDefault();
    }else if(event.key==='ArrowDown'||event.key==='ArrowLeft'){
      const current=num(valueInput.value);
      setDraftKg(fromDisplay(current||70)-.1);
      event.preventDefault();
    }
  });
  updateWeightDialDisplay();
}

function updateWeightDialDisplay(){
  const valueInput=document.getElementById('weight-value');
  const valueDisplay=document.getElementById('weight-value-display');
  const dial=document.getElementById('weight-dial');
  const unitDisplay=document.getElementById('weight-dial-unit');
  const arc=document.getElementById('weight-dial-arc');
  const dots=document.getElementById('weight-dial-dots');
  if(!valueInput||!valueDisplay||!dial||!unitDisplay||!arc||!dots) return;
  const minKg=20,maxKg=300;
  const entered=num(valueInput.value);
  const hasValue=entered!==null&&entered>0;
  const kg=hasValue?(S.weightUnit==='lbs'?entered/LB_PER_KG:entered):null;
  valueDisplay.textContent=hasValue?(Math.round(entered*10)/10).toFixed(1):'—';
  unitDisplay.textContent=S.weightUnit||'kg';
  const normalized=kg===null?0:(Math.min(maxKg,Math.max(minKg,kg))-minKg)/(maxKg-minKg);
  arc.style.strokeDasharray=`${100*normalized} 100`;
  const activeCount=Math.round(normalized*(dots.children.length-1));
  [...dots.children].forEach((dot,index)=>dot.classList.toggle('active',hasValue&&index<=activeCount));
}

function vSet(){
  const rows=[['bg','Background'],['card','Main (cards)'],['acc','Accent Highlight'],['ink','Text Color'],['up','Trend Up (Green)'],['down','Trend Down (Red)']];
  const lastBackup=getLastFullBackupDate();
  const lastBackupLabel=lastBackup?fmt(lastBackup):'No full backup export recorded yet';
  
  let storageBytes = 0;
  try {
    const rawLogs = JSON.stringify(S.logs || {});

function hasExerciseHistory(record) {
  if (!record || typeof record !== 'object') return false;
  if (typeof record.note === 'string' && record.note.trim()) return true;
  return Array.isArray(record.sets) && record.sets.some(set => {
    if (!set || typeof set !== 'object') return false;
    const hasW = set.w !== '' && set.w !== null && set.w !== undefined;
    const hasR = set.r !== '' && set.r !== null && set.r !== undefined;
    return hasW || hasR;
  });
}
function findExIdByName(name) {
  const cleanName = String(name ?? '').trim();
  const normalized = cleanName.toLocaleLowerCase();
  if (!cleanName) return null;
  const allEx = [];
  Object.values(S.routines || {}).forEach(plan => (plan || []).forEach(day => (day.ex || []).forEach(ex => allEx.push(ex))));
  const archived = S.archivedExercises || {};
  const matches=[...allEx.filter(ex=>String(ex.name||'').trim().toLocaleLowerCase()===normalized).map(ex=>ex.id),
    ...Object.entries(archived).filter(([,ex])=>String(ex?.name||'').trim().toLocaleLowerCase()===normalized).map(([id])=>id)];
  const uniqueMatches=[...new Set(matches)];
  if(uniqueMatches.length===1) return uniqueMatches[0];

  let base = 'imported_' + (cleanName.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 48) || 'exercise');
  let id = base, suffix = 2;
  while ((allEx.some(ex => ex.id === id) || Object.prototype.hasOwnProperty.call(archived, id)) && String(archived[id]?.name || '').toLocaleLowerCase() !== normalized) id = `${base}_${suffix++}`;
  if (!S.archivedExercises) S.archivedExercises = {};
  if (!S.archivedExercises[id]) S.archivedExercises[id] = {name: cleanName, sets: 3, range: '8-12'};
  return id;
}
function parseCSVRows(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  const input = String(text ?? '').replace(/^\uFEFF/, '');
  for (let i = 0; i < input.length; i++) {
    const ch = input[i];
    if (quoted) {
      if (ch === '"' && input[i + 1] === '"') { field += '"'; i++; }
      else if (ch === '"') quoted = false;
      else field += ch;
    } else if (ch === '"') {
      quoted = true;
    } else if (ch === ',') {
      row.push(field); field = '';
    } else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && input[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if (quoted) throw new Error('CSV contains an unclosed quoted field.');
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function parseCSVLogs(text) {
  const rows = parseCSVRows(text);
  const logs = {};
  const weightLogs = {};
  if (!rows.length) return {logs,weightLogs,weightUnit:null};
  const header = rows[0].map(v => String(v).trim().toLowerCase());
  const col = name => header.indexOf(name);
  const dateCol = col('date'), exCol = col('exercise'), exIdCol = col('exercise id'), setCol = col('set'), weightCol = col('weight'), repsCol = col('reps'), noteCol = col('note'), unitCol = col('unit'), recordTypeCol = col('record type');
  if (dateCol < 0 || exCol < 0) throw new Error('CSV must contain Date and Exercise columns.');
  let weightUnit=null;
  rows.slice(1).forEach(parts=>{
    const recordType=recordTypeCol<0?'':String(parts[recordTypeCol]??'').trim().toLowerCase().replace(/[\s-]+/g,'_');
    if(recordType!=='body_weight'&&recordType!=='weight') return;
    const date=String(parts[dateCol]??'').trim();
    const rawWeight=weightCol<0?'':String(parts[weightCol]??'').trim();
    const rawUnit=unitCol<0?'':String(parts[unitCol]??'').trim().toLowerCase();
    const inputUnit=rawUnit==='lbs'||rawUnit==='lb'?'lbs':rawUnit==='kg'?'kg':null;
    const value=Number(rawWeight);
    if(!isValidISODate(date)) throw new Error('CSV body-weight entry has an invalid date.');
    if(rawWeight===''||!Number.isFinite(value)||value<=0||value>1000) throw new Error('CSV body-weight entry for '+date+' must be greater than 0 and no more than 1000.');
    if(!inputUnit) throw new Error('CSV body-weight entry for '+date+' must specify kg or lbs in the Unit column.');
    const kg=inputUnit==='lbs'?value/LB_PER_KG:value;
    if(!Number.isFinite(kg)||kg<=0||kg>1000) throw new Error('CSV body-weight entry for '+date+' is outside the supported range.');
    weightLogs[date]=Math.round(kg*1000)/1000;
    weightUnit=inputUnit;
  });
  if(rows.length<2) return {logs,weightLogs,weightUnit};
  rows.slice(1).forEach(parts => {
    if (!parts.some(v => String(v).trim() !== '')) return;
    const recordType=recordTypeCol<0?'':String(parts[recordTypeCol]??'').trim().toLowerCase().replace(/[\s-]+/g,'_');
    if(recordType==='body_weight'||recordType==='weight') return;
    const date = String(parts[dateCol] ?? '').trim();
    const exName = String(parts[exCol] ?? '').trim();
    if (!isValidISODate(date) || !exName) return;
    const rawSet = setCol < 0 ? '1' : String(parts[setCol] ?? '').trim();
    const setNo = rawSet === '' ? 0 : Number(rawSet);
    const rawWeight = weightCol < 0 ? '' : String(parts[weightCol] ?? '').trim();
    const inputUnit = unitCol >= 0 && ['lbs','lb'].includes(String(parts[unitCol] ?? '').trim().toLowerCase()) ? 'lbs' : 'kg';
    const rawReps = repsCol < 0 ? '' : String(parts[repsCol] ?? '').trim();
    const note = noteCol < 0 ? '' : String(parts[noteCol] ?? '');
    const importedId=exIdCol<0?'':String(parts[exIdCol]??'').trim();
    let exId=importedId||findExIdByName(exName);
    if(importedId && !Object.values(S.routines||{}).some(plan=>(plan||[]).some(day=>(day.ex||[]).some(ex=>ex.id===importedId))) && !S.archivedExercises?.[importedId]){
      if(!S.archivedExercises) S.archivedExercises={};
      S.archivedExercises[importedId]={name:exName,sets:3,range:'8-12'};
    }
    if(!exId) return;
    if (!logs[date]) logs[date] = {};
    if (!logs[date][exId]) logs[date][exId] = {sets: [], note: ''};
    if (Number.isInteger(setNo) && setNo > 0 && setNo <= 100) {
      while (logs[date][exId].sets.length < setNo) logs[date][exId].sets.push({w:'', r:''});
      const weight = rawWeight !== '' && Number.isFinite(Number(rawWeight)) && Number(rawWeight) >= 0 ? (inputUnit==='lbs'?Number(rawWeight)/LB_PER_KG:Number(rawWeight)) : '';
      const reps = rawReps !== '' && Number.isFinite(Number(rawReps)) && Number(rawReps) >= 0 ? Math.round(Number(rawReps)) : '';
      logs[date][exId].sets[setNo - 1] = {w: weight, r: reps};
    }
    if (note !== '') logs[date][exId].note = note;
  });
  return {logs,weightLogs,weightUnit};
}
function mergeImportedLogs(existing, incoming) {
  const merged = {...(existing || {})};
  Object.entries(incoming || {}).forEach(([date, exercises]) => {
    if (!isValidISODate(date) || !exercises || typeof exercises !== 'object') return;
    merged[date] = {...(merged[date] || {})};
    Object.entries(exercises).forEach(([id, record]) => {
      merged[date][id] = record;
    });
  });
  return merged;
}

function downloadTextFile(content, filename, mime='text/plain;charset=utf-8') {

function parseTXTWeightLogs(text) {
  const weightLogs={};
  const lines=String(text??'').replace(/^\uFEFF/,'').split(/\r?\n/);
  let inWeightSection=false,sectionUnit='kg',weightUnit=null;
  lines.forEach(line=>{
    const trimmed=line.trim();
    const heading=trimmed.match(/^BODY WEIGHT(?:\s*\((kg|lbs?|lb)\))?\s*$/i);
    if(heading){
      inWeightSection=true;
      const unit=String(heading[1]||'kg').toLowerCase();
      sectionUnit=unit==='lb'||unit==='lbs'?'lbs':'kg';
      return;
    }
    if(!inWeightSection) return;
    if(/^FULL RESTORE DATA\b|^LIFTLOG_BACKUP_JSON_BEGIN\b/i.test(trimmed)){inWeightSection=false;return;}
    if(!trimmed) return;
    const entry=trimmed.match(/^(\d{4}-\d{2}-\d{2})\s*:\s*([0-9]+(?:\.[0-9]+)?)\s*(kg|lbs?|lb)?\s*$/i);
    if(!entry) throw new Error('TXT body-weight entry is malformed: '+trimmed+'.');
    const date=entry[1],value=Number(entry[2]),unitText=String(entry[3]||sectionUnit).toLowerCase();
    const inputUnit=unitText==='lb'||unitText==='lbs'?'lbs':'kg';
    if(!isValidISODate(date)) throw new Error('TXT body-weight entry has an invalid date: '+date+'.');
    if(!Number.isFinite(value)||value<=0||value>1000) throw new Error('TXT body-weight entry for '+date+' must be greater than 0 and no more than 1000.');
    const kg=inputUnit==='lbs'?value/LB_PER_KG:value;
    if(!Number.isFinite(kg)||kg<=0||kg>1000) throw new Error('TXT body-weight entry for '+date+' is outside the supported range.');
    weightLogs[date]=Math.round(kg*1000)/1000;
    weightUnit=inputUnit;
  });
  return {weightLogs,weightUnit};
}

function parseTXTLogs(text) {
  const logs = {};
  const parsedWeights=parseTXTWeightLogs(text);
  const dateBlocks = text.split(/(?:^|\r?\n)DATE:\s*/i);
  dateBlocks.forEach(block => {
    const lines = block.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) return;
    const date = lines[0];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;

    let currentExId = null;
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i];
      if (line.toLowerCase().startsWith('exercise:')) {
        const exName = line.replace(/exercise:/i, '').trim();
        currentExId = findExIdByName(exName);
      } else if (currentExId && line.toLowerCase().startsWith('set')) {
        const match = line.match(/Set\s+(\d+):\s*([\d.]+|—)\s*kg\s*×\s*(\d+|—)\s*reps/i);
        if (match) {
          const setIdx = parseInt(match[1], 10) - 1;
          const weight = match[2] === '—' ? '' : Number(match[2]);
          const reps = match[3] === '—' ? '' : Number(match[3]);

          if (!logs[date]) logs[date] = {};
          if (!logs[date][currentExId]) logs[date][currentExId] = { sets: [], note: '' };

          while (logs[date][currentExId].sets.length <= setIdx) {
            logs[date][currentExId].sets.push({ w: '', r: '' });
          }
          logs[date][currentExId].sets[setIdx] = { w: weight, r: reps };
        }
      } else if (currentExId && (line.toLowerCase().startsWith('note json:') || line.toLowerCase().startsWith('note:'))) {
        const encoded=line.toLowerCase().startsWith('note json:');
        const rawNote = line.replace(encoded?/note json:/i:/note:/i, '').trim();
        let note=rawNote;
        if(encoded){ try{ const parsed=JSON.parse(rawNote); if(typeof parsed==='string') note=parsed; }catch(_){} }
        if (!logs[date]) logs[date] = {};
        if (!logs[date][currentExId]) logs[date][currentExId] = {sets: [], note: ''};
        logs[date][currentExId].note = note;
      }
    }
  });
  return {logs,weightLogs:parsedWeights.weightLogs,weightUnit:parsedWeights.weightUnit};
}

function timerSetPos(x, y){
  timerBox.style.left = x + 'px';
  timerBox.style.top = y + 'px';
  timerBox.style.right = 'auto';
  timerBox.style.bottom = 'auto';
}
function timerBodyFade(x){
  const body = timerBox.querySelector('.timer-body');
  if(!body) return;
  const w = timerW();
  const offL = Math.max(0, -x);
  const offR = Math.max(0, x + w - window.innerWidth);
  const off = Math.max(offL, offR);
  const span = Math.max(1, w - TIMER_DOCK_PEEK);
  body.style.opacity = String(Math.max(0.12, 1 - (off / span) * 0.9));
}
function timerSyncDockClass(x, settled){
  const w = timerW();
  const onLeft = x <= timerDockLeftX() + 2 || (settled && x < 0 && x + w < window.innerWidth * 0.45);
  const onRight = x >= timerDockRightX() - 2 || (settled && x + w > window.innerWidth && x > window.innerWidth * 0.55);
  const peekingLeft = x < -4;
  const peekingRight = x + w > window.innerWidth + 4;
  timerBox.classList.toggle('docked-left', settled ? (x <= 0 && x <= timerDockLeftX() + 8) : peekingLeft);
  timerBox.classList.toggle('docked-right', settled ? (x + w >= window.innerWidth - 8) : peekingRight);
  const arrow = document.getElementById('timer-dock-arrow');
  if(arrow){
    if(timerBox.classList.contains('docked-left')) arrow.textContent = '›';
    else if(timerBox.classList.contains('docked-right')) arrow.textContent = '‹';
  }
  timerBodyFade(x);
}
function timerUndockTo(x, y){
  timerBox.style.transition = TIMER_EASE;
  timerBox.classList.remove('docked-left','docked-right');
  const body = timerBox.querySelector('.timer-body');
  if(body) body.style.opacity = '';
  timerSetPos(x, timerClampY(y));
}
function timerSettleDock(side, y){
  timerBox.style.transition = TIMER_EASE;
  const x = side === 'left' ? timerDockLeftX() : timerDockRightX();
  timerSetPos(x, timerClampY(y));
  timerBox.classList.remove('docked-left','docked-right');
  timerBox.classList.add(side === 'left' ? 'docked-left' : 'docked-right');
  const arrow = document.getElementById('timer-dock-arrow');
  if(arrow) arrow.textContent = side === 'left' ? '›' : '‹';
  const body = timerBox.querySelector('.timer-body');
  if(body) body.style.opacity = '';
  haptic(10);
}

function initTimerDrag(e) {
  if (e.target.closest('button') && e.target.closest('button').hasAttribute('data-act')) return;
  if (timerBox.classList.contains('exiting')) return;
  if (timerTryStartScrub(e)) return;
  if(timerInertiaAnim) cancelAnimationFrame(timerInertiaAnim);

  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const rect = timerBox.getBoundingClientRect();

  timerDrag = {
    startX: clientX, startY: clientY,
    initialX: rect.left, initialY: rect.top,
    lastX: clientX, lastY: clientY,
    vx: 0, vy: 0,
    lastTime: Date.now(),
    moved: false,
    wasDocked: timerBox.classList.contains('docked-left') || timerBox.classList.contains('docked-right')
  };
  timerBox.style.transition = 'none';
  timerSetPos(rect.left, rect.top);
  timerBox.classList.remove('docked-left','docked-right');
  const body = timerBox.querySelector('.timer-body');
  if(body) body.style.opacity = '1';
}

function onTimerMove(e) {
  if (!timerDrag) return;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const now = Date.now();
  const dt = now - timerDrag.lastTime;

  if(dt > 0){
    timerDrag.vx = (clientX - timerDrag.lastX) / dt;
    timerDrag.vy = (clientY - timerDrag.lastY) / dt;
  }
  timerDrag.lastX = clientX;
  timerDrag.lastY = clientY;
  timerDrag.lastTime = now;

  const dx = clientX - timerDrag.startX;
  const dy = clientY - timerDrag.startY;

  if(Math.hypot(dx, dy) > 5 && !timerDrag.moved) {
    timerDrag.moved = true;
    timerBox.classList.add('dragging');
  }
  if(!timerDrag.moved) return;

  if(e.cancelable) e.preventDefault();

  let newX = timerClampXDrag(timerDrag.initialX + dx);
  let newY = timerClampY(timerDrag.initialY + dy);

  timerSetPos(newX, newY);
  timerSyncDockClass(newX, false);
}

function endTimerDrag(e) {
  if (!timerDrag) return;
  const moved = timerDrag.moved;
  const vx = timerDrag.vx || 0;
  const startY = timerDrag.initialY;
  const wasDocked = timerDrag.wasDocked;
  timerDrag = null;
  timerBox.classList.remove('dragging');

  const rect = timerBox.getBoundingClientRect();
  const w = rect.width;
  const x = rect.left;
  const y = rect.top;
  const mid = x + w / 2;
  const vw = window.innerWidth;

  if (!moved) {
    if(wasDocked){
      const targetX = x < vw / 2 ? 16 : Math.max(16, vw - w - 16);
      timerUndockTo(targetX, y);
    }
    return;
  }

  const pastLeft = x < -w * 0.28 || mid < vw * 0.22;
  const pastRight = x + w > vw + w * 0.28 || mid > vw * 0.78;
  const flickLeft = vx < -0.45;
  const flickRight = vx > 0.45;

  if (pastLeft || (flickLeft && mid < vw * 0.55)) {
    timerSettleDock('left', y);
  } else if (pastRight || (flickRight && mid > vw * 0.45)) {
    timerSettleDock('right', y);
  } else {
    timerBox.style.transition = TIMER_EASE;
    timerBox.classList.remove('docked-left','docked-right');
    const body = timerBox.querySelector('.timer-body');
    if(body) body.style.opacity = '1';
    let nx = x;
    if(nx < 12) nx = 12;
    if(nx + w > vw - 12) nx = vw - w - 12;
    timerSetPos(nx, timerClampY(y));
  }
}

let exerciseDrag = null;
let exerciseAutoScroll = null;

function exerciseCards(){
  return [...document.querySelectorAll('#app [data-ex-card]')];
}
function stopExerciseAutoScroll() {
  if (exerciseAutoScroll !== null) {
    clearInterval(exerciseAutoScroll);
    exerciseAutoScroll = null;
  }
}
function exerciseFlipOthers(except){
  const cards = exerciseCards().filter(c => c !== except && !c.classList.contains('drag-placeholder'));
  const before = new Map(cards.map(c => [c, c.getBoundingClientRect().top]));
  return () => {
    cards.forEach(c => {
      const top0 = before.get(c);
      if(top0 === undefined) return;
      const top1 = c.getBoundingClientRect().top;
      const dy = top0 - top1;
      if(Math.abs(dy) < 1) return;
      c.classList.remove('drag-shift');
      c.style.transition = 'none';
      c.style.transform = `translateY(${dy}px)`;
      void c.offsetWidth;
      c.classList.add('drag-shift');
      c.style.transition = '';
      c.style.transform = '';
      const clear = () => {
        c.classList.remove('drag-shift');
        c.style.transform = '';
        c.removeEventListener('transitionend', clear);
      };
      c.addEventListener('transitionend', clear);
    });
  };
}
function exerciseLiftCard(ed){
  const card = ed.card;
  const rect = card.getBoundingClientRect();
  ed.offsetY = ed.lastY - rect.top;
  ed.width = rect.width;
  ed.height = rect.height;
  ed.left = rect.left;

  const ph = document.createElement('div');
  ph.className = 'card exercise-card drag-placeholder';
  ph.style.height = rect.height + 'px';
  ph.style.marginBottom = getComputedStyle(card).marginBottom;
  ph.dataset.exCard = card.dataset.exCard;
  ed.placeholder = ph;
  card.parentNode.insertBefore(ph, card);

  card.classList.add('dragging');
  card.style.position = 'fixed';
  card.style.left = rect.left + 'px';
  card.style.width = rect.width + 'px';
  card.style.top = rect.top + 'px';
  card.style.margin = '0';
  card.style.zIndex = '200';
  card.style.pointerEvents = 'none';
  document.body.appendChild(card);
}
function exerciseMoveFloating(ed, clientY){
  const top = clientY - ed.offsetY;
  ed.card.style.top = top + 'px';
  ed.card.style.left = ed.left + 'px';
  ed.card.style.width = ed.width + 'px';
}
function exerciseUpdateSlot(ed, clientY){
  const ph = ed.placeholder;
  if(!ph || !ph.parentNode) return;
  const siblings = [...ph.parentNode.children].filter(
    el => el !== ph && el !== ed.card && el.hasAttribute && el.hasAttribute('data-ex-card') && !el.classList.contains('dragging')
  );
  let insertBeforeEl = null;
  for(const s of siblings){
    const r = s.getBoundingClientRect();
    const mid = r.top + r.height / 2;
    if(clientY < mid){ insertBeforeEl = s; break; }
  }
  const targetNext = insertBeforeEl;
  let afterPh = ph.nextElementSibling;
  while(afterPh && (afterPh === ed.card || afterPh.classList?.contains('dragging'))) afterPh = afterPh.nextElementSibling;

  if(targetNext === afterPh) return;

  const play = exerciseFlipOthers(ed.card);
  if(targetNext) ph.parentNode.insertBefore(ph, targetNext);
  else ph.parentNode.appendChild(ph);
  play();
}
function exerciseFinishVisual(ed){
  const card = ed.card;
  const ph = ed.placeholder;
  if(ph && ph.parentNode){
    ph.parentNode.insertBefore(card, ph);
    ph.remove();
  } else if(card.parentNode !== document.getElementById('app') && !card.closest('#app')){
    const host = document.querySelector('#log-content-container') || document.getElementById('app');
    if(host) host.appendChild(card);
  }
  card.classList.remove('dragging');
  card.style.position = '';
  card.style.left = '';
  card.style.top = '';
  card.style.width = '';
  card.style.margin = '';
  card.style.zIndex = '';
  card.style.pointerEvents = '';
  card.style.transform = '';
  document.querySelectorAll('#app .drag-shift').forEach(c => {
    c.classList.remove('drag-shift');
    c.style.transform = '';
    c.style.transition = '';
  });
}

document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('[data-drag-handle]');
  if (!handle || ui.tab !== 'today' || e.button > 0) return;
  const card = handle.closest('[data-ex-card]');
  if (!card) return;
  exerciseDrag = {
    id: card.dataset.exCard,
    card,
    startY: e.clientY,
    lastY: e.clientY,
    moved: false,
    pointerId: e.pointerId,
    placeholder: null,
    offsetY: 0,
    width: 0,
    height: 0,
    left: 0
  };
  try { handle.setPointerCapture(e.pointerId); } catch (_) {}
});
document.addEventListener('pointermove', e => {
  if (!exerciseDrag || (exerciseDrag.pointerId !== undefined && e.pointerId !== exerciseDrag.pointerId)) return;
  exerciseDrag.lastY = e.clientY;
  if (Math.abs(e.clientY - exerciseDrag.startY) > 5) {
    if(!exerciseDrag.moved){
      exerciseDrag.moved = true;
      document.body.classList.add('exercise-reordering');
      exerciseLiftCard(exerciseDrag);
      haptic(8);
    }
  }
  if (!exerciseDrag.moved) return;
  exerciseMoveFloating(exerciseDrag, e.clientY);
  exerciseUpdateSlot(exerciseDrag, e.clientY);

  const edge = 88;
  const y = e.clientY;
  let speed = 0;
  if (y < edge) speed = -Math.ceil((edge - y) / 5);
  else if (y > window.innerHeight - edge) speed = Math.ceil((y - (window.innerHeight - edge)) / 5);
  if (speed && exerciseAutoScroll === null) {
    exerciseAutoScroll = setInterval(() => {
      if (!exerciseDrag || !exerciseDrag.moved) return;
      const py = exerciseDrag.lastY;
      let step = 0;
      if (py < edge) step = -Math.max(3, Math.ceil((edge - py) / 4));
      else if (py > window.innerHeight - edge) step = Math.max(3, Math.ceil((py - (window.innerHeight - edge)) / 4));
      if (step) {
        window.scrollBy(0, step);
        exerciseMoveFloating(exerciseDrag, py);
        exerciseUpdateSlot(exerciseDrag, py);
      } else stopExerciseAutoScroll();
    }, 16);
  } else if (!speed) stopExerciseAutoScroll();
  e.preventDefault();
}, {passive:false});

function finishExerciseDrag(e) {
  if (!exerciseDrag) return;
  if (e && exerciseDrag.pointerId !== undefined && e.pointerId !== undefined && e.pointerId !== exerciseDrag.pointerId) return;
  const moved = exerciseDrag.moved;
  const dragSnapshot = exerciseDrag;
  exerciseDrag = null;
  stopExerciseAutoScroll();
  document.body.classList.remove('exercise-reordering');

  if (moved && dragSnapshot) {
    exerciseFinishVisual(dragSnapshot);
    const ids = exerciseCards()
      .filter(c => !c.classList.contains('drag-placeholder'))
      .map(c => c.dataset.exCard);
    const plan = getPlanForDate(ui.date);
    const day = plan[ui.day];
    const sourceDay = sourceDayForDate(ui.date,ui.day);
    if(!day || !Array.isArray(day.ex)) return;

    const byId = new Map(day.ex.map(ex => [ex.id, ex]));
    const planIdsInOrder = ids.filter(id => byId.has(id));
    let changed=false;
    if (planIdsInOrder.length === day.ex.length && new Set(planIdsInOrder).size === planIdsInOrder.length) {
      const reorderedPlan=planIdsInOrder.map(id => byId.get(id));
      const reordered=reorderedPlan.some((exercise,index)=>exercise.id!==day.ex[index].id);
      if(reordered){
        if(S.activeRoutine==='ppl'){
          changed=syncPplTemplateFromDay(sourceDay,reorderedPlan,ui.date)||changed;
        }else{
          sourceDay.ex=reorderedPlan;
          changed=true;
        }
      }
    }
    const offPlanIds=ids.filter(id=>!byId.has(id));
    const log=S.logs[ui.date]||{};
    const existingOffPlanOrder=Object.keys(log).filter(id=>offPlanIds.includes(id));
    if(offPlanIds.length>1&&offPlanIds.some((id,index)=>id!==existingOffPlanOrder[index])){
      const order=new Map(offPlanIds.map((id,index)=>[id,index]));
      S.logs[ui.date]=Object.fromEntries(Object.entries(log).sort((a,b)=>{
        const ai=order.has(a[0])?order.get(a[0]):Infinity;
        const bi=order.has(b[0])?order.get(b[0]):Infinity;
        return ai-bi;
      }));
      changed=true;
    }
    if(changed){
      saveState(0);
      render(true);
    }
  }
}

let swipeStartX = null, swipeStartY = null, swipeDX = 0;

document.addEventListener('touchstart', e => {
  if (ui.tab !== 'today' || document.body.classList.contains('exercise-reordering')) return;
  if (swipeSettling) return;
  if (swipeTrack) {
    swipeTrack = null; swipeActive = false; swipeStartX = null;
    render(true);
  }
  if (e.target.closest('.timer-widget') || e.target.closest('[data-drag-handle]') || e.target.closest('input') || e.target.closest('button') || e.target.closest('select') || e.target.closest('textarea') || e.target.closest('.tabs') || e.target.closest('.chart-wrap')) return;
  if (e.touches.length > 1) return;
  
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swipeDX = 0; 
  swipeActive = false;
}, {passive: true});

document.addEventListener('touchmove', e => {
  if (swipeStartX === null || ui.tab !== 'today') return;
  const dx = e.touches[0].clientX - swipeStartX;
  const dy = e.touches[0].clientY - swipeStartY;
  
  if (!swipeActive) {
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      swipeActive = true;
      initSwipeTrack();
    } else if (Math.abs(dy) > 12) {
      swipeStartX = null;
      return;
    }
  }
  
  if (swipeActive && swipeTrack) {
    e.preventDefault();
    swipeDX = dx;
    swipeTrack.style.transform = `translateX(${dx}px)`;
  }
}, {passive: false});

document.addEventListener('touchend', e => {
  if (swipeStartX === null || ui.tab !== 'today' || !swipeActive || !swipeTrack) {
    swipeStartX = null; swipeActive = false;
    return;
  }
  
  const threshold = Math.min(trackWidth * 0.25, 100);
  let targetX = 0, dateOffset = 0;
  
  if (swipeDX < -threshold) { 
    targetX = -trackWidth; 
    dateOffset = 1; 
  } else if (swipeDX > threshold) { 
    targetX = trackWidth; 
    dateOffset = -1; 
  }
  
  swipeSettling = true;
  swipeTrack.style.transition = "transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)";
  swipeTrack.style.transform = `translateX(${targetX}px)`;
  
  if (dateOffset !== 0) {
    haptic(15);
    const tabsEl = document.querySelector('#log-header-container .tabs');
    if (tabsEl) {
      const newIdx = dayFor(shiftDate(ui.date, dateOffset));
      const btns = tabsEl.querySelectorAll('button');
      btns.forEach((b, i) => b.classList.toggle('on', i === newIdx));
      animateTabsScroll(tabsEl, tabsTargetLeft(tabsEl), 300);
    }
  }

  setTimeout(() => {
    if (dateOffset !== 0) {
      ui.date = shiftDate(ui.date, dateOffset);
      ui.day = dayFor(ui.date);
    }
    swipeActive = false; 
    swipeTrack = null;
    swipeSettling = false;
    render(true);
  }, 300);
  
  swipeStartX = null; 
  swipeDX = 0;
});

document.addEventListener('touchcancel', () => {
  if (swipeActive && swipeTrack && !swipeSettling) {
    swipeSettling = true;
    swipeTrack.style.transition = "transform 0.25s cubic-bezier(0.25, 1, 0.5, 1)";
    swipeTrack.style.transform = "translateX(0px)";

/* Interactive Chart Scrubbing Handler */
let chartScrubState = null;
function updateChartScrub(e) {
  const { svg, pts } = chartScrubState;
  const rect = svg.getBoundingClientRect();
  let xPct = (e.clientX - rect.left) / rect.width;
  xPct = Math.max(0, Math.min(1, xPct));
  const svgX = xPct * 600;

  let closest = pts[0], minDx = Infinity, cIdx = 0;
  pts.forEach((p, idx) => {
    const dx = Math.abs(p.x - svgX);
    if(dx < minDx) { minDx = dx; closest = p; cIdx = idx; }
  });

  if(cIdx !== chartScrubState.lastIdx) {
    haptic(5);
    chartScrubState.lastIdx = cIdx;
  }

  let g = svg.querySelector('.scrub-g');
  if(!g) {
    svg.insertAdjacentHTML('beforeend', `
      <g class="scrub-g" style="pointer-events:none">

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('ex-name-input')) {
    e.preventDefault();
    e.target.blur();
    return;
  }
  if (e.key === 'Escape' && e.target.classList && e.target.classList.contains('ex-name-input')) {
    e.preventDefault();
    const card = e.target.closest('[data-ex-card]');
    const label = card && card.querySelector('.ex-name-label');
    if(label){ e.target.value = label.textContent || ''; e.target.style.display='none'; label.style.display=''; }
    return;
  }
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    e.preventDefault();
    if (e.target.dataset.f === 'w') {
      const reps=e.target.closest('.row')?.querySelector('input[data-f="r"]');
      if(reps) reps.focus(); else e.target.blur();
    } else if (e.target.dataset.f === 'r') {
      const inputs = Array.from(document.querySelectorAll('input[data-f="w"], input[data-f="r"]'));
      const availableInputs=inputs.filter(inp=>!inp.closest('.exercise-card.is-collapsed'));
      const idx = availableInputs.indexOf(e.target);
      const nextWeight = idx >= 0 ? availableInputs.slice(idx + 1).find(inp => inp.dataset.f === 'w') : null;
      if (nextWeight) nextWeight.focus(); else e.target.blur();
    } else e.target.blur();
  }
});

function commitRenameFromInput(input){
  if(!input || !input.getAttribute) return;
  const id = input.getAttribute('data-rename-id');
  if(!id) return;
  const card = input.closest('[data-ex-card]');
  const label = card && card.querySelector('.ex-name-label');
  const clean = String(input.value || '').trim();
  const previous = label ? String(label.textContent || '').trim() : '';
  const finishUi = (name)=>{
    if(label){ label.textContent = name; label.style.display = ''; }
    input.style.display = 'none';
    input.value = name;
  };
  if(!clean){
    showAppAlert('Please enter an exercise name.',()=>input.focus());
    return;
  }
  if(normName(clean) === normName(previous)){
    finishUi(previous);
    return;
  }
  const plan = getPlanForDate(ui.date);
  const day = plan[ui.day];
  if(day && day.ex && day.ex.some(item => item.id !== id && normName(item.name) === normName(clean))){
    showAppAlert('That name is already used by another exercise on this workout day.',()=>input.focus());
    return;
  }
  if(S.activeRoutine==='ppl'){
    const sourceDay=sourceDayForDate(ui.date,ui.day);
    const template=pplTemplateForDate(sourceDay,ui.date);
    const exercise=template.find(item=>item.id===id);
    if(!exercise||!syncPplTemplateFromDay(sourceDay,template.map(item=>item.id===id?{...item,name:clean}:item),ui.date,{[id]:previous})){
      showAppAlert('Could not sync the renamed PPL exercise.',()=>input.focus());
      return;
    }
  }else{
    const result = renameExerciseEverywhere(id, clean);
    if(!result.ok){
      showAppAlert('Could not rename the exercise.',()=>input.focus());
      return;
    }
  }
  invalidateDerived();
  saveState(0);
  // Update label in place; full re-render keeps progress/related lists consistent
  render(true);
}

document.addEventListener('focusout', e => {
  if(e.target && e.target.classList && e.target.classList.contains('ex-name-input')){
    // Defer so a click on another control can run first if needed
    const input = e.target;
    setTimeout(()=> {
      if(document.activeElement === input) return;
      if(input.style.display === 'none') return;
      commitRenameFromInput(input);
    }, 0);
  }
});

function showAppConfirm({ title, message, confirmLabel, danger, onConfirm }){
  // Remove any existing sheet
  const prev = document.getElementById('app-confirm-root');
  if(prev) prev.remove();

  const root = document.createElement('div');
  root.id = 'app-confirm-root';
  root.className = 'app-confirm-overlay';
  root.setAttribute('role', 'dialog');
  root.setAttribute('aria-modal', 'true');
  root.innerHTML =
    '<div class="app-confirm-card">'+
      '<h2>'+esc(title||'Confirm')+'</h2>'+
      '<p>'+esc(message||'')+'</p>'+
      '<div class="app-confirm-actions">'+
        '<button type="button" class="btn" data-ac="cancel">Cancel</button>'+
        '<button type="button" class="btn '+(danger?'danger-fill':'acc')+'" data-ac="ok">'+(esc(confirmLabel||'Confirm'))+'</button>'+
      '</div>'+
    '</div>';

  const finish = (ok)=>{
    root.remove();
    document.removeEventListener('keydown', onKey);
    if(ok && typeof onConfirm === 'function') onConfirm();
  };
  const onKey = (e)=>{
    if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
  };
  root.addEventListener('click', e=>{
    if(e.target === root) finish(false);
    const b = e.target.closest('[data-ac]');
    if(!b) return;
    finish(b.getAttribute('data-ac') === 'ok');
  });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(root);
  const okBtn = root.querySelector('[data-ac="ok"]');
  if(okBtn) setTimeout(()=>okBtn.focus(), 30);
}

    '</section>';
